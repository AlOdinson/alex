name: Temporary Apply ShareScreen Move Fix

on:
  push:
    branches:
      - feature/fix-board-screenshare-resize
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-board-screenshare-move-fix.mjs
      - name: Commit patch if needed
        run: |
          if git diff --quiet -- src/components/Board.jsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Board.jsx
          git commit -m "fix: let transient ShareScreen bypass object lease"
          git push origin HEAD:feature/fix-board-screenshare-resize
