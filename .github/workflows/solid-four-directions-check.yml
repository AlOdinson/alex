name: Verify solid four-direction creation

on:
  push:
    branches:
      - feat/solid-four-directions

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify shape palette
        run: node scripts/test-shape-palette.mjs
      - name: Verify solid geometry
        run: node scripts/test-solid-shape-geometry.mjs
      - name: Verify four-direction creation
        run: node scripts/test-solid-drag-mirroring.mjs
      - name: Verify localization
        run: node scripts/test-i18n.mjs
      - name: Build
        run: npm run build
