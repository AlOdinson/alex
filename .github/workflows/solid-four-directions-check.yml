name: Verify solid four-direction creation

on:
  push:
    branches:
      - feat/solid-four-directions

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run regression suite
        run: npm run test:sync
      - name: Build
        run: npm run build
