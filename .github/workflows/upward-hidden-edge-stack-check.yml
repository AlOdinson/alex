name: Verify upward hidden-edge stack

on:
  push:
    branches:
      - fix/solid-hidden-edge-stack

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify disappearing/front-stack regression
        run: node scripts/test-upward-hidden-edge-stack.mjs
      - name: Verify directional solid regression
        run: node scripts/test-solid-drag-mirroring.mjs
      - name: Verify solid geometry
        run: node scripts/test-solid-shape-geometry.mjs
      - name: Build
        run: npm run build
