name: Temporary Apply Board Screen Share Session

on:
  push:
    branches:
      - feature/board-screen-share-object

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'ci: apply board screen share session'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-board-screen-share-session.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ScreenShare.jsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: make screen share session editor-collaborative"
          git push
