name: Stage verified integrity implementation
on:
  push:
    branches: [feat/new-board-integrity-20260925]
    paths: [.integrity-ready]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/new-board-integrity-20260925
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode and validate source patch
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, pathlib
          parts = sorted(pathlib.Path('.integrity-patch').glob('part-*'))
          assert len(parts) == 4
          patch = lzma.decompress(base64.b64decode(''.join(p.read_text() for p in parts), validate=True))
          digest = hashlib.sha256(patch).hexdigest()
          assert digest == pathlib.Path('.integrity-ready').read_text().splitlines()[0].strip(), digest
          pathlib.Path('/tmp/integrity.patch').write_bytes(patch)
          print('Verified patch SHA256', digest)
          PY
          git apply --check --exclude=.github/workflows/board-integrity-ci.yml /tmp/integrity.patch
          git apply --exclude=.github/workflows/board-integrity-ci.yml /tmp/integrity.patch
          git apply --recount --check .integrity-patch/review.patch
          git apply --recount .integrity-patch/review.patch
          cp package-lock.json /tmp/integrity-source-package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run test:integrity
      - run: npm run test:browser-authority
      - run: npm run test:sync:ci
      - run: npm run test:screen-share
      - run: node --test scripts/test-board-creation-storage.mjs
      - run: npm run build
      - name: Preserve exact tested source on isolated branch
        run: |
          cp /tmp/integrity-source-package-lock.json package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts docs package.json package-lock.json public/version.json
          git commit -m 'feat: bounded event-driven integrity checks for new boards only'
          git push origin HEAD:feat/new-board-integrity-20260925
          mkdir -p integrity-native-results
          git rev-parse HEAD > integrity-native-results/source-commit.txt
          git rev-parse HEAD^{tree} > integrity-native-results/source-tree.txt
      - run: python -m pip install playwright==1.55.0
      - name: Native Chromium collaboration and integrity verification
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          INTEGRITY_RESULTS: integrity-native-results
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/integrity-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/alex/ > /dev/null; then break; fi
            sleep 1
          done
          python scripts/test-board-integrity-native.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrity-native-stage
          path: integrity-native-results
          retention-days: 7
          if-no-files-found: ignore
