name: Bottom Tool Dock Green V2

on:
  push:
    branches:
      - feature/bottom-tool-dock
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply bottom dock implementation
        run: python scripts/apply-bottom-tool-dock.py
      - name: Commit generated implementation if needed
        run: |
          if ! git diff --quiet -- src/components/Toolbar.jsx src/components/ShapePalette.jsx src/styles.css src/i18n.js package.json; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add src/components/Toolbar.jsx src/components/ShapePalette.jsx src/styles.css src/i18n.js package.json
            git commit -m "ui: move core tools to bottom dock"
            git push origin HEAD:feature/bottom-tool-dock
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Bottom dock regression
        run: node scripts/test-bottom-tool-dock.mjs
      - name: Toolbar and shape regressions
        run: |
          node scripts/test-browser-button-visibility.mjs
          node scripts/test-shape-palette.mjs
          node scripts/test-solid-shape-geometry.mjs
          node scripts/test-solid-drag-mirroring.mjs
          node scripts/test-i18n.mjs
      - name: Browser feature regressions
        run: npm run test:screen-share
      - name: Portable board regressions
        run: |
          node scripts/test-sync-convergence.mjs
          node scripts/test-authoritative-log.mjs
          node scripts/test-collaboration-safety.mjs
          node scripts/test-fast-board-library.mjs
          node scripts/test-drawing-presets.mjs
          node scripts/test-pencil-transform-regression.mjs
          node scripts/test-pencil-palm-regression.mjs
          node scripts/test-pencil-contact-arbitration.mjs
          node scripts/test-pencil-rapid-pinch-regression.mjs
          node scripts/test-pencil-original-input-path.mjs
          node scripts/test-pencil-diagnostics.mjs
          node scripts/test-pencil-diagnostics-runtime.mjs
      - name: Production build
        run: npm run build
