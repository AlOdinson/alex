name: Stage exact cold checkpoint source
on:
  push:
    branches: ['delivery/notebook-checkpoint-20261006']
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Verify tested source and upload immutable blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          repo='AlOdinson/alex'
          base='c06bb415f71c27c0a508003978643cf74cff362c'
          expected='b7e7cf2989a6018c0779a343748f95963016acb1'
          assert os.environ['GITHUB_REPOSITORY']==repo
          assert os.environ['GITHUB_REF']=='refs/heads/delivery/notebook-checkpoint-20261006'
          packed=base64.b64decode(pathlib.Path('.delivery/notebook-checkpoint.patch.xz.b64').read_text(),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='27633af0f4189b07c57cb53aa7220a365d880d6d674092d1bdb491e840747b5a'
          patch=pathlib.Path('/tmp/notebook-checkpoint.patch');patch.write_bytes(lzma.decompress(packed))
          fix=pathlib.Path('/tmp/notebook-checkpoint-compat.patch');fix.write_bytes(pathlib.Path('.delivery/notebook-checkpoint-compat.patch').read_bytes())
          assert hashlib.sha256(fix.read_bytes()).hexdigest()=='2becd91b09c49057352b365826f6f9425c10c6d653df19ff508eb01f37d1b3bb'
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          subprocess.run(['git','checkout','--detach',base],check=True)
          for item in (patch,fix):
              subprocess.run(['git','apply','--check','--index',str(item)],check=True)
              subprocess.run(['git','apply','--index',str(item)],check=True)
          assert git('write-tree')==expected
          allowed={'.github/workflows/notebook-no-video-ci.yml','docs/performance/notebook-checkpoint-20261006.md','scripts/notebook-ui-node-harness.mjs','scripts/test-board-startup-browser.mjs','scripts/test-notebook-checkpoint-preparation.mjs','src/components/Board.jsx','src/lib/boardTombstoneIndex.js','src/lib/indexedBoardModel.js','src/lib/notebookCheckpoint.js','src/lib/notebookRecords.js','src/lib/notebookSession.js'}
          paths=git('diff','--cached','--name-only').splitlines();assert set(paths)==allowed and len(paths)==11
          rows=[]
          for name in paths:
              value=pathlib.Path(name).read_bytes()
              request=urllib.request.Request('https://api.github.com/repos/'+repo+'/git/blobs',data=json.dumps({'content':base64.b64encode(value).decode(),'encoding':'base64'}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=30) as response:result=json.load(response)
              assert result['sha']==git('hash-object',name)
              rows.append({'path':name,'mode':'100644','type':'blob','sha':result['sha']})
          pathlib.Path('/tmp/checkpoint-tree.json').write_text(json.dumps(rows,indent=2))
          patch.write_bytes(subprocess.check_output(['git','diff','--cached','--binary',base]))
          print('VERIFIED_SOURCE_TREE='+expected)
          print('Immutable source blobs only; no product refs, main, deployments or user-data writes.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tested-checkpoint-patch-and-tree
          path: |
            /tmp/notebook-checkpoint.patch
            /tmp/checkpoint-tree.json
          retention-days: 7
