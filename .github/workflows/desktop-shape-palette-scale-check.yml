name: Desktop Shape Palette Scale Check

on:
  push:
    branches:
      - feature/shrink-desktop-shape-palette
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/test-desktop-shape-palette-scale.mjs
