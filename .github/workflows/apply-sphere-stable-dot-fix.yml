name: Apply Sphere Stable Dot Fix

on:
  push:
    branches:
      - feature/sphere-center-dot-stable-and-touching

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'ci: apply sphere stable dot implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply minimal sphere geometry fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/shapes.js')
          source = path.read_text()
          old = """    case 'sphere': {\n      const solid = lineStyle(options);\n      const hidden = lineStyle(options, true);\n      const centerDotRadius = Number(options.strokeWidth) / 2;\n      const centerDot = new Circle({\n        radius: centerDotRadius,\n        left: 0,\n        top: 0,\n        originX: 'center',\n        originY: 'center',\n        fill: options.stroke,\n        stroke: options.stroke,\n        strokeWidth: 0,\n        selectable: false,\n        evented: false,\n      });\n      object = group([\n        new Circle({ radius: 58, ...baseStyle(options) }),\n        new Path('M -56 5 A 56 20 0 0 0 56 5', solid),\n        new Path('M -56 5 A 56 20 0 0 1 56 5', hidden),\n        centerDot,\n      ]);\n      break;\n    }\n"""
          new = """    case 'sphere': {\n      const solid = lineStyle(options);\n      const hidden = lineStyle(options, true);\n      const centerDot = new Path('M -0.000001 0 L 0.000001 0', solid);\n      object = group([\n        new Circle({ radius: 58, ...baseStyle(options) }),\n        new Path('M -58 0 A 58 20 0 0 0 58 0', solid),\n        new Path('M -58 0 A 58 20 0 0 1 58 0', hidden),\n        centerDot,\n      ]);\n      break;\n    }\n"""
          if old not in source:
              raise SystemExit('Expected current sphere block was not found.')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/shapes.js
          git commit -m "fix: keep sphere center dot stable and touch equator"
          git push
