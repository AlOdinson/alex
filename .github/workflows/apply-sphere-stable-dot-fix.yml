name: Apply Sphere Stable Dot Fix

on:
  push:
    branches:
      - feature/sphere-center-dot-stable-and-touching

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply minimal sphere geometry fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/lib/shapes.js')
          source = path.read_text()
          source = re.sub(
              r"      const centerDotRadius = Number\(options\.strokeWidth\) / 2;\n      const centerDot = new Circle\(\{.*?\n      \}\);",
              "      const centerDot = new Path('M -0.000001 0 L 0.000001 0', solid);",
              source,
              count=1,
              flags=re.S,
          )
          source = source.replace("new Path('M -56 5 A 56 20 0 0 0 56 5', solid)", "new Path('M -58 0 A 58 20 0 0 0 58 0', solid)")
          source = source.replace("new Path('M -56 5 A 56 20 0 0 1 56 5', hidden)", "new Path('M -58 0 A 58 20 0 0 1 58 0', hidden)")
          path.write_text(source)
          PY
      - name: Commit implementation when changed
        run: |
          if git diff --quiet -- src/lib/shapes.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/shapes.js
          git commit -m "fix: keep sphere center dot stable and touch equator"
          git push
