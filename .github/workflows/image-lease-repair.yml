name: Image Lease Repair Verification
on:
  push:
    branches: [fix/image-selection-lease-20260926]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    if: github.ref == 'refs/heads/fix/image-selection-lease-20260926'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Confirm regression on unchanged production code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p repair-evidence
          test "$(git hash-object src/components/Board.jsx)" = dcce947fd355a9e192f237a570dd45811054fd12
          if node --test scripts/test-selection-lease-transform.mjs > repair-evidence/red.log 2>&1; then
            echo 'Expected baseline regression failure was not reproduced'; exit 1
          fi
          grep '# fail 7' repair-evidence/red.log
      - name: Apply exact locally verified repair
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          url = 'https://api.github.com/repos/AlOdinson/alex/git/blobs/db0a743a1f9f656fd066fb2c47a1a9a55864942b'
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              blob = json.load(response)
          raw = base64.b64decode(blob['content'])
          assert hashlib.sha1(f'blob {len(raw)}\0'.encode()+raw).hexdigest() == 'db0a743a1f9f656fd066fb2c47a1a9a55864942b'
          path = Path('src/components/Board.jsx')
          text = path.read_text()
          start = text.index("    canvas.on('before:transform', ({ transform, e: nativeEvent }) => {")
          end = text.index('\n    const broadcastLiveTransform =',start)
          path.write_text(text[:start] + raw.decode() + text[end:])
          assert subprocess.check_output(['git','hash-object',str(path)],text=True).strip() == '2c4e6bb20793f868116328bef82681252d416fae'
          path = Path('package.json')
          config = json.loads(path.read_text())
          old = 'node --test scripts/test-connectivity-recovery.mjs'
          assert old in config['scripts']['test:browser-authority']
          config['scripts']['test:browser-authority'] = config['scripts']['test:browser-authority'].replace(old,'node --test scripts/test-selection-lease-transform.mjs scripts/test-connectivity-recovery.mjs')
          config['scripts']['test:selection-lease'] = 'node --test scripts/test-selection-lease-transform.mjs'
          config['scripts']['test:selection-lease:browser'] = 'node scripts/test-selection-lease-transform-browser.mjs'
          path.write_text(json.dumps(config,indent=2)+'\n')
      - name: Verify repair and existing suites
        shell: bash
        run: |
          set -euo pipefail
          npm run test:selection-lease 2>&1 | tee repair-evidence/selection.log
          npm run test:browser-authority 2>&1 | tee repair-evidence/authority.log
          npm run test:sync:ci 2>&1 | tee repair-evidence/sync.log
          npm run test:screen-share 2>&1 | tee repair-evidence/screen.log
          npm run build 2>&1 | tee repair-evidence/build.log
          npm install --no-save --no-package-lock playwright-core@1.55.0
          npm run test:selection-lease:browser 2>&1 | tee repair-evidence/browser.log
      - name: Commit verified source only to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git add src/components/Board.jsx package.json
          git diff --cached --check
          git diff --cached --stat | tee repair-evidence/changes.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: resume held image transforms after selection lease grant'
          git rev-parse HEAD | tee repair-evidence/commit.txt
          git push origin HEAD:refs/heads/fix/image-selection-lease-20260926
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-lease-repair-evidence
          path: repair-evidence
          retention-days: 7
