name: Stage exact notebook split worker source
on:
  push:
    branches: ['delivery/notebook-split-worker-20261006']
permissions:
  contents: read
jobs:
  stage:
    if: github.repository == 'AlOdinson/alex' && github.ref == 'refs/heads/delivery/notebook-split-worker-20261006'
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Verify and export exact pending patch without changing product refs
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          packed=base64.b64decode(pathlib.Path('.delivery/notebook-split-worker.patch.xz.b64').read_text(),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='80636443ae0667a906c6dd9e16ef0011583ff21dad43e45e245969c5348de915'
          patch=pathlib.Path('/tmp/notebook-split-worker.patch');patch.write_bytes(lzma.decompress(packed))
          subprocess.run(['git','checkout','--detach','273255cad804e487024cf3a493e6563d20a1e818'],check=True)
          subprocess.run(['git','apply','--check','--index',str(patch)],check=True)
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='8d809bd9dbf0df1f5f1d2a21478bfcd7809a6c1c'
          pathlib.Path('/tmp/worker-tree.txt').write_text(tree+'\n')
          print('Verified exact pending source; no branch updates, deployment or data changes.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: notebook-pending-worker-source
          path: |
            /tmp/notebook-split-worker.patch
            /tmp/worker-tree.txt
          retention-days: 7
