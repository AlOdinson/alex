name: Board creation storage recovery

on:
  push:
    branches: [fix/board-creation-storage-20260924]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: board-creation-storage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export exact source for isolated verification
        run: git archive --format=tar HEAD > /tmp/board-creation-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: board-creation-source
          path: /tmp/board-creation-source.tar
          retention-days: 1
      - run: npm ci --no-audit --no-fund
      - name: Storage regression tests
        run: |
          if [ -f scripts/test-board-creation-storage.mjs ]; then
            node --test scripts/test-board-creation-storage.mjs
          fi
      - run: npm run test:browser-authority
      - run: npm run test:sync
      - run: npm run test:screen-share
      - run: npm run test:capacity-cleanup
      - run: npm run build
