name: Stage exact bounded notebook preparation source
on:
  push:
    branches: ['delivery/notebook-preparation-20261006']
permissions:
  contents: write
jobs:
  stage:
    if: github.repository == 'AlOdinson/alex' && github.ref == 'refs/heads/delivery/notebook-preparation-20261006'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Verify exact tested tree and upload immutable blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          repo='AlOdinson/alex';base='e54e45ed4ab79cfbac8319ecfbd971c4ff449c64';expected='9655941d34d64ddc5ac513c1a9cd967f88f34434'
          assert os.environ['GITHUB_REPOSITORY']==repo
          assert os.environ['GITHUB_REF']=='refs/heads/delivery/notebook-preparation-20261006'
          packed=pathlib.Path('.delivery/preparation.patch.xz').read_bytes()
          assert hashlib.sha256(packed).hexdigest()=='7de689aff5eb4a0d894e0d08ed1a29eb20d843cb2014e4d98c0b8a5fe9ff8a67'
          patch=pathlib.Path('/tmp/notebook-preparation.patch');patch.write_bytes(lzma.decompress(packed))
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          subprocess.run(['git','checkout','--detach',base],check=True)
          subprocess.run(['git','apply','--check','--index','--unidiff-zero',str(patch)],check=True)
          subprocess.run(['git','apply','--index','--unidiff-zero',str(patch)],check=True)
          assert git('write-tree')==expected
          allowed={'.github/workflows/notebook-no-video-ci.yml','docs/performance/notebook-preparation-20261006.md','scripts/notebook-preparation-fixture.js','scripts/notebook-ui-node-harness.mjs','scripts/test-notebook-bounded-preparation.mjs','scripts/test-notebook-preparation-browser.mjs','scripts/test-notebook-work-scheduler.mjs','src/components/Board.jsx','src/lib/boardNotebook.js','src/lib/notebookObjectPreparation.js','src/lib/notebookPageRuntime.js','src/lib/notebookProjection.js','src/lib/notebookWorkScheduler.js'}
          paths=git('diff','--cached','--name-only').splitlines();assert set(paths)==allowed and len(paths)==13
          for name in paths:
              value=pathlib.Path(name).read_bytes()
              request=urllib.request.Request('https://api.github.com/repos/'+repo+'/git/blobs',data=json.dumps({'content':base64.b64encode(value).decode(),'encoding':'base64'}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=30) as response:result=json.load(response)
              assert result['sha']==git('hash-object',name)
              print(name,result['sha'])
          print('VERIFIED_LOCAL_TREE='+expected)
          print('Immutable blobs only; no branch-ref, main, deployment, migration or user-data writes.')
          PY
