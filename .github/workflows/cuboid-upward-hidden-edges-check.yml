name: Verify cuboid upward hidden edges

on:
  push:
    branches:
      - fix/cuboid-upward-hidden-edges

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify cuboid upward hidden-edge pairing
        run: node scripts/test-upward-hidden-edge-stack.mjs
