name: Verify cuboid upward hidden edges

on:
  push:
    branches:
      - fix/cuboid-upward-hidden-edges

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply cuboid fix
        run: node scripts/apply-cuboid-upward-hidden-edges-fix.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify cuboid upward hidden-edge pairing
        run: node scripts/test-upward-hidden-edge-stack.mjs
      - name: Verify directional solids
        run: node scripts/test-solid-drag-mirroring.mjs
      - name: Verify solid geometry
        run: node scripts/test-solid-shape-geometry.mjs
      - name: Build
        run: npm run build
      - name: Commit production change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/shapes.js
          git commit -m "fix: switch cuboid hidden edges for upward drags"
          git push origin HEAD:fix/cuboid-upward-hidden-edges
