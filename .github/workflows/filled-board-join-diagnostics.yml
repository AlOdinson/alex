name: Filled Board Join Diagnostics

on:
  push:
    branches: [fix/filled-board-join-20260915]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Package tracked source for reproducible investigation
        run: git archive --format=tar.gz --output=alex-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: filled-board-join-source
          path: alex-source.tar.gz
          retention-days: 1
