name: Filled Board Join Verification

on:
  push:
    branches: [fix/filled-board-join-20260915]

permissions:
  contents: write

concurrency:
  group: filled-board-join-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply isolated source fixes and verify exact tested bytes
        run: |
          git apply --check scripts/filled-board-runtime.patch scripts/filled-board-transport.patch
          git apply scripts/filled-board-runtime.patch scripts/filled-board-transport.patch
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'package.json';
          const source = fs.readFileSync(path, 'utf8');
          const old = 'node --test scripts/test-fresh-owner-bootstrap.mjs';
          if (!source.includes(old)) throw new Error('Unexpected test entrypoint');
          fs.writeFileSync(path, source.replace(old, 'node --test scripts/test-filled-board-join.mjs scripts/test-fresh-owner-bootstrap.mjs'));
          NODE
          sha256sum -c <<'SUMS'
          4cca2e50f48f585f01c2961d53105b96400f2799be20c0ae81f874f68d96d18d  src/durableEditGate.js
          b9d7a38137709966c00955ea2602f41b1e03ddd6f3ca4ad567da2552491ac2ad  src/lib/browserBoardSession.js
          e710f893802dbc7147efc9582c45e7853849e9a614122a2a4c436c6e9b990783  src/lib/peerDataChannel.js
          44844e0de56d06b88731c97622bcfd37d7f126c67fff9b1ab571cb896a5db442  src/lib/peerProtocol.js
          e4f055ed9267ac52f6f2e6289638edb478ba8223cdc28c4639de77abb25caf26  src/lib/studentPeerNetwork.js
          8726f0bb1c2372bc099fe544f7922d332723e43316fddaa700dcbdc969e05683  src/lib/studentPeerSession.js
          5e3246245a59812ad4b6572c6d91aaa44766c39048493a3701ba5ade990006b9  src/lib/teacherPeerNetwork.js
          98c5c070241d5ca771ba0cf39eac621f3569134cced4045942fc00679f6a5494  scripts/test-filled-board-join.mjs
          4d0974a2297c5902ebd6fd6f56ffe8664f1497c3e84954b4ab51664b51d25c0f  package.json
          SUMS
          git diff --check
      - name: Install dependencies as in production
        run: npm install --no-audit --no-fund
      - name: Browser authority regression suite
        run: npm run test:browser-authority
      - name: Board and synchronization regressions
        run: npm run test:sync:ci
      - name: Production build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          npm run build
      - name: Install browser test driver
        run: npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Chromium filled-board join, reload truth and reconnection
        env:
          BROWSER_AUTHORITY_PREVIEW_URL: http://127.0.0.1:4173/alex/
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/alex-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/alex/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/test-browser-authority-large-snapshot-e2e.mjs
          node scripts/test-browser-authority-source-of-truth-e2e.mjs
          node scripts/test-browser-authority-datachannel-recovery-e2e.mjs
      - name: Commit verified source only to the isolated fix branch
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json src/durableEditGate.js src/lib/browserBoardSession.js src/lib/peerDataChannel.js src/lib/peerProtocol.js src/lib/studentPeerNetwork.js src/lib/studentPeerSession.js src/lib/teacherPeerNetwork.js
          git commit -m 'fix: fast filled-board snapshots and bounded peer synchronization'
          git push origin HEAD:fix/filled-board-join-20260915
          git rev-parse HEAD
