name: Screen-share receiver FPS diagnosis
on:
  push:
    branches: ['diagnostic/screen-share-receiver-20261003']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: receiver-fps-${{ github.ref }}
  cancel-in-progress: true
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, engine: chromium, kind: same}
          - {os: macos-latest, engine: webkit, kind: same}
          - {os: macos-latest, engine: webkit, kind: cross}
          - {os: macos-latest, engine: chromium, kind: cross}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      VERIFICATION_BROWSER: ${{ matrix.engine }}
      RECEIVER_AUDIT_CROSS: ${{ matrix.kind == 'cross' && '1' || '0' }}
      WEBKIT_LOCAL_ICE: '1'
      VITE_NOTEBOOK_OPERATIONS_V1: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --no-package-lock playwright-core@1.62.1
      - run: node node_modules/playwright-core/cli.js install --with-deps ${{ matrix.kind == 'cross' && 'chromium webkit' || matrix.engine }}
      - name: Empty receiver compositor same-connection A/B
        run: node scripts/run-empty-receiver-compositor-audit.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compositor-ab-${{ matrix.kind }}-${{ matrix.engine }}
          path: receiver-diagnostic-results/
          retention-days: 7
