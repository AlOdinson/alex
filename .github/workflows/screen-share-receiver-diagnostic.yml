name: Screen-share receiver FPS diagnosis
on:
  push:
    branches: ['diagnostic/screen-share-receiver-20261003']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: receiver-fps-${{ github.ref }}
  cancel-in-progress: true
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, engine: chromium}
          - {os: macos-latest, engine: webkit}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      VERIFICATION_BROWSER: ${{ matrix.engine }}
      WEBKIT_LOCAL_ICE: '1'
      VITE_NOTEBOOK_OPERATIONS_V1: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --no-package-lock playwright-core@1.62.1
      - run: node node_modules/playwright-core/cli.js install --with-deps ${{ matrix.engine }}
      - name: Resolve diagnostic browser import through Vite
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/run-receiver-fullboard-diagnostic.mjs')
          s=p.read_text()
          assert s.count("import('fabric')")==1
          p.write_text(s.replace("import('fabric')", "import('/alex/node_modules/.vite/deps/fabric.js')"))
          PY
      - name: Measure full Board, actual mode buttons, filled notebook and selection
        run: node scripts/run-receiver-fullboard-diagnostic.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receiver-fps-${{ matrix.engine }}
          path: receiver-diagnostic-results/
          retention-days: 7
