name: Student reading workspace
on:
  push:
    branches: [feat/student-readonly-documents-20261003]
    paths: [.github/workflows/student-reading-workspace.yml, 'scripts/**', 'src/**']
permissions:
  contents: read
env:
  VITE_NOTEBOOK_OPERATIONS_V1: "true"
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.patch.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
      - name: Apply exact diagnostic patch on the isolated branch
        id: patch
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = feat/student-readonly-documents-20261003
          if test -f .student-reading-trial.patch.b64; then
            base64 -d .student-reading-trial.patch.b64 | gunzip > /tmp/reading.patch
            echo 'ad05599f2f9b2a1717d21cb3e8bc18b9f042a64f4ac1d81ecb6c86a0ff493f5d  /tmp/reading.patch' | sha256sum -c -
            git apply --check /tmp/reading.patch
            git apply /tmp/reading.patch
            rm .student-reading-trial.patch.b64
            node --check scripts/test-student-document-reading-browser.mjs
            git diff --check
            git add scripts/test-student-document-reading-browser.mjs .student-reading-trial.patch.b64
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test: assert durable PDF fixture and visible page pixels'
            git push origin HEAD:refs/heads/feat/student-readonly-documents-20261003
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: |
          git archive --format=tar.gz HEAD -o /tmp/student-reading-source.tar.gz
          git rev-parse HEAD > /tmp/student-reading-source.sha
      - uses: actions/upload-artifact@v4
        with:
          name: student-reading-source
          path: /tmp/student-reading-source.*
          retention-days: 7
  browser:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, engine: chromium}
          - {os: macos-latest, engine: webkit}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --no-package-lock playwright-core@1.62.1
      - run: node node_modules/playwright-core/cli.js install --with-deps ${{ matrix.engine }}
      - run: node scripts/copy-pdf-support.mjs
      - name: Real offline document selection and pagination
        env:
          VERIFICATION_BROWSER: ${{ matrix.engine }}
        run: npm run test:student:reading:browser
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-reading-${{ matrix.engine }}
          path: student-document-reading-results/
          retention-days: 7
