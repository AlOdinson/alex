name: Notebook position and drop regressions

on:
  push:
    branches: ['fix/notebook-position-drop-20261002']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notebook-drop-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_NOTEBOOK_OPERATIONS_V1: 'true'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - name: Apply integrity-checked local patch
        run: python3 .github/apply-notebook-drop.py
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci --no-audit --no-fund
      - run: npm run test:notebook
      - run: npm run test:browser-authority
      - run: npm run test:student:storage
      - run: npm run test:media
      - run: npm run test:pencil
      - run: npm run test:connections
      - run: npm run test:screen-share
      - run: npm run test:sync:ci
      - run: npm run build

  browser:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, engine: chromium}
          - {os: macos-latest, engine: webkit}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      VERIFICATION_BROWSER: ${{ matrix.engine }}
      WEBKIT_LOCAL_ICE: '1'
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - run: python3 .github/apply-notebook-drop.py
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --no-package-lock playwright-core@1.62.1
      - run: node node_modules/playwright-core/cli.js install --with-deps ${{ matrix.engine }}
      - name: Actual notebook movement, image insertion, single and group drops, undo and redo
        run: npm run test:notebook:browser
      - name: Notebook incremental performance regressions
        run: npm run test:notebook:performance -- --stage-b
      - name: Notebook with received 720p60 and 1080p60 test video
        run: npm run test:notebook:video
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-drop-${{ matrix.engine }}
          path: |
            notebook-drop-results/
            /tmp/notebook-performance.json
            /tmp/notebook-received-video.json
          retention-days: 7

  publish-tested-source:
    needs: [verify, browser]
    if: github.ref == 'refs/heads/fix/notebook-position-drop-20261002'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with: {ref: '${{ github.sha }}'}
      - name: Materialize the same verified source and remove delivery-only files
        run: |
          python3 .github/apply-notebook-drop.py
          git rm .github/notebook-drop.patch.gz.b64 .github/apply-notebook-drop.py .github/workflows/notebook-drop-ci.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve notebook position and capture deliberate selection drops (1.43.1)'
          git push origin HEAD:refs/heads/fix/notebook-position-drop-20261002
          git rev-parse HEAD > "$RUNNER_TEMP/notebook-drop-tested-sha.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/notebook-drop-tested-source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: notebook-drop-tested-source
          path: |
            ${{ runner.temp }}/notebook-drop-tested-sha.txt
            ${{ runner.temp }}/notebook-drop-tested-source.tar.gz
          retention-days: 7
