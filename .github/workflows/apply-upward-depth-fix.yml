name: Apply upward hidden-edge depth fix

on:
  push:
    branches:
      - fix/upward-hidden-edge-depth
    paths:
      - .github/workflows/apply-upward-depth-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Patch hidden-edge compositing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/shapes.js')
          source = path.read_text()
          old = """const HIDDEN_EDGE_DASH = [5, 5];
"""
          new = """const HIDDEN_EDGE_DASH = [5, 5];
const UPWARD_REAR_COMPOSITE_SOLID_IDS = new Set(['wire-cube', 'pyramid']);
"""
          if old not in source:
              raise SystemExit('missing hidden-edge constant anchor')
          source = source.replace(old, new, 1)
          old = """  const hiddenIndexes = new Set(flippedUp ? edgeIndexes.up : edgeIndexes.down);
  for (const [index, child] of object.getObjects().entries()) {
    const shouldBeHidden = hiddenIndexes.has(index);
    const isHidden = Array.isArray(child?.strokeDashArray) && child.strokeDashArray.length > 0;
    if (shouldBeHidden === isHidden) continue;
    child.set({ strokeDashArray: shouldBeHidden ? [...HIDDEN_EDGE_DASH] : null });
  }
"""
          new = """  const hiddenIndexes = new Set(flippedUp ? edgeIndexes.up : edgeIndexes.down);
  const compositeRearBehind = flippedUp && UPWARD_REAR_COMPOSITE_SOLID_IDS.has(shapeId);
  for (const [index, child] of object.getObjects().entries()) {
    const shouldBeHidden = hiddenIndexes.has(index);
    const isHidden = Array.isArray(child?.strokeDashArray) && child.strokeDashArray.length > 0;
    const globalCompositeOperation = compositeRearBehind && shouldBeHidden ? 'destination-over' : 'source-over';
    const compositeChanged = child?.globalCompositeOperation !== globalCompositeOperation;
    if (shouldBeHidden === isHidden && !compositeChanged) continue;
    child.set({
      strokeDashArray: shouldBeHidden ? [...HIDDEN_EDGE_DASH] : null,
      globalCompositeOperation,
    });
  }
"""
          if old not in source:
              raise SystemExit('missing applyDirectionalHiddenEdges anchor')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify regression
        run: node scripts/test-solid-drag-mirroring.mjs
      - name: Verify geometry
        run: node scripts/test-solid-shape-geometry.mjs
      - name: Build
        run: npm run build
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/shapes.js
          git commit -m "fix: render upward hidden edges behind visible geometry"
          git push origin HEAD:fix/upward-hidden-edge-depth
