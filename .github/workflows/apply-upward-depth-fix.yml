name: Apply upward hidden-edge depth fix

on:
  push:
    branches:
      - fix/upward-hidden-edge-depth
    paths:
      - .github/workflows/apply-upward-depth-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: node scripts/apply-upward-depth-fix.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify regression
        run: node scripts/test-solid-drag-mirroring.mjs
      - name: Verify geometry
        run: node scripts/test-solid-shape-geometry.mjs
      - name: Build
        run: npm run build
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/shapes.js
          git commit -m "fix: render upward hidden edges behind visible geometry"
          git push origin HEAD:fix/upward-hidden-edge-depth
