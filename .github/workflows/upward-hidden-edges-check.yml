name: Verify upward solid hidden edges

on:
  push:
    branches:
      - fix/upward-solid-hidden-edges

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify directional hidden edges
        run: node scripts/test-solid-drag-mirroring.mjs
      - name: Verify solid geometry
        run: node scripts/test-solid-shape-geometry.mjs
      - name: Build
        run: npm run build
