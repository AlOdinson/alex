name: Apply Board canonical clear patch

on:
  push:
    branches:
      - fix/browser-authority-convergence
    paths:
      - .github/workflows/patch-board-snapshot-gate.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/browser-authority-convergence
          fetch-depth: 0

      - name: Apply exact canonical clear patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/Board.jsx')
          source = path.read_text()

          old_import = "import { createAuthoritativeSnapshotGate } from '../lib/authoritativeSnapshotGate.js';\n"
          new_import = old_import + "import { planCanonicalBoardClear } from '../lib/canonicalBoardClear.js';\n"
          if source.count(old_import) != 1:
            raise SystemExit('authoritative snapshot gate import match is not unique')
          source = source.replace(old_import, new_import, 1)

          old_clear = '''  const clearBoard = useCallback(() => {
    const canvas = fabricCanvasRef.current;
    if (!canvas || !isOwner) return;
    if (!window.confirm('Удалить все линии и штрихи с доски?')) return;
    const objects = canvas.getObjects().filter((object) => !object.transientScreenShare);
    if (!objects.length) return;
    const records = getObjectRecords(objects);
    const ids = records.map((record) => record.object.boardObjectId).filter(Boolean);
    applyingRemoteRef.current = true;
    const composedDelete = localDeletionCompositorRef.current?.removeObjects?.(objects, { fullCanvas: true });
    if (!composedDelete) objects.forEach((object) => canvas.remove(object));
    applyingRemoteRef.current = false;
    canvas.discardActiveObject();
    if (!composedDelete) canvas.requestRenderAll();
    updateSelectionState();
    updateSelectionStyleState();
    sendDeletes(ids);
    recordAction({ type: 'delete', records });
    schedulePersistence();
  }, [getObjectRecords, isOwner, recordAction, schedulePersistence, sendDeletes, updateSelectionState]);
'''
          new_clear = '''  const clearBoard = useCallback(async () => {
    const canvas = fabricCanvasRef.current;
    if (!canvas || !isOwner) return;
    if (!window.confirm('Удалить все линии и штрихи с доски?')) return;

    const objects = canvas.getObjects().filter((object) => !object.transientScreenShare);
    const records = getObjectRecords(objects);
    let authoritySnapshot = null;
    try {
      const recovery = await getBoardRecovery(boardId, boardKey);
      authoritySnapshot = recovery?.snapshot ?? null;
    } catch (error) {
      console.warn('Не удалось получить каноническое состояние перед очисткой доски', error);
    }

    const { deleteIds, undoRecords } = planCanonicalBoardClear({
      visibleRecords: records,
      authoritySnapshot,
    });
    if (!deleteIds.length && !objects.length) {
      canvas.requestRenderAll();
      return;
    }

    applyingRemoteRef.current = true;
    const composedDelete = localDeletionCompositorRef.current?.removeObjects?.(objects, { fullCanvas: true });
    if (!composedDelete) objects.forEach((object) => canvas.remove(object));
    applyingRemoteRef.current = false;
    canvas.discardActiveObject();
    // Cropped deletion patches are only an interaction optimization. A completed
    // full-board clear must always rebuild pixels from the canonical Fabric object list.
    canvas.requestRenderAll();
    updateSelectionState();
    updateSelectionStyleState();

    if (deleteIds.length) sendDeletes(deleteIds);
    if (undoRecords.length) recordAction({ type: 'delete', records: undoRecords });
    schedulePersistence();
  }, [
    boardId,
    boardKey,
    getObjectRecords,
    isOwner,
    recordAction,
    schedulePersistence,
    sendDeletes,
    updateSelectionState,
    updateSelectionStyleState,
  ]);
'''
          if source.count(old_clear) != 1:
            raise SystemExit(f'clearBoard exact match count={source.count(old_clear)}')
          source = source.replace(old_clear, new_clear, 1)

          path.write_text(source)
          PY

          git diff --check
          git diff -- src/components/Board.jsx

      - name: Commit patch
        run: |
          git config user.name "Alex Board CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/Board.jsx
          git commit -m "fix: clear canonical authority remnants"
          git push origin HEAD:fix/browser-authority-convergence
