name: Add forced snapshot E2E gate

on:
  push:
    branches:
      - fix/browser-authority-convergence
    paths:
      - .github/workflows/patch-board-snapshot-gate.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/browser-authority-convergence
          fetch-depth: 0

      - name: Add large snapshot convergence E2E
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/browser-authority-ci.yml')
          source = path.read_text()
          marker = """      - name: Chromium silent DataChannel recovery convergence E2E\n        env:\n          BROWSER_AUTHORITY_PREVIEW_URL: https://alodinson.github.io/alex/preview-browser-authority/\n        run: node scripts/test-browser-authority-datachannel-recovery-e2e.mjs\n"""
          replacement = """      - name: Chromium large-board full-snapshot convergence E2E\n        env:\n          BROWSER_AUTHORITY_PREVIEW_URL: https://alodinson.github.io/alex/preview-browser-authority/\n        run: node scripts/test-browser-authority-large-snapshot-e2e.mjs\n\n""" + marker
          if source.count(marker) != 1:
            raise SystemExit(f'expected one insertion marker, got {source.count(marker)}')
          path.write_text(source.replace(marker, replacement, 1))
          PY

          git diff --check
          git diff -- .github/workflows/browser-authority-ci.yml

      - name: Commit workflow gate
        run: |
          git config user.name "Alex Board CI"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/browser-authority-ci.yml
          git commit -m "test: gate large-board snapshot convergence"
          git push origin HEAD:fix/browser-authority-convergence
