name: Apply stale recovery guard

on:
  push:
    branches:
      - fix/browser-authority-convergence
    paths:
      - .github/workflows/patch-board-snapshot-gate.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/browser-authority-convergence
          fetch-depth: 0

      - name: Guard bootstrap recovery with peer snapshot high-water mark
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/Board.jsx')
          source = path.read_text()
          old = """      const recoveryRevision = Number(recovery.revision ?? accessCurrentRevision);\n      await applyAuthoritativeSnapshot(recoveredSnapshot, recoveryRevision);\n"""
          new = """      const recoveryRevision = Number(recovery.revision ?? accessCurrentRevision);\n      // A full P2P authority snapshot may have arrived while this older recovery request\n      // was in flight. Never let an equal/older bootstrap response resurrect stale objects.\n      if (!authoritativeSnapshotGate.shouldApplyRecovery(recoveryRevision)) {\n        schedulePersistence(700);\n        return;\n      }\n      await applyAuthoritativeSnapshot(recoveredSnapshot, recoveryRevision);\n"""
          if source.count(old) != 1:
            raise SystemExit(f'expected one recovery apply site, got {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY

          git diff --check
          git diff -- src/components/Board.jsx

      - name: Commit patch
        run: |
          git config user.name "Alex Board CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/Board.jsx
          git commit -m "fix: reject stale bootstrap recovery after peer snapshot"
          git push origin HEAD:fix/browser-authority-convergence
