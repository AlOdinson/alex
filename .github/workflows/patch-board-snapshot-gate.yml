name: Apply Board snapshot gate patch

on:
  push:
    branches:
      - fix/browser-authority-convergence
    paths:
      - .github/workflows/patch-board-snapshot-gate.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/browser-authority-convergence
          fetch-depth: 0

      - name: Apply exact snapshot gate patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/Board.jsx')
          source = path.read_text()

          replacements = [
            (
              "import { createPencilDiagnostics } from '../lib/pencilDiagnostics.js';\n",
              "import { createPencilDiagnostics } from '../lib/pencilDiagnostics.js';\nimport { createAuthoritativeSnapshotGate } from '../lib/authoritativeSnapshotGate.js';\n",
            ),
            (
              "    async function loadInitialData() {\n",
              "    const authoritativeSnapshotGate = createAuthoritativeSnapshotGate({\n      isReady: () => boardReadyRef.current,\n      applySnapshot: applyAuthoritativeSnapshot,\n    });\n\n    async function loadInitialData() {\n",
            ),
            (
              "      boardReadyRef.current = true;\n      syncFromServer(false);\n",
              "      boardReadyRef.current = true;\n      await authoritativeSnapshotGate.flush();\n      syncFromServer(false);\n",
            ),
            (
              "      onGameLibraryVisibility: handleRemoteGameLibraryVisibility,\n      onScreenShareSignal(payload) {\n",
              "      onGameLibraryVisibility: handleRemoteGameLibraryVisibility,\n      onSnapshot(snapshot, revision) {\n        return authoritativeSnapshotGate.receive(snapshot, revision);\n      },\n      onScreenShareSignal(payload) {\n",
            ),
            (
              "    return () => {\n      disposed = true;\n      cancelCreationDraft('unmount');\n",
              "    return () => {\n      disposed = true;\n      authoritativeSnapshotGate.close();\n      cancelCreationDraft('unmount');\n",
            ),
          ]

          for old, new in replacements:
            count = source.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one Board.jsx match, got {count}: {old[:80]!r}')
            source = source.replace(old, new, 1)

          path.write_text(source)
          PY

          git diff --check
          git diff -- src/components/Board.jsx

      - name: Commit patch
        run: |
          git config user.name "Alex Board CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/Board.jsx
          git commit -m "fix: apply teacher snapshot after student bootstrap"
          git push origin HEAD:fix/browser-authority-convergence
