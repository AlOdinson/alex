name: Export candidate 7a928 source
on:
  push:
    branches: ['delivery/export-7a928-20261007']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 7a928018ee5960ebf63c3e91a88588e6ea7e92d9
          persist-credentials: false
          fetch-depth: 0
      - name: Export exact source
        run: |
          test "$(git rev-parse HEAD)" = 7a928018ee5960ebf63c3e91a88588e6ea7e92d9
          mkdir -p /tmp/candidate-source
          git branch exact-candidate HEAD
          git bundle create /tmp/candidate-source/source.bundle exact-candidate
          git rev-parse HEAD HEAD^{tree} > /tmp/candidate-source/source-identity.txt
          cd /tmp/candidate-source
          sha256sum source.bundle > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-7a928-source
          path: /tmp/candidate-source/
          retention-days: 7
