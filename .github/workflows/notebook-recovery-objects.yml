name: Stage exact cooperative recovery source
on:
  push:
    branches: ['delivery/notebook-recovery-20261006']
permissions:
  contents: write
jobs:
  stage:
    if: github.repository == 'AlOdinson/alex' && github.ref == 'refs/heads/delivery/notebook-recovery-20261006'
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Verify exact tested tree and upload immutable source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          repo='AlOdinson/alex';base='7bf468e74ab0819d4428c2b786033678c46966d8';expected='2fbc970e092ad5fc0c75418bf765098c986c06e8'
          assert os.environ['GITHUB_REPOSITORY']==repo
          assert os.environ['GITHUB_REF']=='refs/heads/delivery/notebook-recovery-20261006'
          packed=b''.join(pathlib.Path('.delivery/recovery.'+str(i)).read_bytes() for i in range(3))
          assert hashlib.sha256(packed).hexdigest()=='a7c5ae88d0ca741925e5a09d3b50c8189ad85e58a3bc10de8b297838fd79996b'
          patch=pathlib.Path('/tmp/notebook-recovery.patch');patch.write_bytes(lzma.decompress(packed))
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          subprocess.run(['git','checkout','--detach',base],check=True)
          subprocess.run(['git','apply','--check','--index',str(patch)],check=True)
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          assert git('write-tree')==expected
          allowed={'.github/workflows/notebook-no-video-ci.yml','docs/performance/notebook-recovery-20261006.md','scripts/notebook-recovery-fixture.js','scripts/test-notebook-cooperative-recovery.mjs','scripts/test-notebook-recovery-browser.mjs','src/components/Board.jsx','src/lib/notebookBoardController.js','src/lib/notebookSession.js'}
          paths=git('diff','--cached','--name-only').splitlines()
          assert set(paths)==allowed and len(paths)==8
          for name in paths:
              value=pathlib.Path(name).read_bytes()
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/git/blobs',data=json.dumps({'content':base64.b64encode(value).decode(),'encoding':'base64'}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as response: result=json.load(response)
              assert result['sha']==git('hash-object',name)
              print(name,result['sha'])
          print('VERIFIED_LOCAL_TREE='+expected)
          print('Immutable blobs only; no branch refs, main, deployments or user data modified.')
          PY
