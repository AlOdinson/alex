name: Integrity isolated workspace

on:
  push:
    branches: [feat/new-board-integrity-20260925]
    paths: [.github/workflows/integrity-workspace.yml]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export tracked sources without credentials
        run: |
          mkdir -p /tmp/integrity-workspace
          git archive --format=tar.gz HEAD > /tmp/integrity-workspace/source.tar.gz
          git rev-parse HEAD > /tmp/integrity-workspace/source-sha.txt
      - run: npm install --no-audit --no-fund
      - name: Export installed build dependencies for isolated local verification
        run: tar -czf /tmp/integrity-workspace/dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: integrity-workspace
          path: /tmp/integrity-workspace
          retention-days: 1
      - run: npm run test:browser-authority
      - run: npm run test:sync:ci
      - run: npm run test:screen-share
      - run: npm run build
