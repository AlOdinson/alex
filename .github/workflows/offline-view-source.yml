name: Offline view baseline
on:
  push:
    branches: [fix/student-offline-view-20260925]
    paths: [.github/workflows/offline-view-source.yml]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Existing authority and sync regressions
        run: |
          mkdir -p offline-baseline
          npm run test:browser-authority > offline-baseline/authority.txt 2>&1
          npm run test:sync:ci > offline-baseline/sync.txt 2>&1
          npm run build > offline-baseline/build.txt 2>&1
      - name: Exact source and installed dependencies for local verification
        if: always()
        run: |
          mkdir -p offline-baseline
          git archive --format=tar.gz HEAD > offline-baseline/source.tar.gz
          git rev-parse HEAD > offline-baseline/source-commit.txt
          tar -czf offline-baseline/dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-view-baseline
          path: offline-baseline
          retention-days: 7
