name: Apply Sphere Center Dot Fix

on:
  push:
    branches:
      - feature/sphere-center-dot-stroke-width

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'ci: apply sphere center dot implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply minimal source change
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/shapes.js')
          source = path.read_text()
          old = """      const hidden = lineStyle(options, true);\n      const centerDot = new Circle({\n        radius: 3.5,"""
          new = """      const hidden = lineStyle(options, true);\n      const centerDotRadius = Number(options.strokeWidth) / 2;\n      const centerDot = new Circle({\n        radius: centerDotRadius,"""
          if old not in source:
              raise SystemExit('Expected sphere center-dot block was not found.')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/shapes.js
          git commit -m "ui: tie sphere center dot to stroke width"
          git push
