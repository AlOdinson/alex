name: Apply and verify bounded implementation
on:
  push:
    branches: [feature/bounded-board-verification-20260925]
    paths: ['.github/bounded-final.patch.gz.base64', '.github/bounded-finish.patch', '.github/bounded-continuation.patch.gz.base64', '.github/bounded-review.patch', '.github/apply-bounded-corrections.sh', '.github/workflows/apply-bounded-verification.yml', 'scripts/run-bounded-browser-ci.sh']
permissions:
  contents: read
concurrency:
  group: apply-bounded-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apply-and-test:
    if: github.repository == 'AlOdinson/alex' && github.ref == 'refs/heads/feature/bounded-board-verification-20260925'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            engine: chromium
          - os: macos-latest
            engine: webkit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and stage exact correction
        run: |
          bash .github/apply-bounded-corrections.sh
          mkdir -p verification-evidence
          git write-tree > verification-evidence/tested-tree.txt
          git archive --format=tar.gz "$(cat verification-evidence/tested-tree.txt)" > verification-evidence/tested-source.tar.gz
      - run: npm install --no-audit --no-fund
      - name: New deterministic tests
        run: set -o pipefail; node --test scripts/test-bounded*.mjs 2>&1 | tee verification-evidence/bounded-tests.txt
      - name: Existing authority regressions
        run: set -o pipefail; npm run test:browser-authority 2>&1 | tee verification-evidence/authority-tests.txt
      - name: Existing sync regressions
        run: set -o pipefail; npm run test:sync:ci 2>&1 | tee verification-evidence/sync-tests.txt
      - name: Existing screen regressions
        run: set -o pipefail; npm run test:screen-share 2>&1 | tee verification-evidence/screen-tests.txt
      - name: Storage regressions
        run: set -o pipefail; node --test scripts/test-board-creation-storage.mjs 2>&1 | tee verification-evidence/storage-tests.txt
      - name: Production build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: set -o pipefail; npm run build 2>&1 | tee verification-evidence/build.txt
      - run: npm install --no-save --no-package-lock playwright-core@1.55.0
      - if: matrix.engine == 'webkit'
        run: node node_modules/playwright-core/cli.js install webkit
      - name: Native browser and real group history
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VERIFICATION_BROWSER: ${{ matrix.engine }}
          VERIFICATION_TEST_URL: http://127.0.0.1:5173/alex/
        run: bash scripts/run-bounded-browser-ci.sh
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-candidate-${{ matrix.engine }}
          path: |
            verification-evidence/
            bounded-browser-results/
          retention-days: 7
  publish-feature:
    needs: apply-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: bounded-candidate-*
          path: candidate-proof
      - name: Publish identical tested sources to feature branch only
        run: |
          set -euo pipefail
          remote=$(git ls-remote origin "$GITHUB_REF" | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          bash .github/apply-bounded-corrections.sh
          tree=$(git write-tree)
          test "$tree" = "$(cat candidate-proof/bounded-candidate-chromium/verification-evidence/tested-tree.txt)"
          test "$tree" = "$(cat candidate-proof/bounded-candidate-webkit/verification-evidence/tested-tree.txt)"
          git rm .github/bounded-final.patch.gz.base64 .github/bounded-finish.patch .github/bounded-continuation.patch.gz.base64 .github/bounded-review.patch .github/apply-bounded-corrections.sh .github/workflows/apply-bounded-verification.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: publish verified new-board bounded synchronization and group history corrections'
          git push origin HEAD:refs/heads/feature/bounded-board-verification-20260925
          mkdir -p publication-proof
          git rev-parse HEAD > publication-proof/feature-commit.txt
          printf '%s\n' "$tree" > publication-proof/tested-tree.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bounded-feature-publication
          path: publication-proof/
          retention-days: 7
