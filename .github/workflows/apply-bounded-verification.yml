name: Apply and verify bounded implementation
on:
  push:
    branches: [feature/bounded-board-verification-20260925]
    paths: ['.github/bounded-final.patch.gz.base64', '.github/bounded-finish.patch', '.github/workflows/apply-bounded-verification.yml']
permissions:
  contents: read
concurrency:
  group: apply-bounded-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apply-and-test:
    if: github.repository == 'AlOdinson/alex' && github.ref == 'refs/heads/feature/bounded-board-verification-20260925'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and stage exact correction
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feature/bounded-board-verification-20260925
          git merge-base --is-ancestor 6a4b15c1b2430cb8dea8fa49710d3926ceba78bb HEAD
          mkdir -p verification-evidence
          base64 -d .github/bounded-final.patch.gz.base64 > /tmp/bounded-final.patch.gz
          echo '93e91addb851c402fa051780f855845850add16f233d9bc58ba9f5f007238c40  /tmp/bounded-final.patch.gz' | sha256sum -c -
          gzip -dc /tmp/bounded-final.patch.gz > /tmp/bounded-final.patch
          git apply --check /tmp/bounded-final.patch
          git apply --index /tmp/bounded-final.patch
          git apply --check .github/bounded-finish.patch
          git apply --index .github/bounded-finish.patch
          git diff --cached --check
          git write-tree > verification-evidence/tested-tree.txt
          git archive --format=tar.gz "$(cat verification-evidence/tested-tree.txt)" > verification-evidence/tested-source.tar.gz
      - run: npm install --no-audit --no-fund
      - name: New deterministic tests
        run: set -o pipefail; node --test scripts/test-bounded*.mjs 2>&1 | tee verification-evidence/bounded-tests.txt
      - name: Existing authority regressions
        run: set -o pipefail; npm run test:browser-authority 2>&1 | tee verification-evidence/authority-tests.txt
      - name: Existing sync regressions
        run: set -o pipefail; npm run test:sync:ci 2>&1 | tee verification-evidence/sync-tests.txt
      - name: Existing screen regressions
        run: set -o pipefail; npm run test:screen-share 2>&1 | tee verification-evidence/screen-tests.txt
      - name: Production build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: set -o pipefail; npm run build 2>&1 | tee verification-evidence/build.txt
      - run: npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Native Chromium and real group history
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VERIFICATION_BROWSER: chromium
          VERIFICATION_TEST_URL: http://127.0.0.1:5173/alex/
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 > verification-evidence/vite.txt 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS "$VERIFICATION_TEST_URL" >/dev/null; then break; fi
            sleep 1
          done
          node scripts/bounded-verification-browser.mjs 2>&1 | tee verification-evidence/browser.txt
      - name: Publish verified correction to feature only
        run: |
          set -euo pipefail
          remote=$(git ls-remote origin "$GITHUB_REF" | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git rm .github/bounded-final.patch.gz.base64 .github/bounded-finish.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve layer anchors and repair missing move targets on new boards'
          git push origin HEAD:refs/heads/feature/bounded-board-verification-20260925
          git rev-parse HEAD > verification-evidence/published-feature-commit.txt
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-final-${{ github.sha }}
          path: |
            verification-evidence/
            bounded-browser-results/
          retention-days: 5
