name: Desktop ShareScreen Check

on:
  push:
    branches:
      - feature/desktop-sharescreen-button
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/test-desktop-sharescreen-button.mjs
