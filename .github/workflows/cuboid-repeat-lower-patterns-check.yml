name: Verify cuboid lower-pattern pairing

on:
  push:
    branches:
      - fix/cuboid-repeat-lower-patterns

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify cuboid pairing regression
        run: node scripts/test-upward-hidden-edge-stack.mjs
      - name: Verify directional solids
        run: node scripts/test-solid-drag-mirroring.mjs
      - name: Verify solid geometry
        run: node scripts/test-solid-shape-geometry.mjs
      - name: Build
        run: npm run build
