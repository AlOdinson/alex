name: Bottom Tool Dock Green

on:
  push:
    branches:
      - feature/bottom-tool-dock
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply bottom dock implementation if needed
        run: |
          python - <<'PY'
          from pathlib import Path

          toolbar_path = Path('src/components/Toolbar.jsx')
          toolbar = toolbar_path.read_text()

          old_tools = """const TOOLS = [
            { id: 'select', label: 'Выделение', icon: '↖' },
            { id: 'pencil', label: 'Карандаш', icon: '✎' },
            { id: 'line', label: 'Прямая', icon: '╱' },
            { id: 'eraser', label: 'Ластик', icon: '⌫' },
            { id: 'text', label: 'Текст', icon: 'T' },
          ];""".replace('          ', '')
          new_tools = """const TOOLS = [
            { id: 'select', label: 'Выделение' },
            { id: 'pencil', label: 'Карандаш' },
            { id: 'line', label: 'Прямая' },
            { id: 'eraser', label: 'Ластик' },
            { id: 'text', label: 'Текст' },
          ];""".replace('          ', '')
          if old_tools in toolbar:
              toolbar = toolbar.replace(old_tools, new_tools, 1)

          if 'function DockToolIcon({ id })' not in toolbar:
              marker = '\n\nfunction ExportIcon() {'
              if marker not in toolbar:
                  raise SystemExit('Dock icon insertion marker not found')
              icons = r'''

function DockToolIcon({ id }) {
  switch (id) {
    case 'select':
      return (
        <svg className="dock-tool-icon" viewBox="0 0 28 28" aria-hidden="true" focusable="false">
          <path d="M5 3.5 21 14.7l-7.1 1.3 4.1 6.8-3.1 1.9-4.2-7-5.2 5Z" fill="#ede9fe" stroke="#5b21b6" strokeWidth="1.9" strokeLinejoin="round" />
        </svg>
      );
    case 'pencil':
      return (
        <svg className="dock-tool-icon" viewBox="0 0 28 28" aria-hidden="true" focusable="false">
          <path d="m6.2 20.7 1.4-5.1L18.2 5a2.1 2.1 0 0 1 3 0l1.8 1.8a2.1 2.1 0 0 1 0 3L12.4 20.4l-5.2 1.4Z" fill="#fbbf24" stroke="#172554" strokeWidth="1.65" strokeLinejoin="round" />
          <path d="m17.1 6.1 4.8 4.8" stroke="#fb7185" strokeWidth="2.2" strokeLinecap="round" />
          <path d="m7.7 15.6 4.7 4.8" stroke="#172554" strokeWidth="1.45" />
        </svg>
      );
    case 'line':
      return (
        <svg className="dock-tool-icon" viewBox="0 0 28 28" aria-hidden="true" focusable="false">
          <path d="M6 21.5 22 6.5" fill="none" stroke="#172554" strokeWidth="2.1" strokeLinecap="round" />
          <circle cx="6" cy="21.5" r="2" fill="#818cf8" stroke="#172554" strokeWidth="1.15" />
          <circle cx="22" cy="6.5" r="2" fill="#818cf8" stroke="#172554" strokeWidth="1.15" />
        </svg>
      );
    case 'eraser':
      return (
        <svg className="dock-tool-icon" viewBox="0 0 28 28" aria-hidden="true" focusable="false">
          <path d="m7.2 17.8 8.9-9a2 2 0 0 1 2.9 0l3.2 3.2a2 2 0 0 1 0 2.9l-8.8 8.8H9.6l-2.4-2.5a2.4 2.4 0 0 1 0-3.4Z" fill="#f9a8d4" stroke="#172554" strokeWidth="1.65" strokeLinejoin="round" />
          <path d="m12.3 12.7 5.8 5.8-5.2 5.2H9.5l-2.4-2.5a2.4 2.4 0 0 1 0-3.4Z" fill="#c4b5fd" />
          <path d="m12.3 12.7 5.8 5.8" stroke="#172554" strokeWidth="1.55" />
        </svg>
      );
    case 'text':
      return (
        <svg className="dock-tool-icon" viewBox="0 0 28 28" aria-hidden="true" focusable="false">
          <path d="M6 6.3h16M14 6.3v15.4M10.5 21.7h7" fill="none" stroke="#0f172a" strokeWidth="2.15" strokeLinecap="round" />
        </svg>
      );
    case 'shape':
      return (
        <svg className="dock-tool-icon" viewBox="0 0 28 28" aria-hidden="true" focusable="false">
          <rect x="5" y="5" width="12" height="12" rx="1.7" fill="#ddd6fe" stroke="#3730a3" strokeWidth="1.6" />
          <circle cx="18.5" cy="18.5" r="5.2" fill="#e0f2fe" stroke="#3730a3" strokeWidth="1.6" />
        </svg>
      );
    case 'image':
      return (
        <svg className="dock-tool-icon" viewBox="0 0 28 28" aria-hidden="true" focusable="false">
          <rect x="4.5" y="5.2" width="19" height="17.6" rx="2.3" fill="#eff6ff" stroke="#1e3a8a" strokeWidth="1.6" />
          <circle cx="18.9" cy="10" r="2" fill="#fbbf24" />
          <path d="m6.8 19.8 5.1-5 3.3 3.1 2.1-2 4 3.9" fill="none" stroke="#2563eb" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      );
    default:
      return null;
  }
}
'''
              toolbar = toolbar.replace(marker, icons + marker, 1)

          old_main_tools = r'''        <div className="tool-group main-tools" aria-label="Инструменты">
          {TOOLS.map((item) => (
            <IconButton
              key={item.id}
              title={item.label}
              active={tool === item.id}
              disabled={!canEdit}
              onClick={() => {
                setShapesOpen(false);
                setTool(item.id);
              }}
            >
              {item.icon}
            </IconButton>
          ))}

          <div className="shape-anchor" ref={shapeAnchorRef}>
            <IconButton
              title="Фигуры"
              active={tool === 'shape' || shapesOpen}
              disabled={!canEdit}
              onClick={() => {
                setTool('shape');
                setShapesOpen((value) => !value);
              }}
            >
              ◇
            </IconButton>
            {shapesOpen && (
              <ShapePalette
                anchorRef={shapeAnchorRef}
                onClose={() => setShapesOpen(false)}
                onChoose={(shapeId) => {
                  onAddShape(shapeId);
                  setShapesOpen(false);
                }}
              />
            )}
          </div>

          <label
            className={`tool-button image-upload-button ${!canEdit ? 'disabled' : ''}`.trim()}
            title="Добавить картинку"
            aria-label="Добавить картинку"
          >
            <span aria-hidden="true">▧</span>
            <input
              className="image-file-input"
              type="file"
              accept="image/*,.heic,.heif"
              multiple
              disabled={!canEdit}
              onChange={(event) => {
                const files = [...(event.target.files ?? [])];
                if (files.length) onAddImages(files);
                event.target.value = '';
              }}
            />
          </label>
        </div>

'''
          if old_main_tools in toolbar:
              toolbar = toolbar.replace(old_main_tools, '', 1)

          if 'className="board-tool-dock"' not in toolbar:
              opening = '  return (\n    <header className="toolbar-shell">'
              if opening not in toolbar:
                  raise SystemExit('Toolbar return opening marker not found')
              toolbar = toolbar.replace(opening, '  return (\n    <>\n      <header className="toolbar-shell">', 1)

              ending = '      </div>\n    </header>\n  );\n}\n'
              if ending not in toolbar:
                  raise SystemExit('Toolbar return ending marker not found')
              dock = r'''      </div>
      </header>

      <div className="board-tool-dock" aria-label="Инструменты">
        {TOOLS.map((item) => (
          <IconButton
            key={item.id}
            title={item.label}
            active={tool === item.id}
            disabled={!canEdit}
            className="dock-tool-button"
            onClick={() => {
              setShapesOpen(false);
              setTool(item.id);
            }}
          >
            <span className="dock-tool-content">
              <DockToolIcon id={item.id} />
              <span className="dock-tool-label">{item.label}</span>
            </span>
          </IconButton>
        ))}

        <div className="shape-anchor dock-shape-anchor" ref={shapeAnchorRef}>
          <IconButton
            title="Фигуры"
            active={tool === 'shape' || shapesOpen}
            disabled={!canEdit}
            className="dock-tool-button"
            onClick={() => {
              setTool('shape');
              setShapesOpen((value) => !value);
            }}
          >
            <span className="dock-tool-content">
              <DockToolIcon id="shape" />
              <span className="dock-tool-label">Фигуры</span>
            </span>
          </IconButton>
          {shapesOpen && (
            <ShapePalette
              anchorRef={shapeAnchorRef}
              onClose={() => setShapesOpen(false)}
              onChoose={(shapeId) => {
                onAddShape(shapeId);
                setShapesOpen(false);
              }}
            />
          )}
        </div>

        <label
          className={`tool-button dock-tool-button image-upload-button ${!canEdit ? 'disabled' : ''}`.trim()}
          title="Добавить картинку"
          aria-label="Добавить картинку"
        >
          <span className="dock-tool-content" aria-hidden="true">
            <DockToolIcon id="image" />
            <span className="dock-tool-label">Картинка</span>
          </span>
          <input
            className="image-file-input"
            type="file"
            accept="image/*,.heic,.heif"
            multiple
            disabled={!canEdit}
            onChange={(event) => {
              const files = [...(event.target.files ?? [])];
              if (files.length) onAddImages(files);
              event.target.value = '';
            }}
          />
        </label>
      </div>
    </>
  );
}
'''
              toolbar = toolbar.replace(ending, dock, 1)

          toolbar_path.write_text(toolbar)

          palette_path = Path('src/components/ShapePalette.jsx')
          palette = palette_path.read_text()
          if 'const openAbove = availableAbove > availableBelow;' not in palette:
              old_placement = r'''      const preferredLeft = rect.left + viewportOffsetLeft - 76;
      const left = Math.min(
        Math.max(viewportOffsetLeft + EDGE_GAP, preferredLeft),
        viewportOffsetLeft + viewportWidth - width - EDGE_GAP,
      );
      const top = rect.bottom + viewportOffsetTop + 8;
      const maxHeight = Math.max(180, viewportOffsetTop + viewportHeight - top - EDGE_GAP);
      setPlacement({ left, top, width, maxHeight });'''
              new_placement = r'''      const preferredLeft = rect.left + viewportOffsetLeft - 76;
      const left = Math.min(
        Math.max(viewportOffsetLeft + EDGE_GAP, preferredLeft),
        viewportOffsetLeft + viewportWidth - width - EDGE_GAP,
      );
      const anchorTop = rect.top + viewportOffsetTop;
      const anchorBottom = rect.bottom + viewportOffsetTop;
      const viewportTop = viewportOffsetTop;
      const viewportBottom = viewportOffsetTop + viewportHeight;
      const availableAbove = anchorTop - viewportTop - EDGE_GAP - 8;
      const availableBelow = viewportBottom - anchorBottom - EDGE_GAP - 8;
      const openAbove = availableAbove > availableBelow;
      const availableHeight = openAbove ? availableAbove : availableBelow;
      const maxHeight = Math.max(140, Math.min(690, availableHeight));
      const top = openAbove ? anchorTop - 8 : anchorBottom + 8;
      setPlacement({ left, top, width, maxHeight, openAbove });'''
              if old_placement not in palette:
                  raise SystemExit('Shape palette placement marker not found')
              palette = palette.replace(old_placement, new_placement, 1)
              style_marker = "        '--shape-palette-max-height': `${placement.maxHeight}px`,\n"
              if style_marker not in palette:
                  raise SystemExit('Shape palette style marker not found')
              palette = palette.replace(
                  style_marker,
                  style_marker + "        transform: placement.openAbove ? 'translateY(-100%)' : undefined,\n        transformOrigin: placement.openAbove ? 'bottom left' : 'top left',\n",
                  1,
              )
              palette_path.write_text(palette)

          i18n_path = Path('src/i18n.js')
          i18n = i18n_path.read_text()
          if "'Картинка': 'Image'" not in i18n:
              marker = "  'Добавить картинку': 'Add image',\n"
              if marker not in i18n:
                  raise SystemExit('i18n image marker not found')
              i18n = i18n.replace(marker, marker + "  'Картинка': 'Image',\n", 1)
              i18n_path.write_text(i18n)

          styles_path = Path('src/styles.css')
          styles = styles_path.read_text()
          style_marker = '/* Alex Board 1.35.0 — reference-style bottom tool dock */'
          if style_marker not in styles:
              styles += r'''

/* Alex Board 1.35.0 — reference-style bottom tool dock */
.board-tool-dock {
  position: absolute;
  z-index: 42;
  left: 50%;
  bottom: max(12px, env(safe-area-inset-bottom));
  transform: translateX(-50%);
  display: flex;
  align-items: stretch;
  gap: 3px;
  max-width: calc(100vw - 24px);
  padding: 7px;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  border: 1px solid rgba(226, 232, 240, 0.96);
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.97);
  box-shadow: 0 12px 32px rgba(15, 23, 42, 0.16);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  scrollbar-width: none;
  touch-action: manipulation;
}

.board-tool-dock::-webkit-scrollbar {
  display: none;
}

.board-tool-dock .dock-tool-button {
  flex: 0 0 62px;
  width: 62px;
  height: 58px;
  padding: 0;
  border: 0;
  border-radius: 13px;
  background: transparent;
  color: #172554;
  transition: background 120ms ease, box-shadow 120ms ease, transform 120ms ease;
}

.board-tool-dock .dock-tool-button > span,
.board-tool-dock .dock-tool-content {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
}

.board-tool-dock .dock-tool-button:hover {
  background: #f5f3ff;
}

.board-tool-dock .dock-tool-button:active:not(:disabled) {
  transform: translateY(1px);
}

.board-tool-dock .dock-tool-button.active {
  background: #ede9fe;
  color: #5b21b6;
  box-shadow: inset 0 0 0 1px rgba(124, 58, 237, 0.12);
}

.dock-tool-icon {
  display: block;
  width: 27px;
  height: 27px;
  flex: 0 0 auto;
}

.dock-tool-label {
  display: block;
  max-width: 58px;
  overflow: hidden;
  color: #475569;
  font-size: 9.5px;
  font-weight: 650;
  line-height: 1.05;
  text-align: center;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.board-tool-dock .dock-tool-button.active .dock-tool-label {
  color: #6d28d9;
}

.board-tool-dock .dock-shape-anchor {
  flex: 0 0 auto;
}

.board-tool-dock .image-upload-button {
  position: relative;
  display: flex;
  cursor: pointer;
}

.board-tool-dock .image-upload-button.disabled {
  cursor: not-allowed;
  opacity: 0.45;
}

.board-tool-dock .image-file-input {
  display: none;
}

@media (max-width: 760px) {
  .board-tool-dock {
    bottom: max(8px, env(safe-area-inset-bottom));
    max-width: calc(100vw - 12px);
    padding: 5px;
    border-radius: 15px;
  }

  .board-tool-dock .dock-tool-button {
    flex-basis: 54px;
    width: 54px;
    height: 52px;
    border-radius: 11px;
  }

  .dock-tool-icon {
    width: 24px;
    height: 24px;
  }

  .dock-tool-label {
    max-width: 50px;
    font-size: 8.5px;
  }
}
'''
              styles_path.write_text(styles)

          package_path = Path('package.json')
          package = package_path.read_text()
          command = 'node scripts/test-bottom-tool-dock.mjs && '
          if command not in package:
              marker = '"test:sync": "'
              if marker not in package:
                  raise SystemExit('package test:sync marker not found')
              package = package.replace(marker, marker + command, 1)
              package_path.write_text(package)
          PY

          if ! git diff --quiet -- src/components/Toolbar.jsx src/components/ShapePalette.jsx src/styles.css src/i18n.js package.json; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add src/components/Toolbar.jsx src/components/ShapePalette.jsx src/styles.css src/i18n.js package.json
            git commit -m "ui: move core tools to bottom dock"
            git push origin HEAD:feature/bottom-tool-dock
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      - name: Bottom dock regression
        run: node scripts/test-bottom-tool-dock.mjs
      - name: Toolbar and shape regressions
        run: |
          node scripts/test-browser-button-visibility.mjs
          node scripts/test-shape-palette.mjs
          node scripts/test-solid-shape-geometry.mjs
          node scripts/test-solid-drag-mirroring.mjs
          node scripts/test-i18n.mjs
      - name: Browser feature regressions
        run: npm run test:screen-share
      - name: Portable board regressions
        run: |
          node scripts/test-sync-convergence.mjs
          node scripts/test-authoritative-log.mjs
          node scripts/test-collaboration-safety.mjs
          node scripts/test-fast-board-library.mjs
          node scripts/test-drawing-presets.mjs
          node scripts/test-pencil-transform-regression.mjs
          node scripts/test-pencil-palm-regression.mjs
          node scripts/test-pencil-contact-arbitration.mjs
          node scripts/test-pencil-rapid-pinch-regression.mjs
          node scripts/test-pencil-original-input-path.mjs
          node scripts/test-pencil-diagnostics.mjs
          node scripts/test-pencil-diagnostics-runtime.mjs
      - name: Production build
        run: npm run build
