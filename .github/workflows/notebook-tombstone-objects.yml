name: Stage exact audit locator source
on:
  push:
    branches: ['delivery/notebook-tombstones-20261005']
permissions:
  contents: write
jobs:
  stage:
    if: github.repository == 'AlOdinson/alex' && github.ref == 'refs/heads/delivery/notebook-tombstones-20261005'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Reconstruct and upload checksum-verified Git blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          repo = 'AlOdinson/alex'
          base = '0838703bfa2c06a778b16ac91d5cb96aca886253'
          expected = '2710069eb12e6fb6c82e7d8cf1eabb2422652e6b'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          assert os.environ['GITHUB_REF'] == 'refs/heads/delivery/notebook-tombstones-20261005'
          packed = base64.b64decode(pathlib.Path('.delivery/controller-locator.patch.b64').read_text())
          assert hashlib.sha256(packed).hexdigest() == '5b03117d14cc5e93ea76c8331f961e1eb4585e8383615c049ce13cf90e3f9ea7'
          patch = pathlib.Path('/tmp/controller-locator.patch'); patch.write_bytes(lzma.decompress(packed))
          def git(*args): return subprocess.check_output(['git', *args], text=True).strip()
          subprocess.run(['git','checkout','--detach',base],check=True)
          subprocess.run(['git','apply','--check','--index','--unidiff-zero',str(patch)],check=True)
          subprocess.run(['git','apply','--index','--unidiff-zero',str(patch)],check=True)
          assert git('write-tree') == expected
          assert not git('diff','--cached','--name-only','--','src')
          paths = git('diff','--cached','--name-only').splitlines(); assert len(paths) == 3
          for name in paths:
              assert name.startswith('scripts/')
              value = pathlib.Path(name).read_bytes()
              request = urllib.request.Request('https://api.github.com/repos/'+repo+'/git/blobs',
                  data=json.dumps({'content':base64.b64encode(value).decode(),'encoding':'base64'}).encode(),method='POST',
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request, timeout=30) as response: result=json.load(response)
              assert result['sha'] == git('hash-object',name)
              print(name,result['sha'])
          print('VERIFIED_LOCAL_TREE='+expected)
          print('Git blobs only. No refs, deployment or production data changed.')
          PY
