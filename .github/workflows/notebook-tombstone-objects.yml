name: Stage condition-based browser entry
on:
  push:
    branches: ['delivery/notebook-tombstones-20261005']
permissions:
  contents: write
jobs:
  stage:
    if: github.repository == 'AlOdinson/alex' && github.ref == 'refs/heads/delivery/notebook-tombstones-20261005'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Upload checksum-verified test-only blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          repo = 'AlOdinson/alex'
          base = '908a0947e16506e23a7b998a6bde21312ebbe150'
          expected = '05c28d8d3249b1a0508e5f9f10d12b4c87b04377'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          assert os.environ['GITHUB_REF'] == 'refs/heads/delivery/notebook-tombstones-20261005'
          packed = base64.b64decode(pathlib.Path('.delivery/controller-locator.patch.b64').read_text())
          assert hashlib.sha256(packed).hexdigest() == 'fb7478af7ffd8d11ac759f43dd3f81a0ed969f9f69de4f5d879eae6e3c81dda9'
          patch = pathlib.Path('/tmp/entry-state.patch'); patch.write_bytes(lzma.decompress(packed))
          def git(*args): return subprocess.check_output(['git', *args], text=True).strip()
          subprocess.run(['git','checkout','--detach',base],check=True)
          subprocess.run(['git','apply','--check','--index',str(patch)],check=True)
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          assert git('write-tree') == expected
          paths = git('diff','--cached','--name-only').splitlines()
          assert set(paths) == {'scripts/benchmark-notebook-real-input.mjs','scripts/notebook-audit-metrics.js','scripts/test-notebook-audit-metrics.mjs'}
          assert not git('diff','--cached','--name-only','--','src')
          for name in paths:
              value = pathlib.Path(name).read_bytes()
              request = urllib.request.Request('https://api.github.com/repos/'+repo+'/git/blobs',
                  data=json.dumps({'content':base64.b64encode(value).decode(),'encoding':'base64'}).encode(),method='POST',
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request, timeout=30) as response: result=json.load(response)
              assert result['sha'] == git('hash-object',name)
              print(name,result['sha'])
          print('VERIFIED_LOCAL_TREE='+expected)
          print('Immutable test blobs only. No product, refs, deployment or user data changes.')
          PY
