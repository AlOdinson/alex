name: Stage bounded projection yield
on:
  push:
    branches: ['delivery/notebook-tombstones-20261005']
permissions:
  contents: write
jobs:
  stage:
    if: github.repository == 'AlOdinson/alex' && github.ref == 'refs/heads/delivery/notebook-tombstones-20261005'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Upload checksum-verified reviewed blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          repo = 'AlOdinson/alex'
          base = 'fd27c0cc179eadade45eb90050fae617ff1e08df'
          expected = '09b370e9dcacdb2c9b99d829843986264ef79fe2'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          assert os.environ['GITHUB_REF'] == 'refs/heads/delivery/notebook-tombstones-20261005'
          packed = base64.b64decode(pathlib.Path('.delivery/controller-locator.patch.b64').read_text())
          assert hashlib.sha256(packed).hexdigest() == 'f67f02f439b90186c85153765436c1bf64d7865fb1002d6d9c3e99c08a85748e'
          patch = pathlib.Path('/tmp/projection-yield.patch'); patch.write_bytes(lzma.decompress(packed))
          def git(*args): return subprocess.check_output(['git', *args], text=True).strip()
          subprocess.run(['git','checkout','--detach',base],check=True)
          subprocess.run(['git','apply','--check','--index',str(patch)],check=True)
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          assert git('write-tree') == expected
          paths = git('diff','--cached','--name-only').splitlines()
          assert set(paths) == {'.github/workflows/notebook-no-video-ci.yml','scripts/test-notebook-addressed-append.mjs','scripts/test-notebook-append-browser.mjs','scripts/test-notebook-projection-yield.mjs','src/lib/notebookBoardController.js'}
          for name in paths:
              value = pathlib.Path(name).read_bytes()
              request = urllib.request.Request('https://api.github.com/repos/'+repo+'/git/blobs',
                  data=json.dumps({'content':base64.b64encode(value).decode(),'encoding':'base64'}).encode(),method='POST',
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request, timeout=30) as response: result=json.load(response)
              assert result['sha'] == git('hash-object',name)
              print(name,result['sha'])
          print('VERIFIED_LOCAL_TREE='+expected)
          print('Immutable blobs only; no refs, deployment or user data changes.')
          PY
