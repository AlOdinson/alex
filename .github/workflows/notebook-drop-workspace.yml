name: Notebook drop regression workspace
on:
  push:
    branches: [work/notebook-drop-workspace-20261002]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 7f7d13c33c790fc6edc199e0bb053bab1a041e9b
          path: target
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Observe native notebook history
        run: python3 .work/diagnose-native-drop.py
      - name: Native Chromium drop and history
        working-directory: target
        env:
          VITE_NOTEBOOK_OPERATIONS_V1: true
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-package-lock playwright-core@1.62.1
          export CHROMIUM_EXECUTABLE=$(command -v google-chrome)
          test -n "$CHROMIUM_EXECUTABLE"
          node scripts/test-notebook-drop-browser.mjs > /tmp/notebook-native-diagnostic.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notebook-native-diagnostic
          path: |
            target/connection-direct-results/
            /tmp/notebook-native-diagnostic.log
          retention-days: 3
