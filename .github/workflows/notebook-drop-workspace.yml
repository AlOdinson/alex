name: Notebook drop regression workspace
on:
  push:
    branches: [work/notebook-drop-workspace-20261002]
permissions:
  contents: write
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 21b8048ff85ed6652c7005783f56f1567b4d68bc
          path: target
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruct hash-pinned local patch
        run: python3 .work/apply-notebook-drop.py
      - name: Validate source and notebook behavior
        working-directory: target
        run: |
          npm ci --no-audit --no-fund
          npm run test:notebook > /tmp/notebook-drop-tests.log 2>&1
          npm run build > /tmp/notebook-drop-build.log 2>&1
      - name: Store immutable source blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .work/apply-notebook-drop.py --publish-blobs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notebook-drop-blobs
          path: |
            /tmp/notebook-drop-blobs.json
            /tmp/notebook-drop-tests.log
            /tmp/notebook-drop-build.log
          retention-days: 3
