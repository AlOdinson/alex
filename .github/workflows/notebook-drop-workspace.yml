name: Notebook drop regression workspace
on:
  push:
    branches: [work/notebook-drop-workspace-20261002]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Export exact source baseline
        run: |
          git archive --format=tar.gz --output=/tmp/notebook-main-source.tar.gz 21b8048ff85ed6652c7005783f56f1567b4d68bc
          git ls-tree -r 21b8048ff85ed6652c7005783f56f1567b4d68bc > /tmp/notebook-source-hashes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: notebook-main-source
          path: |
            /tmp/notebook-main-source.tar.gz
            /tmp/notebook-source-hashes.txt
          retention-days: 3
