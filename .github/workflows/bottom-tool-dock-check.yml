name: Bottom Tool Dock Check

on:
  push:
    branches:
      - feature/bottom-tool-dock
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bottom dock regression
        run: node scripts/test-bottom-tool-dock.mjs
