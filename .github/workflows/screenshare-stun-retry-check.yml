name: Verify screen share STUN retry

on:
  push:
    branches:
      - fix/screenshare-stun-retry

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify STUN-only recovery regression
        run: node scripts/test-screen-share-stun-retry.mjs
      - name: Verify board screen-share integration
        run: node scripts/test-board-screen-share-integration.mjs
      - name: Verify board screen-share object
        run: node scripts/test-board-screen-share-object.mjs
      - name: Build
        run: npm run build
