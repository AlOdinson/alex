name: Cloud Browser Verification
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/board-settings-gear.js'
      - 'src/components/ScreenShare.jsx'
      - 'src/components/useCloudScreenShareFallback.js'
      - 'src/lib/cloud*.js'
      - 'src/lib/screenShare.js'
      - 'supabase/functions/cloudflare-realtime/**'
      - 'scripts/test-cloud-browser*'
      - 'scripts/test-cloud-publisher*'
      - 'scripts/test-cloud-screen-stop.mjs'
      - 'scripts/test-settings-menu-stability.mjs'
      - '.github/workflows/cloud-browser-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            engine: chromium
          - os: macos-latest
            engine: webkit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm install --no-audit --no-fund
      - name: Browser access and guest authorization regressions
        run: |
          node --test scripts/test-cloud-browser-access.mjs scripts/test-cloud-publisher-authorization.mjs scripts/test-cloud-screen-stop.mjs scripts/test-settings-menu-stability.mjs
          node scripts/test-cloudflare-realtime-edge-function.mjs
          node scripts/test-cloudflare-screen-share-transport.mjs
          node scripts/test-screen-share-cloud-switch.mjs
          node scripts/test-screen-share-cloud-protocol.mjs
          node scripts/test-board-screen-share-cloud-control.mjs
          npm run test:screen-share
          deno check --node-modules-dir=auto supabase/functions/cloudflare-realtime/index.ts
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - run: npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: WebKit test driver and loopback relay
        if: matrix.engine == 'webkit' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          node node_modules/playwright-core/cli.js install webkit
          brew install coturn
      - name: Actual Cloudflare video and checkbox lifecycle
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          BROWSER_AUTHORITY_PREVIEW_URL: http://127.0.0.1:4173/alex/
          CLOUD_BROWSER: ${{ matrix.engine }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          relay_pid=''
          if [ "$CLOUD_BROWSER" = webkit ]; then
            export CLOUD_TURN_PASSWORD=$(openssl rand -hex 24)
            echo "::add-mask::$CLOUD_TURN_PASSWORD"
            turnserver -n --listening-ip=127.0.0.1 --relay-ip=127.0.0.1 --listening-port=3478 --min-port=49160 --max-port=49260 --realm=cloud-ci --user="cloud-ci:$CLOUD_TURN_PASSWORD" --lt-cred-mech --fingerprint --no-tls --no-dtls --no-cli --cli-password="$CLOUD_TURN_PASSWORD" --allow-loopback-peers --no-multicast-peers --pidfile=/tmp/cloud-turn.pid > /tmp/cloud-turn.log 2>&1 &
            relay_pid=$!
            sleep 2
            kill -0 "$relay_pid"
          fi
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/cloud-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" ${relay_pid:-} 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/alex/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/test-cloud-browser-e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-browser-${{ matrix.engine }}
          path: cloud-browser-results
          if-no-files-found: ignore
          retention-days: 7
