name: Octahedron Rotation Check

on:
  push:
    branches:
      - feature/rotate-octahedron
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Rotated octahedron regression
        run: node scripts/test-solid-shape-geometry.mjs
