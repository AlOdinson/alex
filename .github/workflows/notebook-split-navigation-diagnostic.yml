name: Notebook split navigation diagnosis
on:
  push:
    branches: [feat/notebook-true-split-20261003]
    paths: ['.github/workflows/notebook-split-navigation-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: db95dd0bd17dbdd1d9cbbe628ba6369ad7eb6e5c
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --no-package-lock playwright-core@1.62.1
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Trace existing capture failure without changing any assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/test-notebook-navigation-browser.mjs')
          s=p.read_text().replace("const p = await context.newPage();", "const p = await context.newPage(); p.on('console', m=>console.log('PAGE',m.type(),m.text()));")
          s=s.replace("window.book = () =>", "window.gestures = []; window.c.on('path:created', ({path}) => { window.gestures.push(path.toObject(['boardObjectId', 'creationSessionId'])); }); window.c.on('object:removed',({target})=>{if(target.type==='path')console.log('PATH REMOVED',target.boardObjectId,new Error().stack);});\n    window.book = () =>", 1)
          s=s.replace("text: document.body.innerText, tool:", "gestures: window.gestures, dataset: {...document.documentElement.dataset}, objects: window.c?.getObjects().map(o=>o.toObject(['boardObjectId', 'creationSessionId', 'updatedAt', 'updatedBy'])), text: document.body.innerText, tool:")
          p.write_text(s)
          p=Path('src/lib/notebookBoardActions.js');s=p.read_text()
          s=s.replace('prepared = await captureNotebookObject(notebook, object);', "console.log('CUT START',object.boardObjectId); prepared = await captureNotebookObject(notebook, object); console.log('CUT END',JSON.stringify({id:object.boardObjectId,current:current(),prepared:!!prepared,frames,now:[notebook,object].map(o=>o.calcTransformMatrix()),present:canvas.getObjects().map(o=>o.boardObjectId)}));")
          s=s.replace('const handle = controller.enqueue({ actionId, ops }); enqueued = true;', "console.log('CUT ENQUEUE',object.boardObjectId,JSON.stringify(ops)); const handle = controller.enqueue({ actionId, ops }); enqueued = true;")
          p.write_text(s)
          p=Path('src/components/Board.jsx');s=p.read_text();s=s.replace("setSaveStatus(error.message || 'Не удалось сохранить штрих в блокнот');", "console.error('NOTEBOOK CAPTURE ERROR',error.stack); setSaveStatus(error.message || 'Не удалось сохранить штрих в блокнот');");p.write_text(s)
          PY
          mkdir -p notebook-navigation-results
          git rev-parse HEAD > notebook-navigation-results/source-sha.txt
          node scripts/test-notebook-navigation-browser.mjs > notebook-navigation-results/run.log 2>&1 || { tail -100 notebook-navigation-results/run.log; exit 1; }
        env:
          VERIFICATION_BROWSER: chromium
          VITE_NOTEBOOK_OPERATIONS_V1: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notebook-navigation-diagnostic
          path: notebook-navigation-results/
          retention-days: 7
