name: Temporary Apply ShareScreen Board UI

on:
  push:
    branches:
      - feature/board-screen-share-object
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-screen-share-board-ui.mjs
      - name: Commit patch if needed
        run: |
          if git diff --quiet -- src/components/Toolbar.jsx src/components/ScreenShare.jsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Toolbar.jsx src/components/ScreenShare.jsx
          git commit -m "feat: finish board-hosted ShareScreen UI"
          git push origin HEAD:feature/board-screen-share-object
