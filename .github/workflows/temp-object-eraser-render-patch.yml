name: Temporary object eraser render patch

on:
  push:
    branches:
      - fix/browser-authority-convergence
    paths:
      - .github/workflows/temp-object-eraser-render-patch.yml

permissions:
  contents: write

jobs:
  patch-board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/browser-authority-convergence
          fetch-depth: 0
      - name: Apply exact Board.jsx patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/Board.jsx')
          text = path.read_text()
          old = """      flushObjectEraserVisualPatches();
                restoreObjectEraserRenderMode();
                const records = [...objectEraserRecordsRef.current.values()];"""
          new = """      flushObjectEraserVisualPatches();
                restoreObjectEraserRenderMode();
                // Cropped patches keep a long eraser drag cheap, but the gesture boundary is
                // a correctness boundary: repaint once from Fabric's canonical object list so
                // the lower canvas cannot retain a stale/misaligned raster after a local delete.
                canvas.requestRenderAll();
                const records = [...objectEraserRecordsRef.current.values()];"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one eraser finish block, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit exact patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Board.jsx
          git diff --cached --check
          git commit -m "fix: canonicalize object eraser render on release"
          git push origin HEAD:fix/browser-authority-convergence
