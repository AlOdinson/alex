name: Temporary ShareScreen Resize Check

on:
  push:
    branches:
      - feature/fix-board-screenshare-resize
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/test-board-screen-share-resize-fit.mjs
