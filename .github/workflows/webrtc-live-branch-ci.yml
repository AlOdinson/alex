name: WebRTC Live Branch CI

on:
  push:
    branches:
      - project/webrtc-live-ably-sync
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: WebRTC live focused tests
        run: |
          set -e
          if [ -f scripts/test-live-event-protocol.mjs ]; then
            node --test scripts/test-live-event-protocol.mjs
          fi
          if [ -f scripts/test-peer-live-channel.mjs ]; then
            node --test scripts/test-peer-live-channel.mjs
          fi
          if [ -f scripts/test-collaboration-transport-flags.mjs ]; then
            node --test scripts/test-collaboration-transport-flags.mjs
          fi
          if [ -f scripts/test-live-transport-router.mjs ]; then
            node --test scripts/test-live-transport-router.mjs
          fi
          node --test scripts/test-browser-peer-connection.mjs
          node --test scripts/test-teacher-peer-network.mjs scripts/test-student-peer-network.mjs
          node --test scripts/test-teacher-board-runtime.mjs scripts/test-student-board-runtime.mjs
          node --test scripts/test-board-control-protocol.mjs scripts/test-peer-protocol.mjs scripts/test-teacher-peer-hub.mjs scripts/test-student-peer-session.mjs
          node --test scripts/test-browser-authority-realtime-events.mjs
          node --test scripts/test-browser-authority-realtime-core.mjs
          node --test scripts/test-browser-board-session.mjs
          node --test scripts/test-signaling-assistance.mjs scripts/test-signaling-assistance-sdp.mjs
          node --test scripts/test-screen-runtime-readiness.mjs
          node --test scripts/test-student-offline-view.mjs scripts/test-student-offline-cache.mjs scripts/test-student-offline-baseline.mjs


  browser-e2e:
    needs: focused
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Install lightweight Playwright driver
        run: npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Validate live test configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
      - name: Build branch preview with WebRTC live enabled
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_WEBRTC_LIVE_V1: "true"
        run: npm run build -- --base=/preview-browser-authority/
      - name: Start local branch preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --base=/preview-browser-authority/ > /tmp/alex-preview.log 2>&1 &
          echo $! > /tmp/alex-preview.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/preview-browser-authority/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/alex-preview.log
          exit 1
      - name: Chromium WebRTC live/durable E2E
        env:
          BROWSER_AUTHORITY_PREVIEW_URL: http://127.0.0.1:4173/preview-browser-authority/
          EXPECT_WEBRTC_LIVE_V1: "1"
        run: node scripts/test-browser-authority-preview-e2e.mjs
      - name: Chromium real-Fabric image drag/resize interaction fixture
        run: node scripts/test-selection-lease-transform-browser.mjs
      - name: Show preview log on failure
        if: failure()
        run: cat /tmp/alex-preview.log || true
      - name: Stop local preview
        if: always()
        run: |
          if [ -f /tmp/alex-preview.pid ]; then
            kill "$(cat /tmp/alex-preview.pid)" || true
          fi


  webkit-e2e:
    needs: focused
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright WebKit driver
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Validate live test configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
      - name: Build branch preview with WebRTC live enabled
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_WEBRTC_LIVE_V1: "true"
        run: npm run build -- --base=/preview-browser-authority/
      - name: Start local branch preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --base=/preview-browser-authority/ > /tmp/alex-preview-webkit.log 2>&1 &
          echo $! > /tmp/alex-preview-webkit.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/preview-browser-authority/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/alex-preview-webkit.log
          exit 1
      - name: WebKit WebRTC live/durable E2E
        env:
          BROWSER_AUTHORITY_PREVIEW_URL: http://127.0.0.1:4173/preview-browser-authority/
          EXPECT_WEBRTC_LIVE_V1: "1"
          BROWSER_ENGINE: webkit
        run: node scripts/test-browser-authority-preview-e2e.mjs
      - name: Show WebKit preview log on failure
        if: failure()
        run: cat /tmp/alex-preview-webkit.log || true
      - name: Stop WebKit local preview
        if: always()
        run: |
          if [ -f /tmp/alex-preview-webkit.pid ]; then
            kill "$(cat /tmp/alex-preview-webkit.pid)" || true
          fi


  full-regression:
    needs:
      - focused
      - browser-e2e
      - webkit-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Full browser-authority regressions
        run: npm run test:browser-authority
      - name: Hosted-safe sync, drawing, history and UI regressions
        run: npm run test:sync:ci
      - name: Screen-share regressions
        run: npm run test:screen-share
      - name: Production build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
