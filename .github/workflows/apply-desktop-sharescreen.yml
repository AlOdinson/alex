name: Apply Desktop ShareScreen

on:
  push:
    branches:
      - feature/desktop-sharescreen-button

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-desktop-sharescreen.mjs
      - run: |
          if git diff --quiet -- src/components/Toolbar.jsx src/styles.css package.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Toolbar.jsx src/styles.css package.json
          git commit -m "ui: add desktop ShareScreen button"
          git push
