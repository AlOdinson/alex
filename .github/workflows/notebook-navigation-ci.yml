name: Persistent notebook navigation verification

on:
  push:
    branches: ['feature/notebook-persistent-navigation-20261003']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notebook-navigation-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_NOTEBOOK_OPERATIONS_V1: 'true'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Apply exact reviewed source
        run: python3 .github/apply-navigation.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run test:notebook
      - run: npm run test:notebook:operations-performance
      - run: npm run test:browser-authority
      - run: npm run test:student:storage
      - run: npm run test:media
      - run: npm run test:pencil
      - run: npm run test:connections
      - run: npm run test:screen-share
      - run: npm run test:sync:ci
      - run: node --test scripts/test-board-creation-storage.mjs scripts/test-bounded*.mjs scripts/test-late-join*.mjs
      - run: npm run build
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-delivery-diagnostics
          path: .github/navigation-part-*.b64
          include-hidden-files: true
          retention-days: 2

  browser:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, engine: chromium}
          - {os: macos-latest, engine: webkit}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      VERIFICATION_BROWSER: ${{ matrix.engine }}
      WEBKIT_LOCAL_ICE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python3 .github/apply-navigation.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --no-package-lock playwright-core@1.62.1
      - run: node node_modules/playwright-core/cli.js install --with-deps ${{ matrix.engine }}
      - name: Notebook controls with every tool, protected pixels, text, history and deliberate drops
        run: |
          status=0
          node scripts/test-notebook-browser.mjs || status=1
          node scripts/test-notebook-drop-browser.mjs || status=1
          node scripts/test-notebook-navigation-browser.mjs || status=1
          exit "$status"
      - name: Incremental notebook performance
        run: npm run test:notebook:performance -- --stage-b
      - name: Notebook with received generated video at 720p60 and 1080p60
        run: npm run test:notebook:video
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-navigation-${{ matrix.engine }}
          path: |
            notebook-navigation-results/
            notebook-drop-results/
            /tmp/notebook-performance.json
            /tmp/notebook-received-video.json
          retention-days: 7

  publish-tested-source:
    needs: [verify, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Materialize tested source only after both browsers pass
        run: |
          python3 .github/apply-navigation.py
          git rm .github/navigation-part-*.b64 .github/apply-navigation.py .github/workflows/notebook-navigation-ci.yml
          for file in .github/navigation-followup-*.patch; do
            if [ -f "$file" ]; then git rm "$file"; fi
          done
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git commit -m 'feat: persistent protected notebook navigation (1.43.2)'
          git push origin HEAD:"$GITHUB_REF_NAME"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/notebook-navigation-tested-source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/notebook-navigation-tested-source.sha"
      - uses: actions/upload-artifact@v4
        with:
          name: notebook-navigation-tested-source
          path: |
            ${{ runner.temp }}/notebook-navigation-tested-source.tar.gz
            ${{ runner.temp }}/notebook-navigation-tested-source.sha
          retention-days: 7
