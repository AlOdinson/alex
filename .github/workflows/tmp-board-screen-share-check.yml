name: Temporary Board Screen Share Check

on:
  push:
    branches:
      - feature/board-screen-share-object
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/test-screen-share.mjs
      - run: node scripts/test-screen-share-board-session.mjs
      - run: node scripts/test-board-screen-share-object.mjs
      - run: node scripts/test-board-screen-share-integration.mjs
      - run: node scripts/test-screen-share-board-ui.mjs
      - run: node scripts/test-bottom-tool-dock.mjs
      - run: node scripts/test-i18n.mjs
      - run: npm run build
