name: Screen Viewer Diagnostics
on:
  push:
    branches: [fix/screen-viewer-delivery-20260916]
permissions:
  contents: read
concurrency:
  group: screen-viewer-diagnostics
  cancel-in-progress: true
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Source for local regression tests
        run: git archive --format=tar.gz --output=/tmp/screen-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: screen-viewer-source
          path: /tmp/screen-source.tar.gz
          retention-days: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - run: npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Reproduce unavailable secondary signaling with actual board signaling still online
        env:
          BROWSER_AUTHORITY_PREVIEW_URL: http://127.0.0.1:4173/alex/
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path='scripts/test-cloud-browser-e2e.mjs';
          const source=fs.readFileSync(path,'utf8');
          const anchor='const page = await context.newPage(); pages.push(page);';
          if(!source.includes(anchor)) throw new Error('test fixture changed');
          fs.writeFileSync(path,source.replace(anchor,anchor+"\n  await page.routeWebSocket(/\\/realtime\\/v1\\/websocket/, (socket) => socket.close());"));
          NODE
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/screen-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/alex/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/test-cloud-browser-e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-viewer-reproduction
          path: cloud-browser-results
          if-no-files-found: ignore
          retention-days: 3
