name: Verify board export, eraser and uploads

on:
  push:
    branches: ['fix/export-eraser-uploads-20261105']

permissions:
  contents: read

concurrency:
  group: board-repair-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_NOTEBOOK_OPERATIONS_V1: 'true'
  NODE_OPTIONS: '--dns-result-order=ipv4first'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run test:browser-authority
      - run: npm run test:student:reading
      - run: npm run test:media
      - run: npm run test:sync:ci
      - run: npm run test:screen-share
      - run: npm run test:notebook
      - run: npm run build

  browser:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, engine: chromium }
          - { os: macos-latest, engine: webkit }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --no-package-lock playwright-core@1.62.1
      - run: node node_modules/playwright-core/cli.js install --with-deps ${{ matrix.engine }}
      - run: npm run test:board-repairs:browser
        env:
          VERIFICATION_BROWSER: ${{ matrix.engine }}
          WEBKIT_LOCAL_ICE: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: board-repair-${{ matrix.engine }}
          path: board-repair-results/
          if-no-files-found: ignore
