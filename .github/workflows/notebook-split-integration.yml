name: Notebook true split integration
on:
  push:
    branches: [feat/notebook-true-split-20261003]
    paths: ['.github/workflows/notebook-split-integration.yml']
permissions:
  contents: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Decode exact reviewed patch, not the earlier integration
        run: |
          python3 - <<'PY'
          import pathlib, base64, gzip, hashlib
          patch = gzip.decompress(base64.b64decode(pathlib.Path('.delivery/notebook-split-review.b64').read_text()))
          assert hashlib.sha256(patch).hexdigest() == '10d37b0fd0c02bd3c95ec7b82558536be06e97c789cc10ea470c9e9995b1dbb2'
          pathlib.Path('/tmp/notebook-split-review.patch').write_bytes(patch)
          PY
          git apply --check /tmp/notebook-split-review.patch
          git apply /tmp/notebook-split-review.patch
      - run: npm ci --no-audit --no-fund
      - name: Regression suites, including the actual Canvas verification fence
        run: |
          mkdir -p /tmp/split-review-results
          node --test scripts/test-bounded-verification*.mjs > /tmp/split-review-results/bounded-verification.txt 2>&1
          for suite in test:notebook test:student:reading test:student:storage test:media test:browser-authority test:connections test:pencil test:sync:ci test:screen-share build; do
            npm run "$suite" > "/tmp/split-review-results/${suite//:/-}.txt" 2>&1 || { cat "/tmp/split-review-results/${suite//:/-}.txt"; exit 1; }
          done
      - name: Commit verified product and tests to the existing feature branch only
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/Board.jsx src/lib/notebookSplitFragments.js scripts/test-notebook-true-split.mjs docs/notebook-1.43.5-true-split.md
          git commit -m 'fix: preserve strokes during true-cut preparation and retain group shadows'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git bundle create /tmp/split-review-results/source.bundle HEAD
          git archive HEAD | gzip > /tmp/split-review-results/source.tar.gz
          git rev-parse HEAD HEAD^{tree} > /tmp/split-review-results/source-sha.txt
          git push origin HEAD:refs/heads/feat/notebook-true-split-20261003
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notebook-split-reviewed-source
          path: /tmp/split-review-results
          retention-days: 7
  browser:
    needs: integrate
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, engine: chromium}
          - {os: macos-latest, engine: webkit}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.integrate.outputs.sha }}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --no-package-lock playwright-core@1.62.1
      - run: node node_modules/playwright-core/cli.js install --with-deps ${{ matrix.engine }}
      - name: All unchanged navigation assertions and real true-split gestures
        env:
          VERIFICATION_BROWSER: ${{ matrix.engine }}
          VITE_NOTEBOOK_OPERATIONS_V1: 'true'
        run: |
          mkdir -p notebook-true-split-results
          git rev-parse HEAD HEAD^{tree} > notebook-true-split-results/source-sha.txt
          npm run test:notebook:browser > notebook-true-split-results/browser.log 2>&1 || { tail -100 notebook-true-split-results/browser.log; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notebook-split-native-${{ matrix.engine }}
          path: |
            notebook-true-split-results/
            notebook-navigation-results/
            notebook-drop-results/
            connection-direct-results/
          retention-days: 7
