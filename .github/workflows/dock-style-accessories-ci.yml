name: Dock Style Accessories CI

on:
  push:
    branches:
      - feature/dock-style-accessories
      - fix/dock-accessories-react
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run dock accessory regression
        run: |
          node scripts/test-dock-style-accessories.mjs
          node scripts/test-dock-style-accessories-functional.mjs
          node scripts/test-floating-toolbar-desktop-visibility.mjs
          node scripts/test-dock-liquid-glass.mjs
          node scripts/test-dock-refractive-lensing.mjs
          node scripts/test-mobile-glass-parity.mjs
          node scripts/test-mobile-glass-shell-geometry.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Existing drawing palette regressions
        run: |
          node scripts/test-floating-drawing-controls.mjs
          node scripts/test-ipad-color-palette.mjs
      - name: Production build
        run: npm run build
