name: Finalize Verified Collaborative History
on:
  push:
    branches: [fix/collaborative-history-20260915]
permissions:
  contents: write
  actions: read
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VERIFIED_RUN: '34929554730'
      VERIFIED_SHA: '2536c27258f8e0b03f38f8506c76abc44b44d344'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check immutable successful browser run and unchanged implementation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/AlOdinson/alex/actions/runs/$VERIFIED_RUN > /tmp/history-verified-run.json
          python3 - <<'PY'
          import json,os
          data=json.load(open('/tmp/history-verified-run.json'))
          assert data['head_sha']==os.environ['VERIFIED_SHA']
          assert data['status']=='completed' and data['conclusion']=='success'
          PY
          git merge-base --is-ancestor "$VERIFIED_SHA" HEAD
          test "$(git diff --name-only "$VERIFIED_SHA" HEAD)" = '.github/workflows/history-sync-verification.yml'
          test "$(git rev-parse origin/main)" = '9267e4c8e00e1dd7720ec4cbba92fdc389c04e12'
          git show "$VERIFIED_SHA":.github/workflows/history-sync-verification.yml > /tmp/verified-history-workflow.yml
      - name: Apply and verify tested source
        run: |
          python3 .github/scripts/apply-history-repair.py
          python3 .github/scripts/enable-history-ci-relay.py
          npm install --no-audit --no-fund
          npm run test:browser-authority
          npm run test:sync:ci
      - name: Production build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - name: Verify source hashes and prepare reviewed files
        run: |
          python3 - <<'PY'
          import subprocess
          workflow=subprocess.check_output(['git','show','a17fc33965261e8b0a64b50a605333e94c6f704f:.github/workflows/history-sync-verification.yml'],text=True)
          marker="          python3 - <<'PY'\n          from pathlib import Path\n"
          start=workflow.index(marker)+len("          python3 - <<'PY'\n")
          end=workflow.index('\n          PY\n',start)
          source='\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end].splitlines())
          exec(compile(source,'verified-history-finalizer','exec'))
          PY
          # This runner writes source only. Workflow publication is handled by the
          # separately authorized repository connector, not by expanding this token.
          git reset HEAD -- .github/workflows
          git restore --source=HEAD --worktree -- .github/workflows
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --check
      - name: Commit verified source to the isolated branch
        run: |
          git fetch origin fix/collaborative-history-20260915
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: reliable collaborative undo redo across device layouts'
          git push origin HEAD:fix/collaborative-history-20260915
          git rev-parse HEAD
