name: Localization Feature Checks

on:
  push:
    branches:
      - feature/ru-en-localization
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Normalize dynamic translation fragments
        run: node scripts/fix-i18n-fragments.mjs
      - name: Inventory Cyrillic UI source
        run: |
          echo '--- CYRILLIC SOURCE INVENTORY START ---'
          node scripts/list-cyrillic.mjs
          echo '--- CYRILLIC SOURCE INVENTORY END ---'
      - name: i18n regression
        run: node scripts/test-i18n.mjs
      - name: Portable existing regressions
        run: |
          node scripts/test-screen-share.mjs
          node scripts/test-mac-browser.mjs
          node scripts/test-sync-convergence.mjs
          node scripts/test-authoritative-log.mjs
          node scripts/test-collaboration-safety.mjs
          node scripts/test-fast-board-library.mjs
          node scripts/test-drawing-presets.mjs
          node scripts/test-pencil-transform-regression.mjs
      - name: Production build
        run: npm run build
      - name: Commit verified fragment normalization
        run: |
          if git diff --quiet -- src; then
            echo 'No source normalization changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'fix: normalize RU EN dynamic fragments'
          git push
