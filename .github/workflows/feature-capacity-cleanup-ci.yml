name: Feature Capacity Cleanup CI

on:
  push:
    branches:
      - feature/automatic-board-capacity-cleanup

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node --version && npm --version
      - run: npm install --no-audit --no-fund
      - name: Run sync suite and capture output
        id: sync
        shell: bash
        run: |
          set +e
          npm run test:sync > test-sync.log 2>&1
          status=$?
          cat test-sync.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-sync-log
          path: test-sync.log
      - run: npm run build
      - name: Fail if sync suite failed
        if: steps.sync.outputs.status != '0'
        run: exit 1
