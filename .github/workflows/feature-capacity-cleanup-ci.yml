name: Feature Capacity Cleanup CI

on:
  push:
    branches:
      - feature/automatic-board-capacity-cleanup

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:sync
      - run: npm run build
