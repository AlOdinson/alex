name: Deploy Alex Board to GitHub Pages

on:
  push:
    branches:
      - main
      - fix/connection-reliability-20260930
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci --no-audit --no-fund
      - run: npm run test:connections
      - run: npm run test:browser-authority
      - run: npm run test:sync:ci
      - run: npm run test:screen-share
      - run: npm run build

  direct-browser:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, engine: chromium}
          - {os: macos-latest, engine: webkit}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --no-package-lock playwright-core@1.55.0
      - run: node node_modules/playwright-core/cli.js install --with-deps ${{ matrix.engine }}
      - name: Direct connection, live repair, ICE restart and owner tab handoff (no TURN)
        env:
          VERIFICATION_BROWSER: ${{ matrix.engine }}
          WEBKIT_LOCAL_ICE: '1'
        run: bash scripts/run-connection-direct-ci.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connection-direct-${{ matrix.engine }}
          path: connection-direct-results/
          retention-days: 7

  build:
    if: github.ref == 'refs/heads/main'
    needs: [verify, direct-browser]
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Alex Board
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_WEBRTC_LIVE_V1: "true"
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Нужно добавить настройки Supabase в GitHub Secrets"
            exit 1
          fi
          npm run build

      - name: Create fallback for board links
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
