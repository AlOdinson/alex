name: Filled Board Integration
on:
  push:
    branches: [fix/filled-board-join-20260915]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile current main and verify local-tested bytes
        run: python .github/scripts/integrate-filled-board.py
      - name: Install dependencies as in production
        run: npm install --no-audit --no-fund
      - name: Clean-device regressions from both changes
        run: node --test scripts/test-filled-board-join.mjs scripts/test-late-join-*.mjs
      - name: Browser authority regression suite
        run: npm run test:browser-authority
      - name: Board and synchronization regressions
        run: npm run test:sync:ci
      - name: Production build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          npm run build
      - name: Install browser test driver
        run: npm install --no-save --no-package-lock playwright-core@1.55.0
      - name: Chromium filled-board join, reload truth and reconnection
        env:
          BROWSER_AUTHORITY_PREVIEW_URL: http://127.0.0.1:4173/alex/
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/alex-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/alex/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/test-browser-authority-large-snapshot-e2e.mjs
          node scripts/test-browser-authority-source-of-truth-e2e.mjs
          node scripts/test-browser-authority-datachannel-recovery-e2e.mjs
      - name: Commit verified merge on isolated branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json src/durableEditGate.js src/lib/browserBoardSession.js src/lib/peerDataChannel.js src/lib/peerProtocol.js src/lib/studentPeerNetwork.js src/lib/teacherPeerNetwork.js scripts/test-filled-board-join.mjs
          git diff --cached --check
          tree=$(git write-tree)
          commit=$(printf '%s\n' 'fix: integrate byte-safe snapshot recovery with latest late-join fixes' | git commit-tree "$tree" -p HEAD -p 9f97538f9b7bb45b783d8e2c592cb7694233735a)
          git update-ref HEAD "$commit"
          git push origin "$commit":fix/filled-board-join-20260915
          echo "VERIFIED_COMMIT=$commit"
