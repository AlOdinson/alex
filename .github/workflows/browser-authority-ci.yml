name: Browser Authority CI

on:
  push:
    branches:
      - feature/browser-authority-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Browser authority regressions
        run: npm run test:browser-authority

      - name: Production build
        run: npm run build
