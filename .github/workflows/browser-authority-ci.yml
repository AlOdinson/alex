name: Browser Authority CI

on:
  push:
    branches:
      - feature/browser-authority-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Browser authority regressions
        run: npm run test:browser-authority

      - name: Legacy board and sync regressions (hosted-safe)
        run: npm run test:sync:ci

      - name: Type-check stateless Ably token endpoint
        run: deno check --node-modules-dir=auto supabase/functions/ably-browser-token/index.ts

      - name: Production build
        run: npm run build
