name: Pyramid Direction Check

on:
  push:
    branches:
      - feature/pyramid-drag-direction-fix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Pyramid drag direction regression
        run: node scripts/test-solid-drag-mirroring.mjs
