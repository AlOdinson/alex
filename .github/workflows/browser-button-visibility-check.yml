name: Browser Button Visibility Check

on:
  push:
    branches:
      - feature/hide-browser-button
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Browser button visibility regression
        run: node scripts/test-browser-button-visibility.mjs
