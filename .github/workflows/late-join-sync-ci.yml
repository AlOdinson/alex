name: Late-join sync regressions

on:
  push:
    branches:
      - main
      - fix/late-join-sync-20260915
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  late-join:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Clean-device and stalled-sync regressions
        run: node --test scripts/test-late-join-sync.mjs
