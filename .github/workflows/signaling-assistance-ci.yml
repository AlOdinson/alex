name: Ably signaling assistance
on:
  push:
    branches: [fix/ably-signaling-assistance-20260925, main]
    paths: ['src/lib/**', 'scripts/*signaling-assistance*', '.github/workflows/signaling-assistance-ci.yml']
  pull_request:
    branches: [main]
    paths: ['src/lib/**', 'scripts/*signaling-assistance*', '.github/workflows/signaling-assistance-ci.yml']
permissions:
  contents: read
concurrency:
  group: signaling-assistance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --test scripts/test-signaling-assistance.mjs
      - run: npm run test:browser-authority
      - run: npm run test:sync:ci
      - run: node --test scripts/test-bounded*.mjs scripts/test-late-join-*.mjs scripts/test-board-creation-storage.mjs
      - run: npm run test:screen-share
      - run: npm run build
  browser:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            engine: chromium
          - os: macos-latest
            engine: webkit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-package-lock playwright-core@1.55.0
      - if: matrix.engine == 'webkit'
        run: node node_modules/playwright-core/cli.js install webkit
      - name: Recover deliberately lost offer, answer and ICE using real Ably and WebRTC
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VERIFICATION_BROWSER: ${{ matrix.engine }}
          VERIFICATION_TEST_URL: http://127.0.0.1:5173/alex/
        run: bash scripts/run-signaling-assistance-ci.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signaling-assistance-${{ matrix.engine }}
          path: |
            signaling-assistance-results/
            verification-evidence/
          retention-days: 7
