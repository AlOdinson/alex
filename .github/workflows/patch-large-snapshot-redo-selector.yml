name: Patch large snapshot redo selector

on:
  push:
    branches:
      - fix/browser-authority-convergence
    paths:
      - .github/workflows/patch-large-snapshot-redo-selector.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/browser-authority-convergence
          fetch-depth: 0
      - name: Match the actual redo accessibility name
        run: |
          python -c "from pathlib import Path; p=Path('scripts/test-browser-authority-large-snapshot-e2e.mjs'); s=p.read_text(); old=\"getByRole('button', { name: /Повторить/ })\"; new=\"getByRole('button', { name: /Вернуть/ })\"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))"
          git diff --check
          git diff -- scripts/test-browser-authority-large-snapshot-e2e.mjs
      - name: Commit test selector fix
        run: |
          git config user.name "Alex Board CI"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/test-browser-authority-large-snapshot-e2e.mjs
          git commit -m "test: use actual redo accessibility name"
          git push origin HEAD:fix/browser-authority-convergence
