name: Large Snapshot Regression
on:
  push:
    branches: [fix/shared-images-20260916]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply candidate snapshot deadline fix
        run: |
          git apply --check .github/large-snapshot-timeout.patch
          git apply .github/large-snapshot-timeout.patch
          git diff --check
      - run: node --test scripts/test-large-snapshot-timeouts.mjs scripts/test-history-deadlines.mjs scripts/test-teacher-peer-hub.mjs scripts/test-student-peer-network.mjs
