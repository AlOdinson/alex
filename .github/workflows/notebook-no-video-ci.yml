name: Notebook no-video performance work
on:
  push:
    branches: ['perf/notebook-no-video-20261005']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notebook-no-video-${{ github.sha }}
  cancel-in-progress: false
env:
  VITE_NOTEBOOK_OPERATIONS_V1: 'true'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci --no-audit --no-fund
      - run: node --test scripts/test-notebook-hotpath-regressions.mjs scripts/test-notebook-audit-metrics.mjs scripts/test-notebook-audit-fixture.mjs scripts/test-notebook-projection-cost.mjs scripts/test-notebook-gesture-index.mjs scripts/test-notebook-contained-fast-path.mjs scripts/test-notebook-append-cache.mjs scripts/test-notebook-append-integration.mjs scripts/test-notebook-indexed-model.mjs scripts/test-notebook-indexed-semantics.mjs scripts/test-notebook-indexed-pipeline.mjs scripts/test-notebook-addressed-append.mjs scripts/test-notebook-projection-yield.mjs
      - run: node --test scripts/test-board-tombstone-index.mjs scripts/test-notebook-tombstone-cost.mjs scripts/test-board-tombstone-migration.mjs scripts/test-board-tombstone-storage-cost.mjs scripts/test-board-creation-storage.mjs
      - run: node --test scripts/test-notebook-page-model.mjs scripts/test-notebook-page-model-integration.mjs
      - run: node --test scripts/test-notebook-damage-renderer.mjs scripts/test-notebook-damage-budget.mjs scripts/test-notebook-damage-pixels.mjs scripts/test-notebook-page-diff.mjs scripts/test-notebook-shadow-cache.mjs
      - run: node --test scripts/test-notebook-work-scheduler.mjs scripts/test-notebook-bounded-preparation.mjs
      - run: node --test scripts/test-notebook-eraser-index.mjs scripts/test-notebook-split-worker.mjs scripts/test-notebook-split-safety.mjs scripts/test-notebook-split-geometry-equivalence.mjs scripts/test-notebook-split-thread.mjs scripts/test-notebook-worker-raster-tiles.mjs
      - run: node --test scripts/test-notebook-cooperative-recovery.mjs
      - run: node --test scripts/test-notebook-zoom-cache.mjs scripts/test-notebook-zoom-pixels.mjs
      - run: node --test scripts/test-board-startup-preparation.mjs scripts/test-board-transient-maintenance.mjs scripts/test-board-startup-recovery-boundary.mjs
      - run: node scripts/benchmark-notebook-page-model.mjs
      - run: node --test scripts/test-bounded*.mjs
      - run: node scripts/benchmark-notebook-indexed-model.mjs
      - run: node scripts/benchmark-notebook-tombstone-storage.mjs
      - run: npm run test:pencil
      - run: npm run test:sync:ci
      - run: npm run test:student:reading
      - run: npm run test:media
      - run: npm run test:notebook
      - run: npm run test:browser-authority
      - run: npm run test:student:storage
      - run: npm run test:screen-share
      - name: Excluded video files remain unchanged
        run: git diff --exit-code 6ad2a404ce9ddc92d8682659d89c824576c5a276 HEAD -- src/lib/boardScreenShare.js src/lib/boardScreenShareCompositor.js src/lib/screenShareFramePump.js src/components/ScreenShare.jsx
      - run: npm run build
  browser:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, engine: chromium}
          - {os: macos-latest, engine: webkit}
    runs-on: ${{ matrix.os }}
    env:
      VERIFICATION_BROWSER: ${{ matrix.engine }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --no-package-lock playwright-core@1.62.1
      - run: node node_modules/playwright-core/cli.js install --with-deps ${{ matrix.engine }}
      - name: Production worker build
        run: |
          npm run build
          node --test scripts/test-notebook-split-worker-build.mjs
      - name: Vector split geometry runs outside the browser main thread
        run: node scripts/test-notebook-split-worker-browser.mjs
      - name: Bounded scene startup, transient maintenance and first real stroke
        run: node scripts/test-board-startup-browser.mjs
      - name: Notebook viewport quality, memory lifetime and real wheel input
        run: node scripts/test-notebook-zoom-browser.mjs
      - name: Cooperative recovery, pending input, acknowledgement bursts and real UI history
        run: node scripts/test-notebook-recovery-browser.mjs
      - name: Bounded preparation, input fairness, cancellation and atomic installation
        run: node scripts/test-notebook-preparation-browser.mjs
      - name: Indexed notebook eraser and real pointer deletion, undo, redo and reload
        run: node scripts/test-notebook-eraser-browser.mjs
      - name: Exact local damage pixels, preserved text/images, compositing and undo
        run: node scripts/test-notebook-local-paint-browser.mjs
      - name: Page model, lazy export, browser storage and guarded undo
        run: node scripts/test-notebook-page-model-browser.mjs
      - name: Deletion storage migration, resume, quota-independent commit cost and history
        run: node scripts/test-board-tombstone-browser.mjs
      - name: Schema-compatible recovery reader on previous drawing code
        run: |
          candidate="$GITHUB_SHA"
          trap 'git restore --source="$candidate" -- src' EXIT
          git restore --source=52a65f38badf74215568540297e71ba3ce7b8b0c -- src
          git restore --source="$candidate" -- src/lib/browserAuthorityStore.js src/lib/boardTombstoneIndex.js
          NOTEBOOK_TOMBSTONE_OUTPUT=notebook-tombstone-results/recovery-v4 node scripts/test-board-tombstone-browser.mjs
          git restore --source="$candidate" -- src
      - name: Repeated focused input comparison against the last verified block
        run: |
          baseline=e54e45ed4ab79cfbac8319ecfbd971c4ff449c64
          candidate="$GITHUB_SHA"
          trap 'git restore --source="$candidate" -- src' EXIT
          for round in 1 2 3; do
            order="baseline candidate"
            if [ "$round" -eq 2 ]; then order="candidate baseline"; fi
            for mode in $order; do
              reference="$candidate"
              flag=""
              if [ "$mode" = baseline ]; then reference="$baseline"; flag="--baseline"; fi
              git restore --source="$reference" -- src
              GITHUB_SHA="$reference" NOTEBOOK_AUDIT_OUTPUT="notebook-audit-results/$mode/round-$round" node scripts/benchmark-notebook-real-input.mjs --focused $flag
            done
          done
          git restore --source="$candidate" -- src
      - name: Full workload and overlapping-input regressions
        run: |
          NOTEBOOK_AUDIT_OUTPUT=notebook-audit-results/candidate/full node scripts/benchmark-notebook-real-input.mjs
          NOTEBOOK_AUDIT_OUTPUT=notebook-audit-results/candidate/burst node scripts/benchmark-notebook-real-input.mjs --focused --burst
      - name: Interior append pixels match canonical rendering
        run: node scripts/test-notebook-append-browser.mjs
      - name: Existing notebook browser regressions
        run: npm run test:notebook:browser
      - name: PDF continuity regression
        run: npm run test:pdf:continuity
      - name: Existing received-video compatibility without video changes
        env:
          WEBKIT_LOCAL_ICE: '1'
        run: |
          npm run test:notebook:video
          cp /tmp/notebook-received-video.json notebook-append-results/${{ matrix.engine }}-received-video.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-no-video-ink-${{ matrix.engine }}-${{ github.sha }}
          path: |
            notebook-audit-results/
            notebook-true-split-results/
            notebook-navigation-results/
            notebook-drop-results/
            notebook-append-results/
            notebook-tombstone-results/
            notebook-page-model-results/
            notebook-damage-results/
            notebook-preparation-results/
            notebook-recovery-results/
            notebook-zoom-results/
            board-startup-results/
            notebook-eraser-results/
            notebook-split-worker-results/
          retention-days: 14
