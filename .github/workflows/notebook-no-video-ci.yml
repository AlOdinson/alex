name: Notebook no-video performance work
on:
  push:
    branches: ['perf/notebook-no-video-20261005']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notebook-no-video-${{ github.sha }}
  cancel-in-progress: false
env:
  VITE_NOTEBOOK_OPERATIONS_V1: 'true'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci --no-audit --no-fund
      - run: node --test scripts/test-notebook-hotpath-regressions.mjs scripts/test-notebook-audit-metrics.mjs
      - run: npm run test:notebook
      - run: npm run test:browser-authority
      - run: npm run test:student:storage
      - run: npm run test:screen-share
      - name: Excluded video files remain unchanged
        run: git diff --exit-code 6ad2a404ce9ddc92d8682659d89c824576c5a276 HEAD -- src/lib/boardScreenShare.js src/lib/boardScreenShareCompositor.js src/lib/screenShareFramePump.js src/components/ScreenShare.jsx
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --no-package-lock playwright-core@1.62.1
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Compare identical input on baseline and candidate
        run: |
          baseline=6ad2a404ce9ddc92d8682659d89c824576c5a276
          files=(src/lib/authoritySnapshot.js src/lib/authorityOperationEvaluator.js src/lib/notebookSession.js src/lib/notebookBoardController.js)
          git restore --source="$baseline" -- "${files[@]}"
          set +e
          GITHUB_SHA="$baseline" NOTEBOOK_AUDIT_OUTPUT=notebook-audit-results/baseline node scripts/benchmark-notebook-real-input.mjs --baseline --smoke
          before=$?
          git restore --source="$GITHUB_SHA" -- "${files[@]}"
          restored=$?
          if [ "$restored" -ne 0 ]; then exit "$restored"; fi
          NOTEBOOK_AUDIT_OUTPUT=notebook-audit-results/candidate node scripts/benchmark-notebook-real-input.mjs --smoke
          after=$?
          if [ "$before" -ne 0 ] || [ "$after" -ne 0 ]; then exit 1; fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-no-video-ink-${{ github.sha }}
          path: notebook-audit-results/
          retention-days: 14
