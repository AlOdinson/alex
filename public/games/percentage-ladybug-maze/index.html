<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Жучок и процентный лабиринт</title>
<style>
  :root {
    color-scheme: dark;
    --panel: rgba(13, 25, 28, .94);
    --line: rgba(180, 242, 204, .34);
    --text: #f6fff8;
    --muted: #b7cec0;
    --good: #78ffa7;
    --bad: #ff7586;
    --honey: #ffc94f;
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    margin: 0;
    overflow: hidden;
    background: #14251c;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  body {
    display: grid;
    place-items: center;
  }

  #game {
    position: relative;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 520px;
    overflow: hidden;
    background: #1d3324;
  }


  html.embedded,
  html.embedded body,
  html.embedded #game {
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
  }

  html.embedded,
  html.embedded body {
    overscroll-behavior: none;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  .hud {
    position: absolute;
    z-index: 5;
    top: 12px;
    left: 12px;
    right: 12px;
    display: grid;
    grid-template-columns: auto auto;
    gap: 10px;
    align-items: center;
    pointer-events: none;
  }

  .hudBox {
    min-height: 46px;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 13px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: rgba(8, 20, 15, .84);
    box-shadow: 0 8px 28px rgba(0,0,0,.20);
    backdrop-filter: blur(7px);
    color: var(--text);
    white-space: nowrap;
  }

  .hudLabel {
    color: var(--muted);
    font-size: 11px;
    font-weight: 850;
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  #hearts {
    min-width: 138px;
    font-size: 23px;
    letter-spacing: 2px;
  }

  #waterStatus {
    display: none !important;
  }

  #waterStatus.speed-up {
    border-color: rgba(143, 224, 255, .92);
    background: rgba(8, 55, 82, .96);
    box-shadow:
      0 8px 28px rgba(0, 0, 0, .20),
      0 0 24px rgba(73, 195, 255, .38);
  }

  .question {
    position: absolute;
    z-index: 10;
    left: 50%;
    bottom: 18px;
    width: min(920px, calc(100% - 24px));
    transform: translate(-50%, 18px);
    padding: 16px;
    border: 1px solid rgba(203, 255, 215, .42);
    border-radius: 19px;
    background: rgba(7, 19, 13, .96);
    box-shadow: 0 18px 60px rgba(0, 0, 0, .45);
    opacity: 0;
    pointer-events: none;
    transition: .18s ease;
  }

  .question.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  #questionText {
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(20px, 2.2vw, 32px);
    font-weight: 700;
    text-align: center;
  }

  .answers {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 13px;
  }

  .answer {
    min-height: 72px;
    display: grid;
    place-items: center;
    padding: 10px;
    border: 1px solid rgba(176, 241, 198, .28);
    border-radius: 14px;
    background: linear-gradient(180deg, rgba(33, 63, 44, .96), rgba(14, 33, 22, .98));
    color: #f8fff9;
    font-size: clamp(18px, 2vw, 28px);
    font-weight: 900;
    text-align: center;
  }

  .answer small {
    display: block;
    margin-top: 4px;
    color: #a7c8b2;
    font-size: 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  .answer.good {
    border-color: var(--good);
    box-shadow: 0 0 24px rgba(80, 255, 140, .28);
    background: rgba(26, 85, 48, .96);
  }

  .answer.bad {
    border-color: var(--bad);
    background: rgba(93, 25, 35, .96);
  }

  .overlay {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    padding: 18px;
    background: rgba(5, 14, 9, .62);
    backdrop-filter: blur(5px);
    opacity: 0;
    pointer-events: none;
    transition: .22s ease;
  }

  .overlay.show {
    opacity: 1;
    pointer-events: auto;
  }

  .overlay.review {
    place-items: end;
    background: transparent;
    backdrop-filter: none;
    pointer-events: none;
  }

  .overlay.review .modal {
    pointer-events: auto;
    width: min(430px, 94vw);
  }

  .modal {
    width: min(720px, 95vw);
    padding: 25px;
    border: 1px solid rgba(191, 248, 209, .38);
    border-radius: 22px;
    background: rgba(9, 24, 15, .96);
    box-shadow: 0 24px 90px rgba(0, 0, 0, .45);
    color: var(--text);
    text-align: center;
  }

  .modal h1 {
    margin: 0;
    font-size: clamp(28px, 4.2vw, 54px);
    line-height: 1;
  }

  .modal p {
    margin: 14px auto 0;
    max-width: 630px;
    color: #c2d8c8;
    font-size: 15px;
    line-height: 1.55;
  }

  .rules {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
    margin-top: 17px;
  }

  .rule {
    padding: 12px;
    border: 1px solid rgba(180, 241, 199, .18);
    border-radius: 13px;
    background: rgba(32, 58, 40, .52);
    color: #dff2e4;
    font-size: 13px;
    line-height: 1.35;
  }

  button {
    appearance: none;
    border: 0;
    cursor: pointer;
  }

  .primary {
    min-width: 220px;
    height: 52px;
    margin-top: 20px;
    padding: 0 22px;
    border-radius: 14px;
    background: linear-gradient(180deg, #ffe18a, #d89a22);
    box-shadow: 0 10px 30px rgba(255, 192, 59, .22);
    color: #2d1b00;
    font-size: 16px;
    font-weight: 950;
  }

  .flash {
    position: absolute;
    inset: 0;
    z-index: 8;
    pointer-events: none;
    background: rgba(255, 63, 82, .34);
    opacity: 0;
  }

  .pause-button {
    position: absolute;
    z-index: 16;
    top: max(10px, env(safe-area-inset-top));
    left: max(10px, env(safe-area-inset-left));
    width: 46px;
    height: 46px;
    display: none;
    place-items: center;
    border: 1px solid rgba(230, 255, 236, .42);
    border-radius: 14px;
    background: rgba(7, 25, 15, .92);
    color: #f4fff5;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .28);
    font-size: 21px;
    font-weight: 950;
    touch-action: manipulation;
  }

  .pause-button:disabled {
    opacity: .45;
    cursor: default;
  }

  .mobile-controls {
    position: absolute;
    z-index: 15;
    left: max(16px, env(safe-area-inset-left));
    bottom: max(18px, env(safe-area-inset-bottom));
    display: none;
    width: 150px;
    height: 150px;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  .joystick-base {
    position: absolute;
    inset: 0;
    border: 2px solid rgba(224, 255, 228, .34);
    border-radius: 50%;
    background: rgba(5, 24, 13, .58);
    box-shadow: inset 0 0 28px rgba(138, 255, 158, .10), 0 10px 28px rgba(0, 0, 0, .24);
    backdrop-filter: blur(4px);
  }

  .joystick-knob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 66px;
    height: 66px;
    transform: translate(-50%, -50%);
    border: 2px solid rgba(245, 255, 241, .72);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #dfffa8, #66a83e 68%, #274f25);
    box-shadow: 0 8px 20px rgba(0, 0, 0, .32);
    pointer-events: none;
  }

  .observer-badge {
    position: absolute;
    z-index: 14;
    left: 50%;
    top: auto;
    bottom: max(4px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: none;
    padding: 8px 13px;
    border: 1px solid rgba(215, 240, 255, .34);
    border-radius: 999px;
    background: rgba(5, 18, 24, .78);
    color: #e8f7ff;
    font-size: 12px;
    font-weight: 850;
    pointer-events: none;
  }

  .paused-badge {
    position: absolute;
    z-index: 17;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: none;
    padding: 15px 22px;
    border: 1px solid rgba(255, 239, 176, .54);
    border-radius: 16px;
    background: rgba(22, 20, 8, .88);
    color: #fff4bd;
    font-size: clamp(22px, 5vw, 40px);
    font-weight: 950;
    pointer-events: none;
  }

  .paused-badge.show,
  .observer-badge.show {
    display: block;
  }

  @media (pointer: coarse), (max-width: 820px) {
    .pause-button,
    .mobile-controls {
      display: grid;
    }

    .hud {
      left: 66px;
    }

    .question.show {
      pointer-events: auto;
    }

    .answer {
      cursor: pointer;
      touch-action: manipulation;
    }
  }

  @media (max-width: 720px) {
    .hud {
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .hudBox {
      min-height: 40px;
      padding: 7px 9px;
      font-size: 12px;
    }

    #hearts { min-width: 0; font-size: 18px; }
    #waterStatus { justify-self: stretch; }

    .question {
      bottom: 8px;
      padding: 10px;
    }

    .answer {
      min-height: 60px;
      font-size: 17px;
    }

    .rules {
      grid-template-columns: 1fr;
    }

    .modal {
      padding: 19px;
    }

  }
</style>
</head>
<body>
<div id="game">
  <canvas id="canvas"></canvas>

  <button class="pause-button" id="pauseBtn" type="button" aria-label="Пауза">⏸</button>
  <div class="observer-badge" id="observerBadge">Сейчас вы наблюдаете</div>
  <div class="paused-badge" id="pausedBadge">Пауза</div>
  <div class="mobile-controls" id="mobileControls" aria-label="Джойстик движения">
    <div class="joystick-base"></div>
    <div class="joystick-knob" id="joystickKnob"></div>
  </div>

  <div class="hud">
    <div class="hudBox">
      <span class="hudLabel">Жизни</span>
      <span id="hearts">❤️❤️❤️❤️❤️</span>
    </div>
    <div class="hudBox">
      <span class="hudLabel">Путь</span>
      <strong id="gateProgress">0 / 12</strong>
    </div>
    <div class="hudBox" id="waterStatus">
      <span class="hudLabel">Вода</span>
      <strong id="waterText">кран закрыт</strong>
    </div>
  </div>

  <div class="question" id="question">
    <div id="questionText"></div>
    <div class="answers">
      <div class="answer" id="answer0"></div>
      <div class="answer" id="answer1"></div>
      <div class="answer" id="answer2"></div>
    </div>
  </div>

  <div class="flash" id="flash"></div>

  <div class="overlay show" id="startOverlay">
    <div class="modal">
      <h1>Доберись до Мёда!</h1>
      <div class="rules">
        <div class="rule"><strong>Движение</strong><br>Стрелки или WASD.</div>
        <div class="rule"><strong>Ответы</strong><br>← левый, ↑/↓ средний, → правый.</div>
        <div class="rule"><strong>Вода</strong><br>Каждую секунду в воде исчезает одно сердце.</div>
      </div>
      <button class="primary" id="startBtn">Начать игру</button>
    </div>
  </div>

  <div class="overlay" id="endOverlay">
    <div class="modal">
      <h1 id="endTitle"></h1>
      <p id="endText"></p>
      <button class="primary" id="restartBtn">Новый лабиринт</button>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const GAME_ID = "percentage-ladybug-maze";
  const embedded = new URLSearchParams(window.location.search).get("embedded") === "1";
  if (embedded) document.documentElement.classList.add("embedded");

  function notifyHost(type, payload = {}) {
    if (window.parent === window) return;
    window.parent.postMessage({
      source: "alex-board-game",
      gameId: GAME_ID,
      type,
      payload,
      sentAt: Date.now()
    }, window.location.origin);
  }

  function getGameSummary() {
    return {
      state,
      lives,
      mainOpened,
      totalGates: MAIN_INTERNAL_GATES + 2,
      selectedDifficulty,
      player: { x: player.x, y: player.y, dir: player.dir },
      waterStarted,
      waterStopped,
      honeyActive,
      elapsed
    };
  }


  function cloneEntity(entity) {
    return entity ? { ...entity } : null;
  }

  function getSyncNetworkState() {
    return {
      version: 1,
      state,
      paused,
      lives,
      mainOpened,
      selectedDifficulty,
      difficultyLocked,
      honeyActive,
      waterStarted,
      waterStopped,
      waterDelay,
      waterTimer,
      waterStepTimer,
      waterMazeBoostTimer,
      damageTimer,
      elapsed,
      player: cloneEntity(player),
      ant: cloneEntity(ant),
      hornet: cloneEntity(hornet),
      openGates: gates.filter(gate => gate.open).map(gate => keyOf(gate.x, gate.y)),
      waterCells: [...waterCells],
      question: questionGate && questionData ? {
        gateKey: keyOf(questionGate.x, questionGate.y),
        data: {
          text: questionData.text,
          options: questionData.options.map(option => ({ ...option }))
        },
        lockedFor: Math.max(0, questionLockedUntil - performance.now())
      } : null,
      endTitle: ui.endTitle.textContent,
      endText: ui.endText.textContent
    };
  }

  function getFullNetworkState() {
    return {
      version: 1,
      grid: grid.map(row => row.slice()),
      mainPath: mainPath.slice(),
      gates: gates.map(gate => ({ ...gate })),
      exitRow,
      exitY,
      sync: getSyncNetworkState()
    };
  }

  function rebuildGateMap() {
    gateMap = new Map();
    gates.forEach(gate => gateMap.set(keyOf(gate.x, gate.y), gate));
  }

  function renderQuestionFromNetwork(question) {
    if (!question?.data) {
      closeQuestion();
      return;
    }
    const gate = gateMap.get(String(question.gateKey ?? ""));
    if (!gate) {
      closeQuestion();
      return;
    }
    questionGate = gate;
    questionData = {
      text: String(question.data.text ?? ""),
      options: Array.isArray(question.data.options)
        ? question.data.options.map(option => ({ ...option }))
        : []
    };
    questionLockedUntil = performance.now() + Number(question.lockedFor ?? 0);
    ui.questionText.textContent = questionData.text;
    questionData.options.forEach((option, index) => {
      if (!ui.answers[index]) return;
      ui.answers[index].className = "answer";
      const keyHint = index === 0 ? "← или A" : index === 1 ? "↑/↓ или W/S" : "→ или D";
      ui.answers[index].innerHTML = `${option.value}<small>${keyHint}</small>`;
    });
    ui.question.classList.add("show");
  }

  function syncOverlayFromNetwork(sync) {
    ui.endOverlay.classList.remove("show", "review");
    if (sync.state === "menu") {
      ui.startOverlay.classList.add("show");
    } else {
      ui.startOverlay.classList.remove("show");
    }
    if (sync.state === "won" || sync.state === "lost") {
      ui.endTitle.textContent = sync.endTitle || (sync.state === "won" ? "Мёд найден!" : "Игра окончена");
      ui.endText.textContent = sync.endText || "";
      ui.endOverlay.classList.add("show");
      if (sync.state === "lost") ui.endOverlay.classList.add("review");
    }
    ui.pausedBadge.classList.toggle("show", Boolean(sync.paused));
    ui.pauseBtn.textContent = sync.paused ? "▶" : "⏸";
    ui.pauseBtn.setAttribute("aria-label", sync.paused ? "Продолжить" : "Пауза");
  }

  function applySyncNetworkState(sync, { snap = false } = {}) {
    if (!sync) return;
    state = String(sync.state ?? state);
    paused = Boolean(sync.paused);
    lives = Number(sync.lives ?? lives);
    mainOpened = Number(sync.mainOpened ?? mainOpened);
    selectedDifficulty = String(sync.selectedDifficulty ?? selectedDifficulty);
    difficultyLocked = Boolean(sync.difficultyLocked);
    honeyActive = Boolean(sync.honeyActive);
    waterStarted = Boolean(sync.waterStarted);
    waterStopped = Boolean(sync.waterStopped);
    waterDelay = Number(sync.waterDelay ?? waterDelay);
    waterTimer = Number(sync.waterTimer ?? waterTimer);
    waterStepTimer = Number(sync.waterStepTimer ?? waterStepTimer);
    waterMazeBoostTimer = Number(sync.waterMazeBoostTimer ?? waterMazeBoostTimer);
    damageTimer = Number(sync.damageTimer ?? damageTimer);
    elapsed = Number(sync.elapsed ?? elapsed);

    const openGateSet = new Set(Array.isArray(sync.openGates) ? sync.openGates.map(String) : []);
    gates.forEach(gate => { gate.open = openGateSet.has(keyOf(gate.x, gate.y)); });
    waterCells = new Set(Array.isArray(sync.waterCells) ? sync.waterCells.map(String) : []);

    remoteTarget.player = cloneEntity(sync.player);
    remoteTarget.ant = cloneEntity(sync.ant);
    remoteTarget.hornet = cloneEntity(sync.hornet);
    if (snap) {
      if (sync.player) player = cloneEntity(sync.player);
      if (sync.ant) ant = cloneEntity(sync.ant);
      if (sync.hornet) hornet = cloneEntity(sync.hornet);
    }

    if (sync.question) renderQuestionFromNetwork(sync.question);
    else closeQuestion();
    syncOverlayFromNetwork(sync);
    updateHud();
  }

  function applyFullNetworkState(snapshot) {
    if (!snapshot) return;
    if (Array.isArray(snapshot.grid)) grid = snapshot.grid.map(row => row.slice());
    if (Array.isArray(snapshot.mainPath)) mainPath = snapshot.mainPath.slice();
    if (Array.isArray(snapshot.gates)) gates = snapshot.gates.map(gate => ({ ...gate }));
    exitRow = Number(snapshot.exitRow ?? exitRow);
    exitY = Number(snapshot.exitY ?? exitY);
    rebuildGateMap();
    applySyncNetworkState(snapshot.sync, { snap: true });
  }

  function notifyAction(action) {
    notifyHost("GAME_ACTION", { action: { ...action, at: Date.now() } });
  }

  function currentInputVector() {
    let x = joystickInput.x;
    let y = joystickInput.y;
    if (keys.ArrowLeft || keys.KeyA) x -= 1;
    if (keys.ArrowRight || keys.KeyD) x += 1;
    if (keys.ArrowUp || keys.KeyW) y -= 1;
    if (keys.ArrowDown || keys.KeyS) y += 1;
    const length = Math.hypot(x, y);
    if (length > 1) return { x: x / length, y: y / length };
    return { x, y };
  }

  function emitInputAction(force = false) {
    if (!controlEnabled || networkMode === "observer") return;
    const vector = currentInputVector();
    const compact = {
      x: Number(vector.x.toFixed(3)),
      y: Number(vector.y.toFixed(3))
    };
    const signature = `${compact.x}:${compact.y}`;
    const now = performance.now();
    if (!force && signature === lastInputSignature) return;
    if (!force && now - lastInputSentAt < 55) {
      clearTimeout(inputSendTimer);
      inputSendTimer = setTimeout(() => emitInputAction(true), 55 - (now - lastInputSentAt));
      return;
    }
    lastInputSignature = signature;
    lastInputSentAt = now;
    notifyAction({ kind: "input", ...compact });
  }

  function focusGameInput() {
    try { window.focus(); } catch { /* Ignore browsers that reject window focus. */ }
    canvas.tabIndex = 0;
    try { canvas.focus({ preventScroll: true }); } catch { canvas.focus?.(); }
  }

  function setNetworkMode(nextMode, enabled) {
    networkMode = nextMode === "observer" ? "observer" : nextMode === "active" ? "active" : "solo";
    controlEnabled = Boolean(enabled) && networkMode !== "observer";
    if (!controlEnabled) {
      for (const key in keys) keys[key] = false;
      joystickInput = { x: 0, y: 0 };
      updateJoystickKnob();
    }
    ui.mobileControls.style.display = controlEnabled && !paused && !questionGate ? "" : "none";
    ui.pauseBtn.style.display = controlEnabled ? "" : "none";
    ui.pauseBtn.disabled = !controlEnabled;
    ui.startBtn.disabled = !controlEnabled;
    ui.restartBtn.disabled = !controlEnabled;
    ui.observerBadge.classList.toggle("show", networkMode === "observer");
    if (controlEnabled) requestAnimationFrame(focusGameInput);
  }

  function setPaused(nextPaused, { remote = false } = {}) {
    if (!controlEnabled && !remote) return;
    paused = Boolean(nextPaused);
    for (const key in keys) keys[key] = false;
    joystickInput = { x: 0, y: 0 };
    remoteInput = { x: 0, y: 0 };
    updateJoystickKnob();
    ui.pausedBadge.classList.toggle("show", paused);
    ui.mobileControls.style.display = controlEnabled && !paused && !questionGate ? "" : "none";
    ui.pauseBtn.textContent = paused ? "▶" : "⏸";
    ui.pauseBtn.setAttribute("aria-label", paused ? "Продолжить" : "Пауза");
    if (!remote) notifyAction({ kind: "pause", paused });
  }

  function togglePause() {
    if (state !== "playing") return;
    setPaused(!paused);
  }

  function applyRemoteAction(action) {
    if (!action) return;
    if (action.kind === "input") {
      remoteInput = {
        x: Number(action.x ?? 0),
        y: Number(action.y ?? 0)
      };
      return;
    }
    if (action.kind === "pause") {
      setPaused(Boolean(action.paused), { remote: true });
      return;
    }
    if (action.kind === "answer") {
      const index = Number(action.index);
      if (ui.answers[index]) {
        ui.answers.forEach(answer => answer.classList.remove("good", "bad"));
        ui.answers[index].classList.add(action.correct ? "good" : "bad");
      }
      return;
    }
    if (action.kind === "question-open" && action.question) {
      renderQuestionFromNetwork(action.question);
      return;
    }
    if (action.kind === "question-close") {
      closeQuestion();
      return;
    }
    if (action.kind === "gate-open") {
      const gate = gateMap.get(String(action.gateKey ?? ""));
      if (gate) gate.open = true;

  function updateObserver(dt) {
    if (!paused && state === "playing" && !questionGate) {
      const length = Math.hypot(remoteInput.x, remoteInput.y);
      if (length > .01) {
        const dx = remoteInput.x / Math.max(1, length);
        const dy = remoteInput.y / Math.max(1, length);
        player.dir = Math.atan2(dy, dx);
        tryRemoteMove(dx * PLAYER_SPEED * dt, dy * PLAYER_SPEED * dt);
      }
      elapsed += dt;
    }

    const smoothing = Math.min(1, dt * 9);
    for (const [entity, target] of [[player, remoteTarget.player], [ant, remoteTarget.ant], [hornet, remoteTarget.hornet]]) {
      if (!target) continue;
      entity.x += (Number(target.x) - entity.x) * smoothing;
      entity.y += (Number(target.y) - entity.y) * smoothing;
      const angleDelta = Math.atan2(Math.sin(Number(target.dir) - entity.dir), Math.cos(Number(target.dir) - entity.dir));
      entity.dir += angleDelta * smoothing;
      if ("alerted" in target) entity.alerted = Boolean(target.alerted);
      if ("escapeState" in target) entity.escapeState = target.escapeState;
      if ("escapeTimer" in target) entity.escapeTimer = Number(target.escapeTimer ?? 0);
      if ("step" in target) entity.step = Number(target.step ?? 0);
    }
  }

  function cellIndex(c, r) {
    return r * MAZE_COLS + c;
  }

  function neighborsOf(c, r) {
    const result = [];
    if (r > 0) result.push([c, r - 1, 0]);
    if (c < MAZE_COLS - 1) result.push([c + 1, r, 1]);
    if (r < MAZE_ROWS - 1) result.push([c, r + 1, 2]);
    if (c > 0) result.push([c - 1, r, 3]);
    return result;
  }

  function generateMazeOnce() {
    const cells = Array.from({ length: MAZE_ROWS }, () =>
      Array.from({ length: MAZE_COLS }, () => ({
        links: new Set(),
        visited: false
      }))
    );

    const stack = [[0, START_ROW]];
    cells[START_ROW][0].visited = true;

    while (stack.length) {
      const [c, r] = stack[stack.length - 1];
      const choices = neighborsOf(c, r).filter(([nc, nr]) => !cells[nr][nc].visited);

      if (!choices.length) {
        stack.pop();
        continue;
      }

      const [nc, nr] = choices[randInt(choices.length)];
      cells[r][c].links.add(cellIndex(nc, nr));
      cells[nr][nc].links.add(cellIndex(c, r));
      cells[nr][nc].visited = true;
      stack.push([nc, nr]);
    }

    return cells;
  }

  function pathToRightBoundary(cells) {
    const start = cellIndex(0, START_ROW);
    const queue = [start];
    const parent = new Map([[start, -1]]);
    const distance = new Map([[start, 0]]);

    for (let qi = 0; qi < queue.length; qi++) {
      const current = queue[qi];
      const c = current % MAZE_COLS;
      const r = Math.floor(current / MAZE_COLS);

      for (const next of cells[r][c].links) {
        if (parent.has(next)) continue;
        parent.set(next, current);
        distance.set(next, distance.get(current) + 1);
        queue.push(next);
      }
    }

    let exit = cellIndex(MAZE_COLS - 1, 0);
    for (let r = 0; r < MAZE_ROWS; r++) {
      const candidate = cellIndex(MAZE_COLS - 1, r);
      if ((distance.get(candidate) || 0) > (distance.get(exit) || 0)) exit = candidate;
    }

    const path = [];
    let current = exit;
    while (current !== -1) {
      path.push(current);
      current = parent.get(current);
    }
    path.reverse();

    return { path, exit, distance };
  }

  function collectBranchLeafPaths(cells, path) {
    const mainCells = new Set(path);
    const routes = [];

    for (const mainCell of path) {
      const c = mainCell % MAZE_COLS;
      const r = Math.floor(mainCell / MAZE_COLS);

      for (const linked of cells[r][c].links) {
        if (mainCells.has(linked)) continue;

        const stack = [{
          node: linked,
          parent: mainCell,
          route: [linked]
        }];

        while (stack.length) {
          const current = stack.pop();
          const cc = current.node % MAZE_COLS;
          const rr = Math.floor(current.node / MAZE_COLS);
          const children = [];

          for (const next of cells[rr][cc].links) {
            if (next === current.parent || mainCells.has(next)) continue;
            children.push(next);
          }

          if (children.length === 0) {
            routes.push(current.route);
            continue;
          }

          for (const next of children) {
            stack.push({
              node: next,
              parent: current.node,
              route: [...current.route, next]
            });
          }
        }
      }
    }

    return routes;
  }

  function createMaze() {
    let attempts = 0;
    let result;
    let longFalseRoutes = [];

    do {
      maze = generateMazeOnce();
      result = pathToRightBoundary(maze);
      longFalseRoutes = collectBranchLeafPaths(maze, result.path)
        .filter(route => route.length >= MIN_DECOY_BRANCH_LENGTH);
      attempts++;
    } while (
      (
        result.path.length < MIN_MAIN_PATH_LENGTH ||
        longFalseRoutes.length < DECOY_GATES
      ) &&
      attempts < 260
    );

    mainPath = result.path;
    exitRow = Math.floor(result.exit / MAZE_COLS);
    exitY = exitRow * 2 + 1;

    grid = Array.from({ length: GRID_H }, () => Array(GRID_W).fill(1));

    for (let r = 0; r < MAZE_ROWS; r++) {
      for (let c = 0; c < MAZE_COLS; c++) {
        const gx = c * 2 + 1;
        const gy = r * 2 + 1;
        grid[gy][gx] = 0;

        for (const linked of maze[r][c].links) {
          const nc = linked % MAZE_COLS;
          const nr = Math.floor(linked / MAZE_COLS);
          grid[(gy + nr * 2 + 1) / 2][(gx + nc * 2 + 1) / 2] = 0;
        }
      }
    }

    grid[START_Y][0] = 0;
    grid[exitY][GRID_W - 1] = 0;
  }

  function corridorBetween(a, b) {
    const ac = a % MAZE_COLS;
    const ar = Math.floor(a / MAZE_COLS);
    const bc = b % MAZE_COLS;
    const br = Math.floor(b / MAZE_COLS);
    return {
      x: ac + bc + 1,
      y: ar + br + 1
    };
  }

  function createGates() {
    gates = [];
    gateMap.clear();

    function addGate(x, y, type, order) {
      const gate = {
        x, y, type, order,
        open: false,
        pulse: Math.random() * Math.PI * 2
      };
      gates.push(gate);
      gateMap.set(keyOf(x, y), gate);
      return gate;
    }

    addGate(0, START_Y, "entry", 0);

    const edgeCount = mainPath.length - 1;
    const usedIndices = new Set();

    for (let i = 1; i <= MAIN_INTERNAL_GATES; i++) {
      let index = Math.round(i * edgeCount / (MAIN_INTERNAL_GATES + 1));
      index = Math.max(3, Math.min(edgeCount - 4, index));

      while (usedIndices.has(index) && index < edgeCount - 4) index++;
      usedIndices.add(index);

      const p = corridorBetween(mainPath[index], mainPath[index + 1]);
      addGate(p.x, p.y, "main", i);
    }

    addGate(GRID_W - 1, exitY, "exit", MAIN_INTERNAL_GATES + 1);

    const falseRoutes = collectBranchLeafPaths(maze, mainPath)
      .filter(route => route.length >= MIN_DECOY_BRANCH_LENGTH);

    shuffle(falseRoutes);

    const decoyPositions = [];

    function farEnoughFromOtherDecoys(point, minimumDistance) {
      return decoyPositions.every(other =>
        Math.abs(point.x - other.x) + Math.abs(point.y - other.y) >= minimumDistance
      );
    }

    function tryPlaceDecoys(minimumDistance) {
      for (const route of falseRoutes) {
        if (decoyPositions.length >= DECOY_GATES) break;

        // Жучок сначала должен пройти заметную часть ложного коридора.
        // После ворот также остаётся длинный участок до настоящего тупика.
        const minimumDepth = 4;
        const maximumDepth = route.length - 4;
        if (maximumDepth < minimumDepth) continue;

        const middleDepth = Math.round(route.length * (.42 + Math.random() * .14));
        const depth = Math.max(minimumDepth, Math.min(maximumDepth, middleDepth));
        const p = corridorBetween(route[depth - 1], route[depth]);

        if (gateMap.has(keyOf(p.x, p.y))) continue;
        if (!farEnoughFromOtherDecoys(p, minimumDistance)) continue;

        addGate(p.x, p.y, "decoy", -1);
        decoyPositions.push(p);
      }
    }

    tryPlaceDecoys(5);

    if (decoyPositions.length < DECOY_GATES) {
      tryPlaceDecoys(2);
    }
  }

  function makeQuestion() {
    const percents = [5, 10, 12, 15, 20, 25, 30, 35, 40, 45, 50, 60, 75];
    const p = percents[randInt(percents.length)];

    let base;
    do {
      base = (randInt(36) + 5) * 10;
    } while ((base * p) % 100 !== 0);

    const correct = base * p / 100;
    const distractors = new Set();

    const candidates = [
      base * Math.max(1, p - 5) / 100,
      base * (p + 5) / 100,
      correct + base / 10,
      Math.max(1, correct - base / 10),
      base - correct,
      correct + 5,
      Math.max(1, correct - 5),
      base * p / 10
    ];

    for (const value of candidates) {
      if (Number.isInteger(value) && value !== correct && value > 0) distractors.add(value);
      if (distractors.size >= 2) break;
    }

    while (distractors.size < 2) {
      const value = correct + (randInt(9) - 4) * 5;
      if (value > 0 && value !== correct) distractors.add(value);
    }

    const options = [
      { value: correct, correct: true },
      ...Array.from(distractors).slice(0, 2).map(value => ({ value, correct: false }))
    ];

    shuffle(options);

    return {
      text: `Сколько будет ${p}% от ${base}?`,
      options
    };
  }

  function openQuestion(gate) {

  function selectAnswer(index) {
    if (!controlEnabled || paused || !questionGate || !questionData || performance.now() < questionLockedUntil) return;

    const option = questionData.options[index];
    notifyAction({ kind: "answer", index, correct: Boolean(option?.correct) });

    if (option.correct) {
      ui.answers[index].classList.add("good");
      questionGate.open = true;

      if (questionGate.type === "entry" || questionGate.type === "main" || questionGate.type === "exit") {
        mainOpened++;
      }

      if (questionGate.type === "exit") {
        // Последние ворота открываются, но вода продолжает распространяться.
        honeyActive = true;
      }

      if (mainOpened === 3 || mainOpened === 6 || mainOpened === 9) {
        waterMazeBoostTimer = 0;
        showWaterSpeedNotice();
      }

      updateHud();
      notifyAction({
        kind: "gate-open",
        gateKey: keyOf(questionGate.x, questionGate.y),
        mainOpened,
        honeyActive
      });

      // Ответ уже принят. Пока зелёная подсветка ещё видна,
      // следующие клавиши движения только игнорируются.
      questionData = null;
      questionLockedUntil = Infinity;
      for (const key in keys) keys[key] = false;

      setTimeout(() => {
        closeQuestion();
        notifyAction({ kind: "question-close" });
      }, 360);
    } else {
      ui.answers[index].classList.add("bad");
      loseLife(true);

      if (state !== "playing") return;

      setTimeout(() => {
        questionData = makeQuestion();
        ui.questionText.textContent = questionData.text;

          ui.answers[answerIndex].innerHTML = `${newOption.value}<small>${keyHint}</small>`;
        });
        questionLockedUntil = performance.now() + 220;
        notifyAction({
          kind: "question-open",
          question: {
            gateKey: keyOf(questionGate.x, questionGate.y),
            data: {
              text: questionData.text,
              options: questionData.options.map(option => ({ ...option }))
            },
            lockedFor: 220
          }
        });
      }, 430);
    }
  }

    state = "lost";
    closeQuestion();
    ui.endTitle.textContent = "Игра окончена";
    ui.endText.textContent = `${reason} Открыто ворот на основном пути: ${mainOpened} из ${MAIN_INTERNAL_GATES + 2}.`;
    ui.endOverlay.classList.add("show", "review");
    notifyAction({ kind: "finish", result: "lost", title: ui.endTitle.textContent, text: ui.endText.textContent });
    notifyHost("GAME_FINISHED", { result: "lost", reason, ...getGameSummary() });
  }

  function winGame() {
    state = "won";
    waterStopped = true;
    ui.endTitle.textContent = "Мёд найден!";
    ui.endText.textContent = `Божья коровка добралась до баночки мёда. Открыто ворот: ${mainOpened}.`;
    ui.endOverlay.classList.remove("review");
    ui.endOverlay.classList.add("show");
    notifyAction({ kind: "finish", result: "won", title: ui.endTitle.textContent, text: ui.endText.textContent });
    notifyHost("GAME_FINISHED", { result: "won", ...getGameSummary() });
  }

  function isMeadowTile(tx, ty) {
    if (
      tx < MEADOW_MIN_X ||
      tx >= MEADOW_MAX_X ||
      ty < MEADOW_MIN_Y ||
      ty >= MEADOW_MAX_Y
    ) {
      return false;
    }

    // Большие свободные поля слева и справа.
    if (tx < 0 || tx >= GRID_W) return true;

    // Полный обход лабиринта по верхней или нижней траве.
    if (ty < 0 || ty >= GRID_H) return true;

    return false;
  }

  function isFloorTile(tx, ty) {
    if (tx >= 0 && tx < GRID_W && ty >= 0 && ty < GRID_H) {
      return grid[ty][tx] === 0;
    }

    return isMeadowTile(tx, ty);
  }

  function isClosedGate(tx, ty) {
    const gate = gateMap.get(keyOf(tx, ty));
    return Boolean(gate && !gate.open);
  }

  function isSolidTile(tx, ty) {
    if (!isFloorTile(tx, ty)) return true;
    return isClosedGate(tx, ty);
  }

  function circleHitsSolid(x, y, radius) {
    const minX = Math.floor(x - radius);
    const maxX = Math.floor(x + radius);
    const minY = Math.floor(y - radius);
    const maxY = Math.floor(y + radius);

    for (let ty = minY; ty <= maxY; ty++) {
      for (let tx = minX; tx <= maxX; tx++) {
        if (!isSolidTile(tx, ty)) continue;

        const nearestX = Math.max(tx, Math.min(x, tx + 1));
        const nearestY = Math.max(ty, Math.min(y, ty + 1));
        const dx = x - nearestX;
        const dy = y - nearestY;

        if (dx * dx + dy * dy < radius * radius) return true;
      }
    }

    return false;
  }

  function circleTouchesGate(x, y, radius, gate) {
    const nearestX = Math.max(gate.x, Math.min(x, gate.x + 1));
    const nearestY = Math.max(gate.y, Math.min(y, gate.y + 1));
    const dx = x - nearestX;
    const dy = y - nearestY;
    return dx * dx + dy * dy < radius * radius;
  }

  function gateIntentionallyHit(nextX, nextY, moveX, moveY) {
    const moveLength = Math.hypot(moveX, moveY);
    if (moveLength === 0) return null;

    for (const gate of gates) {
      if (gate.open) continue;
      if (!circleTouchesGate(nextX, nextY, PLAYER_RADIUS, gate)) continue;

      const toGateX = gate.x + .5 - player.x;
      const toGateY = gate.y + .5 - player.y;
      const gateDistance = Math.hypot(toGateX, toGateY);
      if (gateDistance === 0) continue;

      const alignment =
        (toGateX * moveX + toGateY * moveY) /
        (gateDistance * moveLength);

      // Задание включается только когда игрок явно нажимает в сторону ворот.
      if (alignment > .72) return gate;
    }

    return null;
  }

  function tryMove(dx, dy) {
    const intendedGate = gateIntentionallyHit(
      player.x + dx,
      player.y + dy,
      dx,
      dy
    );

    if (intendedGate) {
      openQuestion(intendedGate);
      return;
    }

    const nx = player.x + dx;
    if (!circleHitsSolid(nx, player.y, PLAYER_RADIUS)) player.x = nx;

    const ny = player.y + dy;
    if (!circleHitsSolid(player.x, ny, PLAYER_RADIUS)) player.y = ny;
  }


  function tryRemoteMove(dx, dy) {
    const nx = player.x + dx;
    if (!circleHitsSolid(nx, player.y, PLAYER_RADIUS)) player.x = nx;
    const ny = player.y + dy;
    if (!circleHitsSolid(player.x, ny, PLAYER_RADIUS)) player.y = ny;
  }

  function isProtectedFinishPath(tx, ty) {
    return (
      ty === exitY &&
      tx >= GRID_W &&
      tx <= GRID_W + 5
    );
  }

  function canWaterEnter(tx, ty) {
    if (isProtectedFinishPath(tx, ty)) return false;
    return isFloorTile(tx, ty) && !isClosedGate(tx, ty);
  }

  function expandWaterOneLayer(mazeOnly = false) {
    if (!waterStarted || waterStopped || waterDelay > 0) return;

    if (waterCells.size === 0) {
      if (!mazeOnly && canWaterEnter(0, START_Y)) {
        waterCells.add(keyOf(0, START_Y));
      }
      return;
    }

    const additions = [];
    const directions = [[1,0],[-1,0],[0,1],[0,-1]];

    for (const cellKey of waterCells) {
      const [x, y] = cellKey.split(",").map(Number);

      for (const [dx, dy] of directions) {
        const nx = x + dx;
        const ny = y + dy;
        const nextKey = keyOf(nx, ny);

        if (waterCells.has(nextKey)) continue;

        if (
          mazeOnly &&
          (
            nx < 0 ||
            nx >= GRID_W ||
            ny < 0 ||
            ny >= GRID_H
          )
        ) {
          continue;
        }

        if (canWaterEnter(nx, ny)) additions.push(nextKey);
      }
    }

    for (const nextKey of additions) waterCells.add(nextKey);
  }

  function playerInWater() {
    const tx = Math.floor(player.x);
    const ty = Math.floor(player.y);
    return waterCells.has(keyOf(tx, ty));
  }

  function waterNearEntity(entity, radius = 1.65) {
    if (!waterStarted || waterDelay > 0 || waterCells.size === 0) return false;

    const minX = Math.floor(entity.x - radius);
    const maxX = Math.floor(entity.x + radius);
    const minY = Math.floor(entity.y - radius);
    const maxY = Math.floor(entity.y + radius);

    for (let y = minY; y <= maxY; y++) {
      for (let x = minX; x <= maxX; x++) {
        if (!waterCells.has(keyOf(x, y))) continue;

        const nearestX = Math.max(x, Math.min(entity.x, x + 1));
        const nearestY = Math.max(y, Math.min(entity.y, y + 1));
        if (Math.hypot(entity.x - nearestX, entity.y - nearestY) <= radius) {
          return true;
        }
      }
    }

    return false;
  }

  function updateAntEscape(dt) {
    if (ant.escapeState === "gone") return true;

    if (ant.escapeState === "none" && waterNearEntity(ant)) {
      ant.escapeState = "burrowing";
      ant.escapeTimer = 0;
      ant.alerted = false;
    }

    if (ant.escapeState === "burrowing") {
      ant.escapeTimer += dt;
      if (ant.escapeTimer >= 1.85) ant.escapeState = "gone";
      return true;
    }

    return false;
  }

  function updateHornetEscape(dt) {
    if (hornet.escapeState === "gone") return true;

    if (hornet.escapeState === "none" && waterNearEntity(hornet)) {
      hornet.escapeState = "flying";
      hornet.escapeTimer = 0;
      hornet.alerted = false;
    }

    if (hornet.escapeState === "flying") {
      hornet.escapeTimer += dt;
      hornet.x += 4.8 * dt;
      hornet.y += 6.2 * dt;
      hornet.dir = Math.atan2(6.2, 4.8);

      if (hornet.escapeTimer >= 1.45) hornet.escapeState = "gone";
      return true;
    }

    return false;
  }

  function playerInsideMaze() {
    return (
      player.x >= 0 &&
      player.x < GRID_W &&
      player.y >= 0 &&
      player.y < GRID_H
    );
  }

  function updateChaser(chaser, dt, speed, radius, noticeDistance, onCaught) {
    // Внутри лабиринта божья коровка полностью скрыта от стражей.
    // Даже уже начавшаяся погоня прекращается у границы лабиринта.
    if (playerInsideMaze()) {
      chaser.alerted = false;
      return;
    }
    const dx = player.x - chaser.x;
    const dy = player.y - chaser.y;
    const distance = Math.hypot(dx, dy);

    if (!chaser.alerted) {
      const forwardX = Math.cos(chaser.dir);
      const forwardY = Math.sin(chaser.dir);
      const dot = distance > 0
        ? (dx * forwardX + dy * forwardY) / distance
        : 1;

      if (distance < noticeDistance && dot > .28) {
        chaser.alerted = true;
      }

      if (distance < 1.25) chaser.alerted = true;
    }

    if (chaser.alerted) {
      chaser.dir = Math.atan2(dy, dx);
      chaser.step += dt * 13;

      if (distance > .001) {
        chaser.x += dx / distance * speed * dt;
        chaser.y += dy / distance * speed * dt;
      }

      if (distance < radius + PLAYER_RADIUS + .10) {
        onCaught();
      }
    }
  }

  function updateAnt(dt) {
    if (updateAntEscape(dt)) return;

    updateChaser(
      ant,
      dt,
      ANT_SPEED,
      ANT_RADIUS,
      ANT_NOTICE_DISTANCE,
      eatenByAnt
    );
  }

  function updateHornet(dt) {
    if (updateHornetEscape(dt)) return;

    updateChaser(
      hornet,
      dt,
      HORNET_SPEED,
      HORNET_RADIUS,
      HORNET_NOTICE_DISTANCE,
      eatenByHornet
    );
  }

  function eatenByAnt() {
    if (state !== "playing") return;

    state = "lost";
    closeQuestion();
    ui.endTitle.textContent = "Вас съели";
    ui.endText.textContent = "Муравей заметил божью коровку и догнал её.";
    ui.endOverlay.classList.add("show", "review");
    notifyAction({ kind: "finish", result: "lost", title: ui.endTitle.textContent, text: ui.endText.textContent });
    notifyHost("GAME_FINISHED", { result: "lost", reason: "ant", ...getGameSummary() });
  }

  function eatenByHornet() {
    if (state !== "playing") return;

    state = "lost";
    closeQuestion();
    ui.endTitle.textContent = "Вас съели";
    ui.endText.textContent = "Шершень заметил божью коровку и догнал её.";
    ui.endOverlay.classList.add("show", "review");
    notifyAction({ kind: "finish", result: "lost", title: ui.endTitle.textContent, text: ui.endText.textContent });
    notifyHost("GAME_FINISHED", { result: "lost", reason: "hornet", ...getGameSummary() });
  }

  function update(dt) {
    flashValue = Math.max(0, flashValue - dt * 2.7);
    cameraShake = Math.max(0, cameraShake - dt * 18);

    if (networkMode === "observer") {
      updateObserver(dt);
      return;
    }

    if (paused) return;
    elapsed += dt;
    if (state !== "playing") return;

    updateAnt(dt);
    if (state !== "playing") return;

    updateHornet(dt);
    if (state !== "playing") return;

    if (controlEnabled && !questionGate) {
      const input = currentInputVector();
      if (input.x || input.y) {
        player.dir = Math.atan2(input.y, input.x);
        tryMove(input.x * PLAYER_SPEED * dt, input.y * PLAYER_SPEED * dt);
      }
    }

    updateDifficultySelection();

    const entryGate = gates.find(gate => gate.type === "entry");

    if (!waterStarted && entryGate?.open && player.x > .75) {
      waterStarted = true;
      difficultyLocked = true;
      waterDelay = 4.5;
      waterTimer = 0;
      waterStepTimer = 0;
      waterMazeBoostTimer = 0;
      updateHud();
      notifyAction({ kind: "water-start", waterDelay });
    }

    if (waterStarted && !waterStopped) {
      if (waterDelay > 0) {
        waterDelay = Math.max(0, waterDelay - dt);
        updateHud();
      } else {
        waterStepTimer += dt;
        waterMazeBoostTimer += dt;

        while (waterStepTimer >= .92) {
          waterStepTimer -= .92;
          expandWaterOneLayer(false);
        }

        const difficulty = getSelectedDifficulty();

        let speedStages = 0;
        if (mainOpened >= 9) {
          speedStages = 3;
        } else if (mainOpened >= 6) {
          speedStages = 2;
        } else if (mainOpened >= 3) {
          speedStages = 1;
        }

        // Новая базовая скорость зависит от сложности.
        // Каждая ступень добавляет ещё 10% от этой новой базы,
        // поэтому бонусы не рассчитываются от старой скорости.
        const selectedBaseFactor =
          CURRENT_MAZE_BASE_FACTOR * difficulty.multiplier;
        const targetMazeFactor =
          selectedBaseFactor * (1 + speedStages * .10);

        // Обычный общий шаг воды уже даёт коэффициент 1.
        // Здесь добавляются только недостающие внутренние шаги.
        const extraMazeRateFactor = Math.max(0, targetMazeFactor - 1);
        const mazeBoostInterval =
          extraMazeRateFactor > 0
            ? .92 / extraMazeRateFactor
            : Infinity;

        while (waterMazeBoostTimer >= mazeBoostInterval) {
          waterMazeBoostTimer -= mazeBoostInterval;
          expandWaterOneLayer(true);
        }
      }
    }

    if (playerInWater()) {
      damageTimer += dt;

      while (damageTimer >= 1 && state === "playing") {
        damageTimer -= 1;
        loseLife(false);
      }
    } else {
      damageTimer = 0;
    }

    const honeyX = GRID_W + 4.65;
    const honeyY = exitY + .5;
    if (Math.hypot(player.x - honeyX, player.y - honeyY) < 1.95) {
      winGame();
    }
  }

  function worldTransform() {
    const minX = MEADOW_MIN_X;
    const maxX = MEADOW_MAX_X;
    const minY = MEADOW_MIN_Y;
    const maxY = MEADOW_MAX_Y;

    // На телефоне и планшете вся высота игрового мира всегда помещается в экран.
    // Ширина видимой области определяется реальной шириной устройства, а камера
    // следует за жучком по горизонтали и удерживает его около центра экрана.
    const worldH = maxY - minY;
    const scale = H / worldH;
    const visibleWorldW = W / scale;
    let cameraX = player.x;
    const halfVisibleW = visibleWorldW / 2;

    if (maxX - minX <= visibleWorldW) cameraX = (minX + maxX) / 2;
    else cameraX = Math.max(minX + halfVisibleW, Math.min(maxX - halfVisibleW, cameraX));

    const cameraY = (minY + maxY) / 2;
    return {
      scale,
      ox: W / 2 - cameraX * scale,
      oy: H / 2 - cameraY * scale
    };
  }

  function roundedRect(x, y, w, h, r) {
    const radius = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.arcTo(x + w, y, x + w, y + h, radius);
    ctx.arcTo(x + w, y + h, x, y + h, radius);
    ctx.arcTo(x, y + h, x, y, radius);
    ctx.arcTo(x, y, x + w, y, radius);
    ctx.closePath();
  }

  function drawBackground() {
    const gradient = ctx.createLinearGradient(0, 0, 0, H);
    gradient.addColorStop(0, "#6da960");
    gradient.addColorStop(1, "#2f6038");
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);

    ctx.globalAlpha = .13;
    ctx.fillStyle = "#ddf4c8";
    for (let i = 0; i < 170; i++) {
      const x = (i * 89 % 997) / 997 * W;
      const y = (i * 173 % 991) / 991 * H;
      ctx.beginPath();
      ctx.arc(x, y, 1 + (i % 3), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawMaze(t) {
    const grass = ctx.createLinearGradient(0, 0, 0, GRID_H);
    grass.addColorStop(0, "#487d42");
    grass.addColorStop(1, "#27572f");

    for (let y = 0; y < GRID_H; y++) {
      for (let x = 0; x < GRID_W; x++) {
        if (grid[y][x] === 0) {
          ctx.fillStyle = "#c69d61";
          ctx.fillRect(x, y, 1, 1);

          ctx.fillStyle = "rgba(83, 57, 29, .11)";
          ctx.beginPath();
          ctx.arc(x + .25 + ((x * 17 + y * 11) % 4) * .12, y + .35, .055, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = grass;
          roundedRect(x + .035, y + .035, .93, .93, .16);
          ctx.fill();

          ctx.strokeStyle = "rgba(180, 236, 154, .13)";
          ctx.lineWidth = .055;
          ctx.stroke();

          ctx.fillStyle = "rgba(17, 55, 26, .20)";
          ctx.beginPath();
          ctx.arc(x + .34, y + .33, .20, 0, Math.PI * 2);
          ctx.arc(x + .69, y + .61, .18, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    ctx.fillStyle = "#c69d61";
    ctx.fillRect(-3, START_Y, 3, 1);
    ctx.fillRect(GRID_W, exitY, 5.35, 1);

    if (waterStarted) drawWater(t);
    drawDifficultySelector(t);
    drawGates(t);
    drawTap(t);
    drawHoney();
  }

  function drawWater(t) {
    ctx.save();

    for (const cellKey of waterCells) {
      const [x, y] = cellKey.split(",").map(Number);
      const wave = .05 * Math.sin(t * 4 + x * 1.7 + y * 1.1);

      const water = ctx.createLinearGradient(x, y, x, y + 1);
      water.addColorStop(0, "rgba(80, 199, 242, .77)");
      water.addColorStop(1, "rgba(30, 116, 191, .88)");
      ctx.fillStyle = water;
      roundedRect(x + .025, y + .025 + wave, .95, .95 - wave, .14);
      ctx.fill();

      ctx.strokeStyle = "rgba(214, 247, 255, .46)";
      ctx.lineWidth = .045;
      ctx.beginPath();
      ctx.moveTo(x + .14, y + .32 + wave);
      ctx.quadraticCurveTo(x + .5, y + .20 - wave, x + .86, y + .33 + wave);
      ctx.stroke();
    }

    if (waterStarted && waterDelay > 0) {
      const progress = 1 - waterDelay / 4.5;
      const startX = -3.05;
      const endX = -.05;
      const length = (endX - startX) * progress;
      ctx.fillStyle = "rgba(68, 170, 229, .88)";
      roundedRect(startX, START_Y + .28, length, .44, .20);
      ctx.fill();
    }

    ctx.restore();
  }

  function drawGate(gate, t) {
    const cx = gate.x + .5;
    const cy = gate.y + .5;
    const vertical = gate.y % 2 === 1;

    ctx.save();
    ctx.translate(cx, cy);

    if (gate.open) {
      ctx.globalAlpha = .25;
      ctx.strokeStyle = "#dbf0c9";
      ctx.lineWidth = .09;
      ctx.beginPath();
      if (vertical) {
        ctx.moveTo(-.42, -.46);
        ctx.lineTo(-.42, .46);
        ctx.moveTo(.42, -.46);
        ctx.lineTo(.42, .46);
      } else {
        ctx.moveTo(-.46, -.42);
        ctx.lineTo(.46, -.42);
        ctx.moveTo(-.46, .42);
        ctx.lineTo(.46, .42);
      }
      ctx.stroke();
      ctx.restore();
      return;
    }

    const pulse = .75 + .25 * Math.sin(t * 3 + gate.pulse);
    ctx.shadowColor = "#d7ff8a";
    ctx.shadowBlur = .30 * pulse;

    ctx.strokeStyle = "#9bc65b";
    ctx.lineWidth = .12;

    for (let i = -2; i <= 2; i++) {
      const offset = i * .18;

      ctx.beginPath();
      if (vertical) {
        ctx.moveTo(offset, -.48);
        ctx.lineTo(offset, .48);
      } else {
        ctx.moveTo(-.48, offset);
        ctx.lineTo(.48, offset);
      }
      ctx.stroke();
    }

    ctx.fillStyle = "#6b4828";
    roundedRect(-.31, -.23, .62, .46, .10);
    ctx.fill();

    ctx.strokeStyle = "rgba(255, 226, 132, .72)";
    ctx.lineWidth = .035;
    ctx.stroke();

    ctx.fillStyle = "#ffe68a";
    ctx.font = "950 .39px system-ui";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("%", 0, .015);

    ctx.restore();
  }

  function drawGates(t) {
    for (const gate of gates) drawGate(gate, t);
  }

  function getSelectedDifficulty() {
    return (
      DIFFICULTY_PADS.find(pad => pad.id === selectedDifficulty) ||
      DIFFICULTY_PADS[1]
    );
  }

  function updateDifficultySelection() {
    if (difficultyLocked || waterStarted || state !== "playing") return;

    for (const pad of DIFFICULTY_PADS) {
      const inside =
        player.x >= pad.x &&
        player.x <= pad.x + pad.w &&
        player.y >= pad.y &&
        player.y <= pad.y + pad.h;

      if (inside) {
        if (selectedDifficulty !== pad.id) {
          selectedDifficulty = pad.id;
          notifyAction({ kind: "difficulty", difficulty: pad.id });
        }
        return;
      }
    }
  }

  function drawDifficultySelector(t) {
    ctx.save();

    ctx.fillStyle = "rgba(236, 255, 226, .90)";
    ctx.font = "900 .58px system-ui";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(
      difficultyLocked ? "СЛОЖНОСТЬ ВЫБРАНА" : "ВЫБЕРИ СЛОЖНОСТЬ",
      -10.30,
      START_Y - 3.68
    );

    for (const pad of DIFFICULTY_PADS) {
      const selected = pad.id === selectedDifficulty;
      const pulse = .82 + Math.sin(t * 4.2) * .18;

      if (selected) {
        ctx.shadowColor = "rgba(191, 255, 133, .92)";
        ctx.shadowBlur = .34 * pulse;
        ctx.fillStyle = difficultyLocked
          ? "rgba(76, 126, 48, .97)"
          : "rgba(101, 163, 59, .98)";
        ctx.strokeStyle = "#e1ff9c";
        ctx.lineWidth = .10;
      } else {
        ctx.shadowBlur = 0;
        ctx.fillStyle = "rgba(24, 67, 36, .90)";
        ctx.strokeStyle = "rgba(184, 232, 162, .52)";
        ctx.lineWidth = .055;
      }

      roundedRect(pad.x, pad.y, pad.w, pad.h, .18);
      ctx.fill();
      ctx.stroke();

      if (selected) {
        ctx.fillStyle = "rgba(226, 255, 176, .24)";
        roundedRect(
          pad.x + .10,
          pad.y + .10,
          pad.w - .20,
          pad.h * .30,
          .10
        );
        ctx.fill();
      }

      ctx.shadowBlur = 0;
      ctx.fillStyle = selected ? "#f4ffd7" : "#d8ead3";
      ctx.font = selected
        ? "950 .78px system-ui"
        : "850 .72px system-ui";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(
        pad.label,
        pad.x + pad.w / 2,
        pad.y + pad.h / 2 + .015
      );
    }

    ctx.restore();
  }

  function drawTap(t) {
    const x = -4.05;
    const y = START_Y + .30;

    ctx.save();
    ctx.translate(x, y);

    ctx.shadowColor = "rgba(31, 58, 66, .65)";
    ctx.shadowBlur = .35;

    // Толстая вертикальная труба.
    const pipe = ctx.createLinearGradient(-.55, 0, .55, 0);
    pipe.addColorStop(0, "#37474e");
    pipe.addColorStop(.20, "#87979e");
    pipe.addColorStop(.52, "#c6d0d3");
    pipe.addColorStop(.78, "#75868d");
    pipe.addColorStop(1, "#303e44");

    ctx.fillStyle = pipe;
    roundedRect(-.48, -1.45, .96, 2.05, .22);
    ctx.fill();

    ctx.strokeStyle = "#27343a";
    ctx.lineWidth = .08;
    ctx.stroke();

    // Горизонтальный носик крана.
    ctx.fillStyle = pipe;
    roundedRect(.18, -.82, 1.42, .58, .20);
    ctx.fill();
    ctx.stroke();

    // Изогнутый конец носика.
    ctx.beginPath();
    ctx.arc(1.34, -.24, .34, -Math.PI / 2, Math.PI / 2);
    ctx.lineTo(1.08, .10);
    ctx.lineTo(1.08, -.58);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Выход воды.
    ctx.fillStyle = "#23333a";
    roundedRect(1.15, -.05, .42, .28, .10);
    ctx.fill();

    // Большой красный вентиль.
    ctx.save();
    ctx.translate(0, -1.46);
    ctx.rotate(waterStarted ? Math.PI / 4 : 0);

    ctx.strokeStyle = "#8b251f";
    ctx.lineWidth = .15;
    ctx.fillStyle = "#d94c3f";

    ctx.beginPath();
    ctx.arc(0, 0, .48, 0, Math.PI * 2);
    ctx.stroke();

    for (let i = 0; i < 6; i++) {
      const angle = i * Math.PI / 3;
      ctx.beginPath();
      ctx.moveTo(Math.cos(angle) * .14, Math.sin(angle) * .14);
      ctx.lineTo(Math.cos(angle) * .62, Math.sin(angle) * .62);
      ctx.stroke();
    }

    ctx.fillStyle = "#b53a31";
    ctx.beginPath();
    ctx.arc(0, 0, .22, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#f07c67";
    ctx.beginPath();
    ctx.arc(-.06, -.07, .07, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    // Капля или струя воды.
    if (waterStarted) {
      const stream = ctx.createLinearGradient(0, .15, 0, 1.42);
      stream.addColorStop(0, "rgba(188, 238, 255, .92)");
      stream.addColorStop(.45, "rgba(76, 183, 231, .88)");
      stream.addColorStop(1, "rgba(32, 119, 196, .55)");
      ctx.fillStyle = stream;
      roundedRect(1.25, .16, .22, 1.20, .10);
      ctx.fill();
    } else {
      ctx.fillStyle = "#69c8ee";
      ctx.beginPath();
      ctx.arc(1.36, .34 + Math.sin(t * 5) * .03, .11, 0, Math.PI * 2);
      ctx.fill();
    }

    // Основание.
    ctx.fillStyle = "#54666d";
    roundedRect(-.67, .50, 1.34, .28, .10);
    ctx.fill();
    ctx.strokeStyle = "#26353a";
    ctx.lineWidth = .07;
    ctx.stroke();

    ctx.restore();
  }

  function drawHoney() {
    const x = GRID_W + 4.65;
    const y = exitY + .5;

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(2.7, 2.7);

    ctx.shadowColor = "#ffc84f";
    ctx.shadowBlur = .55;

    // Крышка.
    const lid = ctx.createLinearGradient(0, -.82, 0, -.55);
    lid.addColorStop(0, "#a9662a");
    lid.addColorStop(1, "#572d13");
    ctx.fillStyle = lid;
    roundedRect(-.55, -.83, 1.10, .25, .08);
    ctx.fill();

    ctx.strokeStyle = "#3f220f";
    ctx.lineWidth = .055;
    ctx.stroke();

    // Рёбра крышки.
    ctx.strokeStyle = "rgba(255, 193, 98, .34)";
    ctx.lineWidth = .025;
    for (let i = -4; i <= 4; i++) {
      const lx = i * .11;
      ctx.beginPath();
      ctx.moveTo(lx, -.80);
      ctx.lineTo(lx, -.60);

    }

    // Горлышко банки.
    ctx.fillStyle = "rgba(238, 250, 236, .94)";
    roundedRect(-.40, -.64, .80, .22, .08);

    // Стеклянный корпус.
    const glass = ctx.createLinearGradient(-.55, 0, .55, 0);
    glass.addColorStop(0, "rgba(224, 247, 237, .92)");
    glass.addColorStop(.20, "rgba(255, 255, 244, .64)");
    glass.addColorStop(.72, "rgba(209, 239, 226, .76)");
    glass.addColorStop(1, "rgba(171, 214, 198, .90)");
    ctx.fillStyle = glass;
    roundedRect(-.58, -.49, 1.16, 1.18, .24);
    ctx.fill();

    ctx.strokeStyle = "rgba(255, 255, 246, .94)";
    ctx.lineWidth = .06;
    ctx.stroke();

    // Мёд внутри.
    const honey = ctx.createLinearGradient(0, -.15, 0, .62);
    honey.addColorStop(0, "#ffe977");
    honey.addColorStop(.48, "#f5b820");
    honey.addColorStop(1, "#c8740d");
    ctx.fillStyle = honey;
    roundedRect(-.49, -.10, .98, .70, .18);
    ctx.fill();

    // Блик.
    ctx.strokeStyle = "rgba(255,255,255,.72)";
    ctx.lineWidth = .07;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-.39, -.33);
    ctx.quadraticCurveTo(-.48, .05, -.36, .35);
    ctx.stroke();

    // Крупная этикетка.
    ctx.fillStyle = "#fff4ca";
    roundedRect(-.43, -.01, .86, .42, .10);

    ctx.fillStyle = "#754308";
    ctx.font = "950 .34px system-ui";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("МЁД", 0, .20);

    ctx.restore();
  }

  function drawAnt(t) {
    const isBurrowing = ant.escapeState === "burrowing";
    const isGone = ant.escapeState === "gone";
    const progress = isGone ? 1 : Math.min(1, ant.escapeTimer / 1.85);
    const burrowCoveredByWater = waterCells.has(
      keyOf(Math.floor(ant.x), Math.floor(ant.y))
    );

    // Вода рисуется раньше муравья. Не рисуем лунку и землю поверх неё.
    if ((isBurrowing || isGone) && burrowCoveredByWater) return;

    ctx.save();
    ctx.translate(ant.x, ant.y);

    // Лунка и свежая земля остаются после исчезновения муравья.
    if (isBurrowing || isGone) {
      const holeProgress = Math.min(1, progress / .62);
      const moundProgress = Math.min(1, progress / .76);

      // Рассыпанная земля по краям.
      ctx.fillStyle = `rgba(92, 55, 27, ${.68 * moundProgress})`;
      for (let i = 0; i < 16; i++) {
        const angle = i * 2.399;
        const radius = .48 + (i % 5) * .085;
        const px = Math.cos(angle) * radius;
        const py = .28 + Math.sin(angle) * radius * .31;
        const size = .055 + (i % 4) * .016;

        ctx.beginPath();
        ctx.ellipse(px, py, size * 1.35, size, angle, 0, Math.PI * 2);
        ctx.fill();
      }

      // Неровный земляной вал вокруг норы.
      const earth = ctx.createRadialGradient(0, .25, .08, 0, .25, 1.02);
      earth.addColorStop(0, "rgba(69, 38, 18, 0)");
      earth.addColorStop(.48, `rgba(101, 62, 30, ${.84 * moundProgress})`);
      earth.addColorStop(.76, `rgba(126, 81, 40, ${.72 * moundProgress})`);
      earth.addColorStop(1, "rgba(75, 45, 23, 0)");

      ctx.fillStyle = earth;
      ctx.beginPath();
      ctx.ellipse(0, .28, .98 * moundProgress, .43 * moundProgress, 0, 0, Math.PI * 2);
      ctx.fill();

      // Тёмная дырочка в центре.
      const hole = ctx.createRadialGradient(-.08, .20, .03, 0, .25, .72);
      hole.addColorStop(0, "rgba(8, 5, 3, .98)");
      hole.addColorStop(.58, "rgba(35, 19, 9, .96)");
      hole.addColorStop(1, "rgba(85, 48, 22, .20)");

      ctx.fillStyle = hole;
      ctx.beginPath();
      ctx.ellipse(0, .27, .61 * holeProgress, .27 * holeProgress, 0, 0, Math.PI * 2);
      ctx.fill();

      // Комочки земли разлетаются во время активного копания.
      if (isBurrowing && progress < .82) {
        const digging = Math.sin(progress * Math.PI) ** 2;

        for (let i = 0; i < 11; i++) {
          const cycle = (progress * 3.8 + i * .173) % 1;
          const side = i % 2 === 0 ? -1 : 1;
          const px = side * (.22 + cycle * (.58 + (i % 3) * .10));
          const py = .22 - Math.sin(cycle * Math.PI) * (.34 + (i % 4) * .06);
          const size = (.035 + (i % 3) * .014) * digging;

          ctx.fillStyle = i % 3 === 0 ? "#7c4925" : "#5d351b";
          ctx.beginPath();
          ctx.arc(px, py, Math.max(.012, size), 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    // После полного закапывания остаётся только нора.
    if (isGone) {
      ctx.restore();
      return;
    }

    let bodyProgress = 0;
    let diggingWiggle = 0;

    if (isBurrowing) {
      bodyProgress = Math.max(0, (progress - .12) / .88);
      diggingWiggle =
        Math.sin(ant.escapeTimer * 29) * .11 * (1 - bodyProgress * .7);

      // Муравей разворачивается к норе, быстро работает лапками и постепенно уходит вниз.
      ctx.translate(
        Math.sin(ant.escapeTimer * 19) * .055 * (1 - bodyProgress),
        bodyProgress * .48
      );
      ctx.rotate(ant.dir + diggingWiggle);
      ctx.scale(
        1 - bodyProgress * .50,
        Math.max(.10, 1 - bodyProgress * .91)
      );
      ctx.globalAlpha = Math.max(0, 1 - Math.max(0, progress - .76) / .24);
    } else {
      ctx.rotate(ant.dir);
    }

    if (!ant.alerted && !isBurrowing) {
      const cone = ctx.createLinearGradient(.35, 0, ANT_NOTICE_DISTANCE, 0);
      cone.addColorStop(0, "rgba(255, 231, 133, .14)");
      cone.addColorStop(1, "rgba(255, 231, 133, 0)");
      ctx.fillStyle = cone;
      ctx.beginPath();
      ctx.moveTo(.34, 0);
      ctx.lineTo(ANT_NOTICE_DISTANCE, -2.05);
      ctx.lineTo(ANT_NOTICE_DISTANCE, 2.05);
      ctx.closePath();
      ctx.fill();
    }

    const walk = isBurrowing
      ? Math.sin(ant.escapeTimer * 34) * .18
      : ant.alerted
        ? Math.sin(ant.step) * .10
        : Math.sin(t * 2.2) * .025;

    ctx.strokeStyle = "#24120b";
    ctx.lineWidth = .10;
    ctx.lineCap = "round";

    for (const side of [-1, 1]) {
      for (let i = -1; i <= 1; i++) {
        const legX = -.22 + i * .30;
        const legKick = isBurrowing
          ? walk * (i === 0 ? -1 : 1) * (side === 1 ? 1 : .72)
          : walk * (i === 0 ? -1 : 1);

        ctx.beginPath();
        ctx.moveTo(legX, side * .22);
        ctx.lineTo(legX + legKick, side * (.63 + Math.abs(walk) * .35));
        ctx.stroke();
      }
    }

    // Брюшко.
    const abdomen = ctx.createRadialGradient(-.32, -.18, .08, -.12, 0, .62);
    abdomen.addColorStop(0, "#8f5130");
    abdomen.addColorStop(.55, "#542719");
    abdomen.addColorStop(1, "#24100d");
    ctx.fillStyle = abdomen;
    ctx.beginPath();
    ctx.ellipse(-.30, 0, .58, .40, 0, 0, Math.PI * 2);
    ctx.fill();

    // Сегменты брюшка.
    ctx.strokeStyle = "rgba(28, 12, 8, .55)";
    ctx.lineWidth = .045;
    for (const x of [-.48, -.27, -.07]) {
      ctx.beginPath();
      ctx.moveTo(x, -.31);
      ctx.quadraticCurveTo(x + .06, 0, x, .31);
      ctx.stroke();
    }

    // Грудь.
    ctx.fillStyle = "#3a1b12";
    ctx.beginPath();
    ctx.ellipse(.28, 0, .34, .30, 0, 0, Math.PI * 2);
    ctx.fill();

    // Голова.
    ctx.fillStyle = "#25100c";
    ctx.beginPath();
    ctx.ellipse(.70, 0, .31, .28, 0, 0, Math.PI * 2);
    ctx.fill();

    // Глаза.
    ctx.fillStyle = ant.alerted ? "#ff5b44" : "#d9b56b";
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(.82, side * .12, .045, 0, Math.PI * 2);
      ctx.fill();
    }

    // Усики двигаются во время копания.
    const antennaMove = isBurrowing ? Math.sin(ant.escapeTimer * 25) * .07 : 0;
    ctx.strokeStyle = "#1e0d09";
    ctx.lineWidth = .055;
    ctx.beginPath();
    ctx.moveTo(.91, -.10);
    ctx.quadraticCurveTo(1.20, -.24 - antennaMove, 1.30, -.49 - antennaMove);
    ctx.moveTo(.91, .10);
    ctx.quadraticCurveTo(1.20, .24 + antennaMove, 1.30, .49 + antennaMove);
    ctx.stroke();

    ctx.restore();
  }

  function drawHornet(t) {
    if (hornet.escapeState === "gone") return;

    ctx.save();
    ctx.translate(hornet.x, hornet.y);

    if (hornet.escapeState === "flying") {
      const progress = Math.min(1, hornet.escapeTimer / 1.45);
      ctx.globalAlpha = 1 - progress;
      ctx.scale(1 + progress * .38, 1 + progress * .38);
    }

    ctx.rotate(hornet.dir);

    if (!hornet.alerted) {
      const cone = ctx.createLinearGradient(.38, 0, HORNET_NOTICE_DISTANCE, 0);
      cone.addColorStop(0, "rgba(255, 221, 92, .15)");
      cone.addColorStop(1, "rgba(255, 221, 92, 0)");
      ctx.fillStyle = cone;
      ctx.beginPath();
      ctx.moveTo(.38, 0);
      ctx.lineTo(HORNET_NOTICE_DISTANCE, -2.05);
      ctx.lineTo(HORNET_NOTICE_DISTANCE, 2.05);
      ctx.closePath();
      ctx.fill();
    }

    const wingBeat = hornet.alerted
      ? Math.sin(hornet.step * 1.7) * .18
      : Math.sin(t * 8) * .10;

    // Крылья.
    ctx.fillStyle = "rgba(211, 243, 255, .58)";
    ctx.strokeStyle = "rgba(113, 164, 183, .72)";
    ctx.lineWidth = .045;

    for (const side of [-1, 1]) {
      ctx.save();
      ctx.rotate(side * wingBeat);
      ctx.beginPath();
      ctx.ellipse(-.10, side * .42, .48, .19, side * .34, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    // Брюшко.
    ctx.fillStyle = "#f0b51f";
    ctx.beginPath();
    ctx.ellipse(-.28, 0, .62, .38, 0, 0, Math.PI * 2);
    ctx.fill();

    // Чёрные полосы.
    ctx.strokeStyle = "#21170a";
    ctx.lineWidth = .16;
    for (const x of [-.54, -.24, .04]) {
      ctx.beginPath();
      ctx.moveTo(x, -.31);
      ctx.lineTo(x, .31);
      ctx.stroke();
    }

    // Жало.
    ctx.fillStyle = "#23120a";
    ctx.beginPath();
    ctx.moveTo(-.88, 0);
    ctx.lineTo(-1.14, -.09);
    ctx.lineTo(-1.14, .09);
    ctx.closePath();
    ctx.fill();

    // Грудь.
    ctx.fillStyle = "#2b1b0d";
    ctx.beginPath();
    ctx.ellipse(.30, 0, .34, .31, 0, 0, Math.PI * 2);
    ctx.fill();

    // Голова.
    ctx.fillStyle = "#1c1109";
    ctx.beginPath();
    ctx.ellipse(.72, 0, .31, .28, 0, 0, Math.PI * 2);
    ctx.fill();

    // Глаза.
    ctx.fillStyle = hornet.alerted ? "#ff533e" : "#d7a329";
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(.84, side * .12, .05, 0, Math.PI * 2);
      ctx.fill();
    }

    // Усики.
    ctx.strokeStyle = "#1b0c08";
    ctx.lineWidth = .055;
    ctx.beginPath();
    ctx.moveTo(.91, -.10);
    ctx.quadraticCurveTo(1.18, -.25, 1.27, -.49);
    ctx.moveTo(.91, .10);
    ctx.quadraticCurveTo(1.18, .25, 1.27, .49);
    ctx.stroke();

    ctx.restore();
  }

  function drawBeetle(t) {
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.dir);

    const bob = Math.sin(t * 10) * .018;
    ctx.translate(0, bob);

    // Ножки.
    ctx.strokeStyle = "#140d0b";
    ctx.lineWidth = .07;
    ctx.lineCap = "round";

    for (const side of [-1, 1]) {
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(i * .12, side * .20);
        ctx.lineTo(i * .18, side * .42);
        ctx.stroke();
      }
    }

    // Голова божьей коровки.
    ctx.fillStyle = "#17100f";
    ctx.beginPath();
    ctx.ellipse(.31, 0, .20, .22, 0, 0, Math.PI * 2);
    ctx.fill();

    // Красный округлый панцирь.
    const shell = ctx.createRadialGradient(-.22, -.17, .04, -.03, 0, .48);
    shell.addColorStop(0, "#ff8067");
    shell.addColorStop(.48, "#df2f29");
    shell.addColorStop(1, "#7c1418");
    ctx.fillStyle = shell;
    ctx.beginPath();
    ctx.ellipse(-.05, 0, .41, .32, 0, 0, Math.PI * 2);
    ctx.fill();

    // Центральный шов крыльев.
    ctx.strokeStyle = "#2a1112";
    ctx.lineWidth = .055;
    ctx.beginPath();
    ctx.moveTo(-.44, 0);
    ctx.lineTo(.23, 0);
    ctx.stroke();

    // Чёрные пятна.
    ctx.fillStyle = "#171011";
    for (const [x, y, r] of [
      [-.25, -.15, .065],
      [-.25, .15, .065],
      [-.04, -.18, .058],
      [-.04, .18, .058],
      [.13, -.11, .052],
      [.13, .11, .052]
    ]) {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    // Белые отметины у головы.
    ctx.fillStyle = "#f4eadf";
    ctx.beginPath();
    ctx.arc(.24, -.10, .045, 0, Math.PI * 2);
    ctx.arc(.24, .10, .045, 0, Math.PI * 2);
    ctx.fill();

    // Усики.
    ctx.strokeStyle = "#160d0b";
    ctx.lineWidth = .042;
    ctx.beginPath();
    ctx.moveTo(.42, -.09);
    ctx.quadraticCurveTo(.58, -.22, .63, -.32);
    ctx.moveTo(.42, .09);
    ctx.quadraticCurveTo(.58, .22, .63, .32);
    ctx.stroke();

    ctx.restore();
  }

  function render() {
    drawBackground();

    const transform = worldTransform();
    const shakeX = cameraShake ? (Math.random() - .5) * cameraShake : 0;
    const shakeY = cameraShake ? (Math.random() - .5) * cameraShake : 0;

    ctx.save();
    ctx.translate(transform.ox + shakeX, transform.oy + shakeY);
    ctx.scale(transform.scale, transform.scale);

    drawMaze(elapsed);
    drawAnt(elapsed);
    drawHornet(elapsed);
    drawBeetle(elapsed);

    ctx.restore();

    ui.flash.style.opacity = String(flashValue * .75);
  }

  function loop(now) {
    const dt = Math.min(.05, Math.max(0, (now - lastTime) / 1000));
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  function handleQuestionKey(code) {
    if (!controlEnabled || paused || !questionGate) return false;

    if (code === "ArrowLeft" || code === "KeyA") {
      selectAnswer(0);
      return true;
    }
    if (code === "ArrowUp" || code === "ArrowDown" || code === "KeyW" || code === "KeyS") {
      selectAnswer(1);
      return true;
    }
    if (code === "ArrowRight" || code === "KeyD") {
      selectAnswer(2);
      return true;
    }
    return false;
  }

  function updateJoystickKnob() {
    const radius = 40;
    ui.joystickKnob.style.transform = `translate(calc(-50% + ${joystickInput.x * radius}px), calc(-50% + ${joystickInput.y * radius}px))`;
  }

  function updateJoystickFromPointer(event) {
    const rect = ui.mobileControls.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    let x = (event.clientX - centerX) / (rect.width * .36);
    let y = (event.clientY - centerY) / (rect.height * .36);
    const length = Math.hypot(x, y);
    if (length > 1) {
      x /= length;
      y /= length;
    }
    if (Math.hypot(x, y) < .12) {
      x = 0;
      y = 0;
    }
    joystickInput = { x, y };
    updateJoystickKnob();
    emitInputAction();
  }

  function releaseJoystick(event) {
    if (event && joystickPointerId !== null && event.pointerId !== joystickPointerId) return;
    joystickPointerId = null;
    joystickInput = { x: 0, y: 0 };
    updateJoystickKnob();
    emitInputAction(true);
  }

  canvas.addEventListener("pointerdown", () => focusGameInput(), { passive: true });

  ui.mobileControls.addEventListener("pointerdown", event => {
    if (!controlEnabled || paused || questionGate) return;
    joystickPointerId = event.pointerId;
    ui.mobileControls.setPointerCapture?.(event.pointerId);
    updateJoystickFromPointer(event);
    event.preventDefault();
  });
  ui.mobileControls.addEventListener("pointermove", event => {
    if (event.pointerId !== joystickPointerId) return;
    updateJoystickFromPointer(event);
    event.preventDefault();
  });
  ui.mobileControls.addEventListener("pointerup", releaseJoystick);
  ui.mobileControls.addEventListener("pointercancel", releaseJoystick);
  ui.mobileControls.addEventListener("lostpointercapture", releaseJoystick);

  ui.pauseBtn.addEventListener("click", () => {
    if (controlEnabled) togglePause();
  });

  ui.answers.forEach((answer, index) => {
    answer.addEventListener("pointerdown", event => {
      if (!controlEnabled || paused || !questionGate) return;
      event.preventDefault();
      selectAnswer(index);
    });
  });

  window.addEventListener("keydown", event => {
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space"].includes(event.code)) {
      event.preventDefault();
    }
    if (!controlEnabled) return;
    if (event.code === "Space") {
      if (!event.repeat) togglePause();
      return;
    }
    if (paused) return;
    if (handleQuestionKey(event.code)) return;
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "KeyW", "KeyA", "KeyS", "KeyD"].includes(event.code)) {
      if (!keys[event.code]) {
        keys[event.code] = true;
        emitInputAction(true);
      }
    }
  });

  window.addEventListener("keyup", event => {
    if (!keys[event.code]) return;
    keys[event.code] = false;
    emitInputAction(true);
  });

  window.addEventListener("blur", () => {
    for (const key in keys) keys[key] = false;
    releaseJoystick();
  });

  window.addEventListener("message", event => {
    if (event.origin !== window.location.origin) return;
    const message = event.data;
    if (!message || message.source !== "alex-board-host") return;
    const payload = message.payload ?? {};

    if (message.type === "GAME_RESTART" && controlEnabled) resetGame();
    if (message.type === "GAME_GET_STATE") notifyHost("GAME_STATE", getGameSummary());
    if (message.type === "GAME_GET_SYNC_STATE") {
      notifyHost("GAME_SYNC_STATE", {
        requestId: payload.requestId ?? null,
        state: getSyncNetworkState()
      });
    }
    if (message.type === "GAME_GET_FULL_STATE") {
      notifyHost("GAME_FULL_STATE", {
        requestId: payload.requestId ?? null,
        state: getFullNetworkState()
      });
    }
    if (message.type === "GAME_APPLY_SYNC_STATE") {
      applySyncNetworkState(payload.state, { snap: false });
    }
    if (message.type === "GAME_APPLY_FULL_STATE") {
      applyFullNetworkState(payload.state);
    }
    if (message.type === "GAME_APPLY_ACTION") {
      applyRemoteAction(payload.action);
    }
    if (message.type === "GAME_SET_NETWORK_MODE") {
      setNetworkMode(payload.mode, payload.controlEnabled);
    }
    if (message.type === "GAME_SET_CONTROL_ENABLED") {
      controlEnabled = Boolean(payload.enabled) && networkMode !== "observer";
      setNetworkMode(networkMode, controlEnabled);
    }
    if (message.type === "GAME_FOCUS_INPUT") {
      focusGameInput();
    }
  });

  ui.startBtn.addEventListener("click", () => {
    if (!controlEnabled) return;
    notifyAction({ kind: "restart" });
    resetGame();
  });
  ui.restartBtn.addEventListener("click", () => {
    if (!controlEnabled) return;
    notifyAction({ kind: "restart" });
    resetGame();
  });

  canvas.tabIndex = 0;
  resize();
  createMaze();
  createGates();
  updateHud();
  setNetworkMode(networkMode, controlEnabled);
  notifyHost("GAME_READY", getGameSummary());
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
